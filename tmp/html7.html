<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thin-Film Fluid Laboratory</title>
<style>
  :root{
    --bg:#04060a;
    --panel:rgba(9,12,16,.74);
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.18);
    --txt:#c6d1d8;
    --dim:#7d8994;
    --hi:#eef4f8;
    --accent:#5fd7c4;
    --accent-2:#7bb8ff;
    --err:#ff7b72;
    --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#04060a;touch-action:none}

  /* ---------- brand ---------- */
  #brand{position:fixed;left:16px;top:14px;z-index:15;pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.9)}
  #brand .t{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(238,244,248,.78)}
  #brand .s{font-family:var(--mono);font-size:10px;color:rgba(238,244,248,.34);margin-top:4px;letter-spacing:.04em}

  /* ---------- panel ---------- */
  #panel{position:fixed;top:14px;right:14px;width:344px;max-height:calc(100vh - 28px);
    display:flex;flex-direction:column;z-index:25;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    font-size:12px;overflow:hidden}
  #panel.collapsed .p-body,#panel.collapsed .p-foot{display:none}
  .p-head{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .p-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hi);font-weight:600}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--line-2);
    border-radius:3px;color:var(--accent);white-space:nowrap}
  .badge.warn{color:#ffcf8b;border-color:rgba(255,207,139,.4)}
  .badge.err{color:var(--err);border-color:rgba(255,123,114,.45)}
  .spacer{flex:1 1 auto}
  .p-body{overflow-y:auto;overscroll-behavior:contain;padding:2px 0 6px;flex:1 1 auto;min-height:0}
  .p-body::-webkit-scrollbar{width:9px}
  .p-body::-webkit-scrollbar-track{background:transparent}
  .p-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border:3px solid transparent;background-clip:content-box;border-radius:6px}
  .p-body::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box}
  .p-foot{flex:0 0 auto;padding:7px 11px;border-top:1px solid var(--line);color:var(--dim);font-size:10px;
    display:flex;flex-wrap:wrap;gap:4px 9px;font-family:var(--mono)}
  kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;
    padding:0 4px;color:var(--txt);background:rgba(255,255,255,.04)}

  section.sec{border-bottom:1px solid rgba(255,255,255,.055)}
  .sec-h{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;border-radius:0;
    padding:9px 11px;color:var(--dim);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;text-align:left}
  .sec-h:hover{background:rgba(255,255,255,.035);color:var(--txt)}
  .sec-h .caret{font-size:8px;color:var(--accent);transition:transform .16s ease;display:inline-block}
  section.sec[data-open="0"] .caret{transform:rotate(-90deg)}
  section.sec[data-open="0"] .sec-b{display:none}
  .sec-n{margin-left:auto;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.18)}

  .row{display:grid;grid-template-columns:1fr 100px 46px;align-items:center;gap:9px;padding:2px 11px}
  .row label{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:ew-resize;user-select:none}
  .row label:hover{color:var(--txt)}
  .row output{font-family:var(--mono);font-size:10.5px;color:var(--hi);text-align:right;font-variant-numeric:tabular-nums}
  .row.off{opacity:.38}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:7px 11px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px 11px}
  .field{padding:5px 11px 7px}
  .field > span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .hint{padding:2px 11px 9px;color:rgba(255,255,255,.26);font-size:10px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.15);border-radius:1px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:12px;margin-top:-5px;border-radius:2px;
    background:var(--accent);box-shadow:0 0 0 1px rgba(0,0,0,.65)}
  input[type=range]:hover::-webkit-slider-thumb{background:var(--hi)}
  input[type=range]:active::-webkit-slider-thumb{background:#fff}
  input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.15);border-radius:1px}
  input[type=range]::-moz-range-thumb{width:9px;height:12px;border:0;border-radius:2px;background:var(--accent)}
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--accent-2)}
  input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 2px var(--accent-2)}

  button{font:inherit;font-size:11px;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:4px;padding:5px 8px;cursor:pointer;line-height:1.2;transition:background .12s,color .12s}
  button:hover{background:rgba(255,255,255,.11);color:var(--hi)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
  button[aria-pressed="true"]{background:rgba(95,215,196,.15);border-color:rgba(95,215,196,.45);color:#bff3e8}
  button.icon{padding:4px 7px;min-width:28px;font-family:var(--mono);font-size:10px}
  select{font:inherit;font-size:11px;color:var(--hi);background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:4px;padding:5px 6px;width:100%;cursor:pointer}
  select:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
  select option{background:#0b0f14;color:var(--txt)}

  /* ---------- hud ---------- */
  #hud{position:fixed;left:16px;bottom:14px;z-index:15;pointer-events:none;white-space:pre;
    font-family:var(--mono);font-size:10px;line-height:1.65;color:var(--dim);
    background:rgba(6,9,12,.5);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #hud b{color:var(--txt);font-weight:500}

  /* ---------- status ---------- */
  #status{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;
    display:flex;flex-direction:column;gap:6px;align-items:center;max-width:min(760px,86vw);pointer-events:none}
  .toast{pointer-events:auto;font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--txt);
    background:rgba(10,14,18,.88);border:1px solid var(--line);border-radius:7px;padding:7px 10px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:100%;display:flex;gap:9px;align-items:flex-start;
    animation:tin .22s ease-out}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .toast .tag{color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-size:9px;padding-top:1px}
  .toast.warn .tag{color:#ffcf8b}
  .toast.err .tag{color:var(--err)}
  .toast.err{border-color:rgba(255,123,114,.4)}
  .toast pre{margin:4px 0 0;max-height:150px;overflow:auto;font-size:10px;color:#ffd9d6;white-space:pre-wrap}
  .toast .x{background:none;border:0;color:var(--dim);padding:0 2px;font-family:var(--mono)}
  .toast .x:hover{color:var(--hi)}

  /* ---------- dialog ---------- */
  dialog{border:1px solid var(--line-2);background:#0a0e13;color:var(--txt);border-radius:10px;padding:0;
    width:min(560px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.7)}
  dialog::backdrop{background:rgba(0,0,0,.62)}
  dialog h2{margin:0;padding:11px 13px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--hi);border-bottom:1px solid var(--line);font-weight:600}
  .m-body{padding:12px 13px}
  .m-body p{margin:0 0 9px;color:var(--dim);font-size:11.5px;line-height:1.5}
  .m-foot{display:flex;gap:7px;justify-content:flex-end;padding:0 13px 13px}
  textarea{width:100%;min-height:170px;background:#06090c;color:var(--hi);border:1px solid var(--line);
    border-radius:6px;font-family:var(--mono);font-size:11px;padding:9px;resize:vertical;line-height:1.45}
  textarea:focus-visible{outline:2px solid var(--accent-2);outline-offset:-1px}
  .errline{color:var(--err);font-family:var(--mono);font-size:10.5px;margin:8px 0 0;min-height:1em}

  body.ui-hidden #panel,body.ui-hidden #brand,body.ui-hidden #hud{opacity:0;pointer-events:none}
  #panel,#brand,#hud{transition:opacity .28s ease}

  @media (max-width:820px){
    #panel{width:min(92vw,330px)}
    #hud{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #panel,#brand,#hud{transition:none}
    .toast{animation:none}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Thin-film interference visualisation"></canvas>

<div id="brand">
  <div class="t">Thin-Film Fluid Laboratory</div>
  <div class="s" id="brand-sub">initialising gpu …</div>
</div>

<aside id="panel" aria-label="Simulation and rendering controls">
  <div class="p-head">
    <span class="p-title">Console</span>
    <span class="badge" id="badge">INIT</span>
    <span class="spacer"></span>
    <button class="icon" id="btn-pause" title="Pause / resume  (Space)" aria-label="Pause or resume simulation">II</button>
    <button class="icon" id="btn-collapse" title="Collapse / expand panel" aria-expanded="true" aria-label="Collapse panel">&minus;</button>
  </div>
  <div class="p-body" id="p-body"></div>
  <div class="p-foot" id="p-foot"></div>
</aside>

<div id="hud" aria-hidden="true"></div>
<div id="status" role="status" aria-live="polite"></div>

<dialog id="modal">
  <h2 id="modal-title">Settings</h2>
  <div class="m-body">
    <p id="modal-note"></p>
    <textarea id="modal-text" spellcheck="false" aria-label="Settings JSON"></textarea>
    <p class="errline" id="modal-err"></p>
  </div>
  <div class="m-foot">
    <button id="modal-a2" value="cancel" type="button">Cancel</button>
    <button id="modal-a1" value="ok" type="button">OK</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  /* ============================================================
     0. small utilities
     ============================================================ */
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var num = function (v, d) { v = Number(v); return Number.isFinite(v) ? v : d; };
  var TAU = Math.PI * 2;

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) {
      for (var k in props) {
        var v = props[k];
        if (v === null || v === undefined) continue;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k === 'html') n.innerHTML = v;
        else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
        else if (k === 'dataset') { for (var d in v) n.dataset[d] = v[d]; }
        else n.setAttribute(k, v);
      }
    }
    if (kids) kids.forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  /* ============================================================
     1. parameter model  (single source of truth for UI + renderer)
     ============================================================ */
  var GROUPS = [
    { id: 'sim', label: 'Simulation' },
    { id: 'opt', label: 'Optical Appearance' },
    { id: 'light', label: 'Lighting' },
    { id: 'render', label: 'Rendering' }
  ];

  /* mut = relative mutation weight for the Mutate action */
  var PARAM_DEFS = [
    { k: 'flowSpeed', g: 'sim', l: 'Flow Speed', min: 0, max: 3, step: 0.01, def: 0.55, mut: 1.1 },
    { k: 'flowScale', g: 'sim', l: 'Flow Scale', min: 0.2, max: 3, step: 0.01, def: 0.95, mut: 0.8 },
    { k: 'turbulence', g: 'sim', l: 'Turbulence', min: 0, max: 1.5, step: 0.01, def: 0.55, mut: 1.0 },
    { k: 'warpAmt', g: 'sim', l: 'Domain Warp', min: 0, max: 2.5, step: 0.01, def: 1.05, mut: 1.0 },
    { k: 'vorticity', g: 'sim', l: 'Vorticity', min: 0, max: 1.5, step: 0.01, def: 0.50, mut: 1.1 },
    { k: 'fineDetail', g: 'sim', l: 'Fine Detail', min: 0, max: 1, step: 0.01, def: 0.50, mut: 0.9 },
    { k: 'thickness', g: 'sim', l: 'Film Thickness', min: 0, max: 1, step: 0.005, def: 0.355, mut: 0.55 },
    { k: 'thicknessVar', g: 'sim', l: 'Thickness Variation', min: 0, max: 1, step: 0.01, def: 0.70, mut: 0.8 },
    { k: 'drainage', g: 'sim', l: 'Drainage Bias', min: -1, max: 1, step: 0.01, def: 0.22, mut: 1.2 },
    { k: 'tension', g: 'sim', l: 'Surface Tension', min: 0, max: 1, step: 0.01, def: 0.55, mut: 0.9 },

    { k: 'interference', g: 'opt', l: 'Interference Strength', min: 0, max: 1, step: 0.01, def: 0.78, mut: 0.8 },
    { k: 'spread', g: 'opt', l: 'Spectral Spread', min: 0.35, max: 1.4, step: 0.01, def: 1.00, mut: 0.7 },
    { k: 'saturation', g: 'opt', l: 'Saturation', min: 0, max: 2, step: 0.01, def: 1.15, mut: 0.6 },
    { k: 'exposure', g: 'opt', l: 'Exposure', min: 0.2, max: 3, step: 0.01, def: 1.15, mut: 0.4 },
    { k: 'contrast', g: 'opt', l: 'Contrast', min: 0.5, max: 1.9, step: 0.01, def: 1.10, mut: 0.4 },
    { k: 'fresnel', g: 'opt', l: 'Fresnel Strength', min: 0, max: 1.6, step: 0.01, def: 0.85, mut: 0.8 },
    { k: 'specStrength', g: 'opt', l: 'Specular Strength', min: 0, max: 2, step: 0.01, def: 0.90, mut: 0.8 },
    { k: 'specSharpness', g: 'opt', l: 'Specular Sharpness', min: 0, max: 1, step: 0.01, def: 0.70, mut: 0.8 },

    { k: 'lightAz', g: 'light', l: 'Light Azimuth', min: 0, max: 360, step: 1, def: 52, mut: 1.4 },
    { k: 'lightEl', g: 'light', l: 'Light Elevation', min: 2, max: 88, step: 1, def: 34, mut: 0.8 },
    { k: 'lightMotion', g: 'light', l: 'Light Motion Speed', min: 0, max: 1.5, step: 0.01, def: 0.32, mut: 1.0 },
    { k: 'highlight', g: 'light', l: 'Highlight Intensity', min: 0, max: 2, step: 0.01, def: 1.00, mut: 0.7 },
    { k: 'ambient', g: 'light', l: 'Ambient Light', min: 0, max: 1.2, step: 0.01, def: 0.38, mut: 0.7 },

    { k: 'renderScale', g: 'render', l: 'Render Scale', min: 0.4, max: 2, step: 0.05, def: 1.00, mut: 0 },
    { k: 'aaAmt', g: 'render', l: 'Footprint AA', min: 0, max: 1, step: 0.01, def: 0.60, mut: 0.7 },
    { k: 'temporalSpeed', g: 'render', l: 'Temporal Speed', min: 0, max: 2, step: 0.01, def: 1.00, mut: 0.7 },
    { k: 'grain', g: 'render', l: 'Grain / Dither', min: 0, max: 1, step: 0.01, def: 0.22, mut: 0.8 }
  ];
  var DEF_BY_KEY = {};
  PARAM_DEFS.forEach(function (d) { DEF_BY_KEY[d.k] = d; });
  var PARAM_KEYS = PARAM_DEFS.map(function (d) { return d.k; });

  /* Quality tiers really do change shader workload: noise octaves, spectral
     sample count, normal estimation taps, footprint-AA taps. */
  var QUALITY = {
    low:    { label: 'Low',    octN: 3, specN: 4,  normalMode: 0, aaTaps: 1, detailGain: 0.80, gridDiv: 6 },
    medium: { label: 'Medium', octN: 4, specN: 6,  normalMode: 1, aaTaps: 2, detailGain: 1.00, gridDiv: 5 },
    high:   { label: 'High',   octN: 4, specN: 9,  normalMode: 1, aaTaps: 4, detailGain: 1.15, gridDiv: 4 },
    ultra:  { label: 'Ultra',  octN: 6, specN: 14, normalMode: 1, aaTaps: 5, detailGain: 1.35, gridDiv: 3 }
  };
  var Q_ORDER = ['low', 'medium', 'high', 'ultra'];

  /* Presets alter simulation *and* optics *and* workload. */
  var PRESETS = {
    soap: {
      label: 'Soap Film', quality: 'high',
      p: { flowSpeed: 0.42, flowScale: 0.88, turbulence: 0.45, warpAmt: 0.95, vorticity: 0.38, fineDetail: 0.55,
           thickness: 0.30, thicknessVar: 0.62, drainage: 0.48, tension: 0.72,
           interference: 0.88, spread: 1.05, saturation: 1.05, exposure: 1.12, contrast: 1.10, fresnel: 0.95,
           specStrength: 1.00, specSharpness: 0.78,
           lightAz: 55, lightEl: 38, lightMotion: 0.22, highlight: 1.05, ambient: 0.40,
           renderScale: 1.00, aaAmt: 0.65, temporalSpeed: 0.95, grain: 0.20 }
    },
    oil: {
      label: 'Oil Slick', quality: 'high',
      p: { flowSpeed: 0.62, flowScale: 0.62, turbulence: 0.85, warpAmt: 1.55, vorticity: 0.72, fineDetail: 0.42,
           thickness: 0.46, thicknessVar: 0.85, drainage: 0.05, tension: 0.38,
           interference: 0.95, spread: 1.25, saturation: 1.40, exposure: 1.22, contrast: 1.18, fresnel: 0.72,
           specStrength: 1.15, specSharpness: 0.60,
           lightAz: 118, lightEl: 26, lightMotion: 0.35, highlight: 1.15, ambient: 0.30,
           renderScale: 1.00, aaAmt: 0.55, temporalSpeed: 1.00, grain: 0.25 }
    },
    violet: {
      label: 'Deep Violet', quality: 'high',
      p: { flowSpeed: 0.30, flowScale: 0.55, turbulence: 0.35, warpAmt: 1.20, vorticity: 0.30, fineDetail: 0.35,
           thickness: 0.22, thicknessVar: 0.52, drainage: 0.30, tension: 0.66,
           interference: 0.98, spread: 0.68, saturation: 1.55, exposure: 1.05, contrast: 1.30, fresnel: 1.10,
           specStrength: 0.85, specSharpness: 0.85,
           lightAz: 205, lightEl: 22, lightMotion: 0.16, highlight: 0.95, ambient: 0.22,
           renderScale: 1.00, aaAmt: 0.60, temporalSpeed: 0.70, grain: 0.28 }
    },
    cells: {
      label: 'Electric Cells', quality: 'ultra',
      p: { flowSpeed: 0.80, flowScale: 1.45, turbulence: 1.05, warpAmt: 0.70, vorticity: 1.05, fineDetail: 0.80,
           thickness: 0.52, thicknessVar: 0.78, drainage: -0.12, tension: 0.88,
           interference: 1.00, spread: 1.10, saturation: 1.25, exposure: 1.28, contrast: 1.35, fresnel: 1.25,
           specStrength: 1.30, specSharpness: 0.80,
           lightAz: 300, lightEl: 45, lightMotion: 0.55, highlight: 1.30, ambient: 0.30,
           renderScale: 0.90, aaAmt: 0.70, temporalSpeed: 1.10, grain: 0.18 }
    },
    calm: {
      label: 'Calm Membrane', quality: 'medium',
      p: { flowSpeed: 0.16, flowScale: 0.48, turbulence: 0.18, warpAmt: 0.55, vorticity: 0.12, fineDetail: 0.25,
           thickness: 0.40, thicknessVar: 0.34, drainage: 0.10, tension: 0.50,
           interference: 0.62, spread: 0.85, saturation: 0.95, exposure: 1.18, contrast: 1.02, fresnel: 0.60,
           specStrength: 0.70, specSharpness: 0.45,
           lightAz: 78, lightEl: 55, lightMotion: 0.10, highlight: 0.70, ambient: 0.62,
           renderScale: 1.00, aaAmt: 0.75, temporalSpeed: 0.45, grain: 0.14 }
    },
    chaos: {
      label: 'Chaotic Laboratory', quality: 'ultra',
      p: { flowSpeed: 1.75, flowScale: 1.80, turbulence: 1.35, warpAmt: 2.10, vorticity: 1.30, fineDetail: 0.90,
           thickness: 0.58, thicknessVar: 0.95, drainage: -0.35, tension: 0.30,
           interference: 1.00, spread: 1.30, saturation: 1.45, exposure: 1.30, contrast: 1.25, fresnel: 1.00,
           specStrength: 1.20, specSharpness: 0.55,
           lightAz: 140, lightEl: 18, lightMotion: 1.00, highlight: 1.45, ambient: 0.28,
           renderScale: 0.80, aaAmt: 0.45, temporalSpeed: 1.45, grain: 0.30 }
    },
    bismuth: {
      label: 'Bismuth Bath', quality: 'high',
      p: { flowSpeed: 0.50, flowScale: 1.10, turbulence: 0.60, warpAmt: 1.35, vorticity: 0.85, fineDetail: 0.62,
           thickness: 0.62, thicknessVar: 0.58, drainage: 0.15, tension: 0.62,

'  res : vec2f,',

'  var h = 0.50',
'        + (0.34 * u.thicknessVar) * basins',
'        + (0.24 * u.thicknessVar) * (mid - 0.42)',
'        + (0.12 * u.thicknessVar) * (cell - 0.55)',

'',
'/* cheaper variant used only for the finite differences that build the',

'  let tf = u.tFlow; let ts = u.tSlow;',

'',
'/* pointer disturbance: gaussian push + expanding thickness ripple */',
'fn pointerFx(p : vec2f) -> vec3f {',
'  var disp = vec2f(0.0);',
'  var add = 0.0;',
'  for (var i = 0; i < 8; i = i + 1) {',
'    let a = u.rippleA[i];',

'  let xr = (wl - 632.0) * 0.0294;',

'  let xb = (wl - 462.0) * 0.0303;',

'  var col = vec3f(0.0);',
'  var acc = vec3f(0.0);',

'  let w1 = 560.0 + 176.0 * u.spread;',

'    let R = num / (1.0 + num);',

'  var refl = thinFilm(dNm, cosV, ns);',
'  let taps = clamp(u.misc.y, 1.0, 8.0);',
'  if (taps > 1.001) {',
'    let gNm = vec2f(gx, gy) * 1180.0 * (0.26 + 0.95 * u.thicknessVar);',
'    var acc = refl;',
'    var cnt : f32 = 1.0;',
'    let px = 1.0 / max(res.y, 64.0);',
'    for (var i = 0; i < 8; i = i + 1) {',
'      if (f32(i) >= taps) { break; }',
'      let fi = f32(i) + 0.5;',
'      let ang = fi * 2.39996;',
'      let off = vec2f(cos(ang), sin(ang)) * px * (0.36 + 0.42 * sqrt(fi));',

'  }',

'  let nz = max(nrm.z, 0.0);',
'  let rdir = normalize(vec3f(2.0 * nz * nrm.xy, 2.0 * nz * nz - 1.0));',
'  let env = envReflect(rdir);',

'  var col = refl * (u.ambient * 0.75 + 0.95 * dif1 + 0.50 * dif2 * u.light2.w);',

'  col = col + refl * clamp(curv, 0.0, 1.0) * 0.18 * (0.4 + u.ambient);',
'  col = col + refl * refl * 0.22 * u.ambient;',

'  col = tonemap(max(col, vec3f(0.0)) * max(u.exposure, 0.0));',
'  col = pow(col, vec3f(1.0 / 2.2));',
'  col = clamp((col - vec3f(0.5)) * u.contrast + vec3f(0.5), vec3f(0.0), vec3f(1.0));',
'  let lum = dot(col, vec3f(0.2126, 0.7152, 0.0722));',

'  col = col * clamp(1.0 - 0.62 * dot(vc, vc), 0.0, 1.0);',
'  let g = hash12(fc.xy + vec2f(u.misc.z * 7.13, u.misc.z * 3.71)) - 0.5;',
'  col = col + g * (0.004 + 0.05 * u.grain);',

  var GLSL_FRAG = [
'#version 300 es',
'precision highp float;',

'out vec4 fragColor;',
'',
'const float PI = 3.14159265;',
'const float TAU = 6.28318531;',

'                fbm(p + vec2(5.20, 1.75), tf*0.24 + 7.0, 2));',
'  vec2 r = p + u.warpAmt * (1.05*q + 0.45*vec2(q.y, -q.x));',
'  float basins = fbm(r*0.42 + vec2(2.1, -1.4), tf*0.09, 2);',

'',
'vec3 pointerFx(vec2 p){',

'  float xr = (wl - 632.0) * 0.0294;',

'  float nz = max(nrm.z, 0.0);',

        '· taps   spec ' + QUALITY[app.effQuality].specN + ' / aa ' + QUALITY[app.effQuality].aaTaps +
        ' / oct ' + QUALITY[app.effQuality].octN);
      this.hud.textContent = L.join('\n');
    }
  };
  function pad(s, n) { s = String(s); return s.length >= n ? s : s + ' '.repeat(n - s.length); }
  function shorten(s, n) { s = String(s).replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function fmtVal(d, v) {
    var dec = (d.step < 0.01 ? 3 : (d.step < 0.1 ? 2 : (d.step < 1 ? 1 : 0)));
    if (d.k === 'lightAz' || d.k === 'lightEl') return Math.round(v) + '°';
    return Number(v).toFixed(dec);
  }
  function toggleSec(btn, sec) {
    var open = sec.dataset.open === '1';
    sec.dataset.open = open ? '0' : '1';
    btn.setAttribute('aria-expanded', open ? 'false' : 'true');
  }

  /* modal helper (native <dialog> when available) */
  function showModal(opts) {
    var dlg = document.getElementById('modal');
    document.getElementById('modal-title').textContent = opts.title;
    document.getElementById('modal-note').textContent = opts.note || '';
    var ta = document.getElementById('modal-text');
    ta.value = opts.text || '';
    ta.readOnly = !!opts.readOnly;
    var err = document.getElementById('modal-err');
    err.textContent = opts.error || '';
    var a1 = document.getElementById('modal-a1'), a2 = document.getElementById('modal-a2');
    a1.textContent = opts.ok || 'OK';
    a2.textContent = opts.cancel || 'Cancel';
    a2.style.display = opts.hideCancel ? 'none' : '';
    var cleanup = function () { a1.onclick = null; a2.onclick = null; };
    a1.onclick = function () { if (opts.onOk && opts.onOk(ta.value) === false) return; cleanup(); dlg.close(); };
    a2.onclick = function () { cleanup(); dlg.close(); };
    try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); }
    setTimeout(function () { try { ta.focus(); ta.select(); } catch (e2) {} }, 30);
  }

  /* ============================================================
     11. application
     ============================================================ */
  var App = {
    canvas: document.getElementById('stage'),
    renderer: null,
    perf: new Perf(),
    adaptive: new Adaptive(),
    pointers: new PointerField(8),
    w: 0, h: 0, cssW: 1, cssH: 1, dpr: 1,
    effRenderScale: 1, effQuality: 'high',
    tFlow: 0, tSlow: 0, tLight: 0, frame: 0,
    paused: false, gpuInfo: '',
    tween: null,
    diagnostics: [],

    start: function () {
      var self = this;
      UI.build();
      UI.applyCollapse();
      var stored = Store.load();
      if (stored) {
        Object.keys(stored.p).forEach(function (k) { State.p[k] = stored.p[k]; });
        Object.keys(stored.opt || {}).forEach(function (k) { if (stored.opt[k] !== undefined) State.opt[k] = stored.opt[k]; });
        if (!State.opt.qualityCeiling) State.opt.qualityCeiling = State.opt.quality;
        this.diagnostics.push('Restored saved session state.');
        UI.sync();
      }
      this.initRenderer().then(function (ok) {
        if (!ok) { UI.setBadge('NO RENDERER', 'err'); self.running = false; }
        self.attachPointer();
        self.attachKeys();
        self.attachWindow();
        self.resize(true);
        UI.writeHud(self);
        self.last = performance.now();
        self.running = true;
        requestAnimationFrame(function (t) { self.tick(t); });
      });
    },

    initRenderer: function () {
      var self = this;
      var chain = [
        ['WebGPU', function () { return new WebGPURenderer(self.canvas); }],
        ['WebGL2', function () { return new WebGL2Renderer(self.canvas); }],
        ['Canvas2D', function () { return new Canvas2DRenderer(self.canvas); }]
      ];
      var i = 0;
      function attempt() {
        if (i >= chain.length) {
          Status.error('No renderer could be initialised.', self.diagnostics.join('\n'));
          UI.setBadge('FAILED', 'err');
          self.sub.textContent = 'renderer unavailable';
          return Promise.resolve(false);
        }
        var label = chain[i][0];
        var r = null;
        try { r = chain[i][1](); }
        catch (e) {
          self.diagnostics.push(label + ': ' + e.message);
          i++; return attempt();
        }
        var p;
        try { p = Promise.resolve(r.init()); }
        catch (e) { p = Promise.reject(e); }
        return p.then(function () {
          self.renderer = r;
          State.opt.backend = r.name;
          self.effQuality = State.opt.quality;
          self.gpuInfo = r.info || '';
          UI.setBadge(r.name.toUpperCase(), r.name === 'Canvas2D' ? 'warn' : '');
          self.sub.textContent = r.name.toLowerCase() + (self.gpuInfo ? ' · ' + shorten(self.gpuInfo, 44) : '') + ' · ' + (State.p.thickness * 1180 | 0) + ' nm nominal';
          if (self.diagnostics.length) Status.info('Renderer notes: ' + self.diagnostics.join(' | '));
          Status.info(label + ' renderer active.');
          return true;
        }).catch(function (err) {
          self.diagnostics.push(label + ': ' + (err && err.message ? err.message : String(err)));
          Status.warn(label + ' unavailable — trying next backend.');
          if (err && err.message && /shader|WGSL|link/i.test(err.message)) Status.error(label + ' shader problem', err.message);
          try { r.destroy && r.destroy(); } catch (e2) {}
          self.replaceCanvas();
          i++;
          return attempt();
        });
      }
      return attempt();
    },

    /* a failed context request can poison a canvas element — swap in a clean one */
    replaceCanvas: function () {
      var old = this.canvas;
      var c = document.createElement('canvas');
      c.id = 'stage';
      c.setAttribute('aria-label', 'Thin-film interference visualisation');
      c.style.cssText = old.style.cssText;
      if (old.parentNode) old.parentNode.replaceChild(c, old);
      this.canvas = c;
      this.w = 0; this.h = 0;
    },

    recoverFromRendererLoss: function () {
      var self = this;
      this.running = false;
      this.replaceCanvas();
      this.initRenderer().then(function (ok) {
        if (ok) { self.resize(true); self.running = true; self.last = performance.now(); requestAnimationFrame(function (t) { self.tick(t); }); }
      });
    },

    effectiveRatio: function () {
      var dpr = window.devicePixelRatio || 1;
      var manual = State.p.renderScale || 1;
      var scale = State.opt.adaptive ? clamp(manual * this.adaptive.scale, 0.35, 2.0) : manual;
      this.dpr = dpr; this.effRenderScale = scale;
      return clamp(dpr * scale, 0.4, 2.0);
    },

    resize: function (force) {
      if (!this.renderer) return;
      var cssW = Math.max(1, this.canvas.clientWidth || window.innerWidth);
      var cssH = Math.max(1, this.canvas.clientHeight || window.innerHeight);
      var ratio = this.effectiveRatio();
      var w = Math.max(2, Math.round(cssW * ratio));
      var h = Math.max(2, Math.round(cssH * ratio));
      if (!force && w === this.w && h === this.h && cssW === this.cssW && cssH === this.cssH) return;
      this.cssW = cssW; this.cssH = cssH; this.w = w; this.h = h;
      this.canvas.width = w; this.canvas.height = h;
      this.renderer.resize(w, h, cssW, cssH);
      this.renderOnce();
    },

    attachWindow: function () {
      var self = this, raf = false;
      function onResize() {
        if (raf) return;
        raf = true;
        requestAnimationFrame(function () { raf = false; self.resize(); });
      }
      window.addEventListener('resize', onResize);
      if (window.ResizeObserver) {
        try { new ResizeObserver(onResize).observe(this.canvas); } catch (e) {}
      }
      var mq;
      function watchDPR() {
        var d = window.devicePixelRatio || 1;
        try {
          if (mq && mq.removeEventListener) mq.removeEventListener('change', onDPR);
          mq = window.matchMedia('(resolution: ' + d + 'dppx)');
          if (mq.addEventListener) mq.addEventListener('change', onDPR);
        } catch (e) {}
      }
      function onDPR() { watchDPR(); self.resize(); }
      watchDPR();
      document.addEventListener('fullscreenchange', function () {
        UI.sync();
        setTimeout(function () { self.resize(true); }, 60);
      });
    },

    toP: function (ev) {
      var r = this.canvas.getBoundingClientRect();
      var aspect = (r.width || 1) / (r.height || 1);
      return {
        x: ((ev.clientX - r.left) / (r.width || 1) - 0.5) * aspect,
        y: ((ev.clientY - r.top) / (r.height || 1) - 0.5)
      };
    },

    attachPointer: function () {
      var self = this, last = performance.now(), down = false, moved = 0;
      var c = this.canvas;
      c.addEventListener('pointerdown', function (ev) {
        down = true; moved = 0;
        try { c.setPointerCapture(ev.pointerId); } catch (e) {}
        var p = self.toP(ev);
        self.pointers.press(p.x, p.y, ev.button === 2 || ev.buttons > 1);
        last = performance.now();
      });
      c.addEventListener('pointermove', function (ev) {
        var t = performance.now();
        var dt = Math.max(0.001, (t - last) / 1000);
        last = t;
        var p = self.toP(ev);
        self.pointers.move(p.x, p.y, dt);
        moved += Math.abs(ev.movementX || 0) + Math.abs(ev.movementY || 0);
      });
      function up(ev) {
        if (!down) return;
        down = false;
        try { c.releasePointerCapture(ev.pointerId); } catch (e) {}
      }
      c.addEventListener('pointerup', up);
      c.addEventListener('pointercancel', up);
      c.addEventListener('contextmenu', function (ev) { if (ev.target === c) ev.preventDefault(); });
    },

    attachKeys: function () {
      var self = this;
      window.addEventListener('keydown', function (ev) {
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
        var t = ev.target;
        var inField = t && t.closest && t.closest('input, select, textarea, button');
        if (ev.key === 'Escape') return;
        var k = ev.key.toLowerCase();
        if (inField && k !== 'h' && k !== 'escape') return;
        if (k === ' ' || ev.code === 'Space') { ev.preventDefault(); self.togglePause(); return; }
        if (k === 'h') { self.setHidden(!State.opt.hidden); return; }
        if (k === 'f') { self.toggleFullscreen(); return; }
        if (k === 'm') { ev.shiftKey ? self.randomize() : self.mutate(); return; }
        if (k === 'r') { self.resetParams(); return; }
        if (k === 'c') { self.capture(); return; }
        if (k >= '1' && k <= '8') {
          var names = Object.keys(PRESETS);
          var idx = Number(k) - 1;
          if (names[idx]) { self.applyPreset(names[idx], 0.9); UI.sync(); }
        }
      });
    },

    setParam: function (key, value, o) {
      var d = DEF_BY_KEY[key];
      if (!d) return;
      var v = Number(value);
      if (!Number.isFinite(v)) v = d.def;
      State.p[key] = clamp(v, d.min, d.max);
      State.opt.preset = 'custom';
      if (!o || !o.fromUI) {
        var r = UI.rows[key];
        if (r) { r.input.value = State.p[key]; r.out.textContent = fmtVal(d, State.p[key]); }
      }
      if (key === 'renderScale') this.resize();
      this.updateSub();
      Store.save();
    },

    updateSub: function () {
      if (!this.sub) return;
      var nm = Math.round(45 + 1180 * (0.14 + 0.92 * State.p.thickness));
      this.sub.textContent = (State.opt.backend || '').toLowerCase() +
        (this.gpuInfo ? ' · ' + shorten(this.gpuInfo, 40) : '') + ' · nominal λ thickness ≈ ' + nm + ' nm';
    },

    tweenTo: function (target, dur) {
      var from = {};
      PARAM_KEYS.forEach(function (k) { from[k] = State.p[k]; });
      this.tween = { from: from, to: target, t: 0, dur: Math.max(0.001, dur || 0.8) };
    },

    applyPreset: function (name, dur) {
      var pre = PRESETS[name];
      if (!pre) { State.opt.preset = 'custom'; UI.sync(); return; }
      var target = {};
      PARAM_KEYS.forEach(function (k) {
        target[k] = (pre.p[k] !== undefined) ? clamp(pre.p[k], DEF_BY_KEY[k].min, DEF_BY_KEY[k].max) : State.p[k];
      });
      this.tweenTo(target, dur === undefined ? 0.9 : dur);
      if (pre.quality && (!State.opt.adaptive || Q_ORDER.indexOf(pre.quality) <= 3)) {
        State.opt.quality = pre.quality; State.opt.qualityCeiling = pre.quality;
        this.adaptive.scale = 1; this.resize();
      }
      State.opt.preset = name;
      UI.sync();
      Store.save();
      Status.info('preset → ' + pre.label);
    },

    mutate: function () {
      var target = {};
      var s = 0.16;
      PARAM_KEYS.forEach(function (k) {
        var d = DEF_BY_KEY[k];
        if (!d.mut) { target[k] = State.p[k]; return; }
        var v = State.p[k] + (Math.random() * 2 - 1) * (d.max - d.min) * s * d.mut;
        target[k] = clamp(v, d.min, d.max);
      });
      /* coherence guards: keep the film inside a plausible optical regime */
      if (target.thickness > 0.7) target.thicknessVar = Math.min(target.thicknessVar, 0.55);
      if (target.exposure > 1.7) target.contrast = Math.min(target.contrast, 1.2);
      if (target.interference > 0.9 && target.spread > 1.25) target.saturation = Math.min(target.saturation, 1.35);
      this.tweenTo(target, 0.7);
      Store.save();
    },

    randomize: function () {
      var target = {};
      PARAM_KEYS.forEach(function (k) {
        var d = DEF_BY_KEY[k];
        if (!d.mut) { target[k] = State.p[k]; return; }
        var r = Math.random();
        r = r * r * 0.6 + r * 0.4;                 /* bias toward calmer values */
        var lo = d.min + (d.max - d.min) * 0.08, hi = d.max - (d.max - d.min) * 0.08;
        if (k === 'exposure') { lo = 0.85; hi = 1.7; }
        if (k === 'contrast') { lo = 0.9; hi = 1.45; }
        if (k === 'saturation') { lo = 0.8; hi = 1.6; }
        if (k === 'interference') { lo = 0.5; hi = 1.0; }
        target[k] = clamp(lo + (hi - lo) * r, d.min, d.max);
      });
      this.tweenTo(target, 1.1);
      Store.save();
      Status.info('randomised within curated ranges');
    },

    resetParams: function () {
      var d = defaultParams();
      this.tweenTo(d, 0.6);
      State.opt.preset = 'custom';
      UI.sync();
      Store.save();
      Status.info('parameters reset to defaults');
    },

    factoryReset: function () {
      Store.clear();
      State.p = defaultParams();
      State.opt.quality = 'high'; State.opt.qualityCeiling = 'high';
      State.opt.adaptive = true; State.opt.targetFPS = 60;
      State.opt.preset = 'soap';
      this.adaptive.scale = 1;
      UI.sync();
      this.resize(true);
      Status.info('factory defaults restored');
    },

    togglePause: function () {
      this.paused = !this.paused;
      UI.sync();
      Status.info(this.paused ? 'paused' : 'resumed');
    },

    setHidden: function (hide) {
      State.opt.hidden = hide;
      document.body.classList.toggle('ui-hidden', hide);
      if (hide) Status.info('interface hidden — press H to restore');
    },

    toggleFullscreen: function () {
      var self = this;
      try {
        if (document.fullscreenElement) {
          document.exitFullscreen().then(function () { setTimeout(function () { self.resize(true); }, 80); });
        } else {
          var pr = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          if (pr && pr.catch) pr.catch(function (e) { Status.warn('Fullscreen was refused: ' + e.message); });
        }
      } catch (e) { Status.warn('Fullscreen is unavailable in this context.'); }
    },

    serialize: function () { return JSON.stringify(Store.snapshot(), null, 1); },

    exportSettings: function () {
      var self = this;
      var txt = this.serialize();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          Status.info('Settings JSON copied to clipboard.');
        }).catch(function () { /* fall through to modal */ });
      }
      showModal({
        title: 'Export settings', ok: 'Done', cancel: 'Close',
        note: 'Copy this JSON (also copied to clipboard when permitted).',
        text: txt, readOnly: true, onOk: function () { return true; }
      });
    },

    importSettings: function () {
      showModal({
        title: 'Import settings', ok: 'Apply', cancel: 'Cancel',
        note: 'Paste JSON exported from this laboratory. Values are validated and clamped.',
        text: '', onOk: function (v) {
          try {
            var parsed = sanitize(JSON.parse(v));
            Object.keys(parsed.p).forEach(function (k) { State.p[k] = parsed.p[k]; });
            if (parsed.opt.quality) { State.opt.quality = parsed.opt.quality; State.opt.qualityCeiling = parsed.opt.quality; }
            if (parsed.opt.adaptive !== undefined) State.opt.adaptive = parsed.opt.adaptive;
            if (parsed.opt.targetFPS) State.opt.targetFPS = parsed.opt.targetFPS;
            if (parsed.opt.preset) State.opt.preset = parsed.opt.preset;
            UI.sync(); App.resize(true); Store.save();
            Status.info('settings imported (' + Object.keys(parsed.p).length + ' parameters)');
            return true;
          } catch (e) {
            var el2 = document.getElementById('modal-err');
            el2.textContent = 'Rejected: ' + e.message;
            return false;
          }
        }
      });
    },

    capture: function () {
      if (!this.renderer || !this.renderer.capture) { Status.warn('Capture is not available on this backend.'); return; }
      var self = this;
      Status.info('capturing frame …');
      Promise.resolve(this.renderer.capture()).then(function (url) {
        if (!url) throw new Error('backend produced no image');
        var a = el('a', {
          href: url,
          download: 'thin-film-' + Date.now() + '.png'
        });
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); }, 0);
        Status.info('PNG written (' + self.w + '×' + self.h + ')');
      }).catch(function (e) { Status.error('Frame capture failed: ' + e.message); });
    },

    renderOnce: function () {
      packUniforms(this);
      try { this.renderer.render(); }
      catch (e) {
        Status.error(this.renderer.name + ' draw failed: ' + e.message);
        this.running = false;
      }
    },

    tick: function (ts) {
      var self = this;
      if (!this.running) return;
      requestAnimationFrame(function (t) { self.tick(t); });
      var t0 = performance.now();
      var dt = (ts - this.last) / 1000;
      this.last = ts;
      if (!(dt > 0) || dt > 0.25) dt = 1 / 60;

      if (this.tween) {
        var tw = this.tween;
        tw.t += dt;
        var k = Math.min(1, tw.t / tw.dur);
        var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        PARAM_KEYS.forEach(function (key) {
          State.p[key] = lerp(tw.from[key], tw.to[key], e);
        });
        UI.sync();
        Store.save();
        if (k >= 1) this.tween = null;
      }

      var adv = !this.paused && !document.hidden;
      if (adv) {
        var tt = State.p.temporalSpeed;
        this.tFlow += dt * tt * (0.25 + State.p.flowSpeed);
        this.tSlow += dt * tt;
        this.tLight += dt * tt * (0.05 + State.p.lightMotion);
        this.frame++;
      }
      this.pointers.update(dt, adv);
      packUniforms(this);
      try { this.renderer.render(); }
      catch (err) {
        this.running = false;
        Status.error(this.renderer.name + ' rendering error', err && err.message);
        return;
      }
      var cpu = performance.now() - t0;
      this.perf.frame(dt * 1000, cpu);
      this.adaptive.update(dt);
      if (performance.now() > this.nextHud) {
        this.nextHud = performance.now() + 250;
        UI.writeHud(this);
        this.updateSub();
      }
    }
  };
  App.nextHud = 0;

  /* ============================================================
     12. boot
     ============================================================ */
  window.addEventListener('error', function (ev) {
    try { Status.error('Runtime error: ' + (ev.message || 'unknown'), ev.filename ? ev.filename + ':' + ev.lineno : ''); } catch (e) {}
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try { Status.error('Unhandled promise rejection: ' + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason))); } catch (e) {}
  });

  try { App.start(); }
  catch (e) { Status.error('Startup failure', e && e.stack ? e.stack : String(e)); }
})();
</script>
</body>
</html>
