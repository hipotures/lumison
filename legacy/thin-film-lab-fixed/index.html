<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Thin-Film Fluid Laboratory</title>
<link rel="stylesheet" href="./css/main.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js"
  }
}
</script>
</head>
<body>
  <canvas id="stage" aria-label="Thin-film fluid simulation viewport"></canvas>
  <canvas id="fallback2d" hidden aria-label="2D fallback viewport"></canvas>

  <div id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-title">Thin-Film Fluid Laboratory</div>
      <div class="boot-msg" id="bootMsg">Initializing renderer…</div>
    </div>
  </div>

  <div id="statusbar" hidden></div>

  <aside id="panel" aria-label="Laboratory controls"></aside>

  <button id="panelFab" hidden aria-label="Show controls">LAB</button>
  <div id="probeTip" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="settingsDialog" aria-label="Settings JSON">
    <form method="dialog">
      <label for="settingsText">Settings JSON</label>
      <textarea id="settingsText" rows="12" spellcheck="false"></textarea>
      <menu>
        <button id="settingsCopy" type="button">Copy</button>
        <button id="settingsApply" type="button">Apply</button>
        <button value="close" type="submit">Close</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="./js/boot.js"></script>
</body>
</html>
