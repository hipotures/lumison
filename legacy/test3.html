<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thin-Film Fluid Laboratory</title>
<style>
:root{
  --bg:#05070a;
  --panel:rgba(9,12,17,.64);
  --line:rgba(255,255,255,.09);
  --text:#dfe7ee;
  --dim:#8b96a5;
  --acc:#7ee8d8;
  --warn:#ffb454;
  --err:#ff6b6b;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--text);
  -webkit-font-smoothing:antialiased}
::selection{background:rgba(126,232,216,.25)}

/* ---------- stage / artwork ---------- */
#stage{position:fixed;inset:0;z-index:0;touch-action:none;cursor:crosshair}
#stage canvas.view{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- shared ui chrome ---------- */
.ui-el{transition:opacity .25s ease,transform .25s ease}
body.ui-hidden .ui-el{opacity:0;pointer-events:none}
:focus-visible{outline:1.5px solid var(--acc);outline-offset:1px;border-radius:4px}
button{font-family:var(--sans)}
.kbd{font-family:var(--mono);font-size:9px;border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;
  border-radius:3px;padding:1px 4px;color:#c8d4de;background:rgba(255,255,255,.05)}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:14px;left:16px;z-index:20;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
  backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.mark{width:13px;height:13px;border-radius:50%;flex:none;
  background:conic-gradient(from 20deg,#5ff0dc,#7d8cff,#e07ae0,#ffb168,#5ff0dc);
  box-shadow:0 0 9px rgba(120,220,255,.4)}
.brand-name{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#eaf1f7;white-space:nowrap}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;
  border:1px solid rgba(255,255,255,.16);color:var(--dim);white-space:nowrap}
.badge.gpu{color:#8df0dd;border-color:rgba(126,232,216,.4)}
.badge.gl{color:#ffd28a;border-color:rgba(255,180,84,.4)}
.badge.c2d{color:#ff9d6e;border-color:rgba(255,157,110,.4)}
.ibtn{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);
  color:#d5dee7;border-radius:6px;height:24px;min-width:26px;padding:0 7px;font-size:12px;line-height:1;
  cursor:pointer;user-select:none;transition:background .15s,border-color .15s}
.ibtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.ibtn[aria-pressed="true"]{border-color:rgba(126,232,216,.55);color:var(--acc)}

/* ---------- control panel ---------- */
#panel{position:fixed;top:14px;right:14px;bottom:14px;width:326px;z-index:20;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 14px 44px rgba(0,0,0,.45);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;
  border-bottom:1px solid var(--line);flex:none;background:rgba(255,255,255,.02)}
.panel-title{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#aeb9c6;font-weight:600}
.ph-actions{display:flex;gap:6px}
#panel.collapsed .panel-body{display:none}
#panel.collapsed{bottom:auto}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 13px 14px;scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.panel-body::-webkit-scrollbar-track{background:transparent}

.sect{margin-top:14px}
.sect h3{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600;
  display:flex;align-items:center;gap:8px;margin-bottom:8px;white-space:nowrap}
.sect h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)}

.row{margin:8px 0 9px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.rowhead label{font-size:11.5px;color:#cfd8e3;user-select:none;cursor:default}
.rowhead label[title]{cursor:pointer}
.rowhead output{font-family:var(--mono);font-size:10.5px;color:#a9f0e2;min-width:46px;text-align:right;
  font-variant-numeric:tabular-nums}
.checkrow{display:flex;align-items:center;gap:8px}
.chklabel{font-size:10.5px;color:var(--dim)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,rgba(126,232,216,.85) var(--p,50%),rgba(255,255,255,.13) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#eef6f3;border:1px solid rgba(0,0,0,.55);margin-top:-4px;box-shadow:0 1px 3px rgba(0,0,0,.55)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(126,232,216,.4)}
input[type=range]::-moz-range-track{height:3px;background:rgba(255,255,255,.13);border-radius:2px}
input[type=range]::-moz-range-progress{height:3px;background:rgba(126,232,216,.85);border-radius:2px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#eef6f3;border:1px solid rgba(0,0,0,.55)}

select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.06)
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0l4 6 4-6z' fill='%238b96a5'/></svg>")
  no-repeat right 8px center;
  border:1px solid rgba(255,255,255,.13);color:#dfe7ee;border-radius:6px;padding:5px 24px 5px 9px;font-size:11px;
  cursor:pointer;font-family:var(--sans);width:100%}
select:hover{background-color:rgba(255,255,255,.1)}
select:disabled{opacity:.4;cursor:default}
input[type=checkbox]{appearance:none;width:26px;height:14px;border-radius:8px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex:none;transition:background .15s}
input[type=checkbox]::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;
  background:#9aa7b4;transition:transform .15s,background .15s}
input[type=checkbox]:checked{background:rgba(126,232,216,.3)}
input[type=checkbox]:checked::after{transform:translateX(12px);background:var(--acc)}

.btnrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{appearance:none;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);color:#d5dee7;
  border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;user-select:none;
  transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-acc{border-color:rgba(126,232,216,.4);color:#9ff2e4}
.btn-acc:hover{background:rgba(126,232,216,.14);border-color:rgba(126,232,216,.6)}
select.grow{flex:1;min-width:0}

/* ---------- diagnostics ---------- */
#diag{position:fixed;left:16px;bottom:14px;z-index:20;min-width:224px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:var(--mono);font-size:10.5px;
  box-shadow:0 8px 26px rgba(0,0,0,.35)}
.drow{display:flex;justify-content:space-between;gap:16px;padding:1.5px 0}
.drow .k{color:var(--dim);letter-spacing:.05em}
.drow .v{color:#d7e3ea;font-variant-numeric:tabular-nums}
.drow.st{border-top:1px solid rgba(255,255,255,.08);margin-top:6px;padding-top:6px;justify-content:flex-start;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#5b6774;flex:none;margin-top:2px}
.dot.ok{background:var(--acc);box-shadow:0 0 6px rgba(126,232,216,.7)}
.dot.warn{background:var(--warn);box-shadow:0 0 6px rgba(255,180,84,.7)}
.dot.err{background:var(--err);box-shadow:0 0 6px rgba(255,107,107,.7)}
#dStatus{color:#b9c4d0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}

/* ---------- hints ---------- */
#hints{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;
  align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;
  font-family:var(--mono);font-size:9.5px;color:var(--dim);white-space:nowrap;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* ---------- banner / toasts ---------- */
#banner{position:fixed;top:14px;left:50%;transform:translate(-50%,-10px);z-index:60;max-width:min(720px,92vw);
  padding:9px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:rgba(46,32,10,.88);border:1px solid rgba(255,180,84,.5);color:#ffd9a1;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.err{background:rgba(46,12,16,.9);border-color:rgba(255,107,107,.5);color:#ffb3b3}
#banner.ok{background:rgba(10,36,32,.9);border-color:rgba(126,232,216,.5);color:#a9f0e2}
#toasts{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;
  gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(9,12,17,.85);border:1px solid rgba(255,255,255,.16);color:#dfe7ee;font-size:11.5px;
  padding:7px 14px;border-radius:7px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--mono)}
.toast.on{opacity:1;transform:translateY(0)}
.toast.warn{border-color:rgba(255,180,84,.5);color:#ffd9a1}
.toast.err{border-color:rgba(255,107,107,.5);color:#ffb3b3}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;background:rgba(2,4,6,.55);display:flex;align-items:center;
  justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-wrap[hidden]{display:none}
.modal{width:min(480px,92vw);background:rgba(10,13,18,.92);border:1px solid rgba(255,255,255,.13);border-radius:10px;
  padding:16px 16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#aeb9c6;font-weight:600;margin-bottom:10px}
.modal textarea{width:100%;height:150px;resize:vertical;background:rgba(0,0,0,.45);color:#cfe0d8;
  border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:9px;font-family:var(--mono);font-size:10.5px;
  line-height:1.5}
.modal-msg{margin-top:8px;font-size:11px;color:var(--err);font-family:var(--mono)}
.modal-msg[hidden]{display:none}
.modal .btnrow{margin-top:12px;justify-content:flex-end}

@media (max-width:1150px){ #hints{display:none} }
@media (max-width:920px){
  #panel{width:272px;right:10px;top:10px;bottom:10px}
  .brand-name{letter-spacing:.1em}
  #diag{left:10px;bottom:10px;min-width:190px}
}
@media (prefers-reduced-motion:reduce){
  .ui-el,.toast,#banner{transition:none}
}
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="topbar" class="ui-el">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand-name">Thin-Film Fluid Laboratory</span>
    <span id="badge" class="badge">initializing</span>
    <button id="btnPause" class="ibtn" title="Pause / resume (Space)" aria-pressed="false">❚❚</button>
    <button id="btnFS" class="ibtn" title="Fullscreen (F)">⤢</button>
  </div>

  <aside id="panel" class="ui-el" aria-label="Simulation controls">
    <div class="panel-head">
      <span class="panel-title">Controls</span>
      <div class="ph-actions">
        <button id="btnReset" class="ibtn" title="Factory reset (R)">↺</button>
        <button id="btnCollapse" class="ibtn" title="Collapse / expand panel" aria-expanded="true">–</button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="sect">
        <h3>Preset</h3>
        <div class="btnrow">
          <select id="preset" class="grow" aria-label="Preset"></select>
          <button id="btnMutate" class="btn btn-acc" title="Controlled variation (M)">Mutate</button>
          <button id="btnRandom" class="btn" title="New structural family">Randomize</button>
        </div>
      </div>
      <div class="sect">
        <h3>Structure</h3>
        <div class="row">
          <div class="rowhead"><label for="morph">Morphology family</label></div>
          <select id="morph" aria-label="Structural morphology family">
            <option value="0">Soap Sheet</option>
            <option value="1">Oil Marbling</option>
            <option value="2">Laminar Swirl</option>
            <option value="3">Filaments</option>
            <option value="4">Cellular Drainage</option>
            <option value="5">Hybrid</option>
          </select>
        </div>
      </div>
      <div id="genSections"></div>
      <div class="sect">
        <h3>Frame</h3>
        <div class="btnrow">
          <button id="btnCapture" class="btn btn-acc">Capture PNG</button>
          <button id="btnExport" class="btn">Export</button>
          <button id="btnImport" class="btn">Import</button>
        </div>
      </div>
    </div>
  </aside>

  <div id="diag" class="ui-el" aria-live="off">
    <div class="drow"><span class="k">BACKEND</span><span class="v" id="dBackend">—</span></div>
    <div class="drow"><span class="k">FPS</span><span class="v"><span id="dFps">—</span> · <span id="dMs">—</span></span></div>
    <div class="drow"><span class="k">CANVAS</span><span class="v" id="dRes">—</span></div>
    <div class="drow"><span class="k">RSCALE</span><span class="v" id="dScale">—</span></div>
    <div class="drow"><span class="k">DPR</span><span class="v" id="dDpr">—</span></div>
    <div class="drow"><span class="k">QUALITY</span><span class="v" id="dQual">—</span></div>
    <div class="drow st"><span class="dot" id="dDot"></span><span id="dStatus">initializing…</span></div>
  </div>

  <div id="hints" class="ui-el">
    <span><span class="kbd">Space</span> pause</span>
    <span><span class="kbd">M</span> mutate</span>
    <span><span class="kbd">R</span> reset</span>
    <span><span class="kbd">F</span> fullscreen</span>
    <span><span class="kbd">H</span> hide UI</span>
    <span>double-click a label to reset it</span>
  </div>

  <div id="banner" role="status" aria-live="polite"></div>

  <div id="modal" class="modal-wrap" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Settings</h2>
      <textarea id="modalText" spellcheck="false" aria-label="Settings JSON"></textarea>
      <div id="modalMsg" class="modal-msg" hidden></div>
      <div class="btnrow">
        <button id="modalCopy" class="btn btn-acc">Copy</button>
        <button id="modalApply" class="btn btn-acc">Import</button>
        <button id="modalClose" class="btn">Close</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-family:monospace">JavaScript is required.</div></noscript>

<script>
'use strict';
/* ================================================================
 * Thin-Film Fluid Laboratory
 * Sections: utils · params/presets/families · state · shaders
 *           (WGSL / GLSL) · renderers (WebGPU / WebGL2 / Canvas2D)
 *           · pointer · tween · adaptive · diagnostics · UI
 *           · capture · persistence · boot
 * ================================================================ */

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v); }
function el(tag, cls, text){ const n=document.createElement(tag); if(cls)n.className=cls;
  if(text!=null)n.textContent=text; return n; }

/* ---------------- parameter model ---------------- */
const P = (id,label,min,max,step,def,sec,fmt) => ({id,label,min,max,step,def,sec,fmt:fmt==null?2:fmt});
const PARAM_DEFS = [
  P('flowSpeed','Flow Speed',0,3,0.01,1.0,'sim'),
  P('flowScale','Flow Scale',0.25,3,0.01,1.0,'sim'),
  P('turbulence','Turbulence',0,2,0.01,0.7,'sim'),
  P('domainWarp','Domain Warp',0,3,0.01,1.2,'sim'),
  P('vorticity','Vorticity',0,3,0.01,1.0,'sim'),
  P('fineDetail','Fine Detail',0,2,0.01,0.8,'sim'),
  P('filmThickness','Film Thickness',0,2.5,0.01,1.0,'sim'),
  P('thicknessVar','Thickness Variation',0,2,0.01,1.0,'sim'),
  P('drainageBias','Drainage Bias',0,1.5,0.01,0.4,'sim'),
  P('surfaceTension','Surface Tension',0,2,0.01,0.7,'sim'),
  P('interference','Interference Strength',0,2,0.01,1.0,'opt'),
  P('spectralSpread','Spectral Spread',0.2,2,0.01,1.0,'opt'),
  P('saturation','Saturation',0,1.75,0.01,1.0,'opt'),
  P('exposure','Exposure',0.2,3,0.01,1.0,'opt'),
  P('contrast','Contrast',0.4,2,0.01,1.1,'opt'),
  P('fresnel','Fresnel Strength',0,2,0.01,0.8,'opt'),
  P('specular','Specular Strength',0,3,0.01,1.2,'opt'),
  P('specSharp','Specular Sharpness',2,64,0.5,20,'opt',1),
  P('lightAz','Light Azimuth',0,360,1,35,'lgt',0),
  P('lightEl','Light Elevation',5,85,1,42,'lgt',0),
  P('lightMotion','Light Motion Speed',0,2,0.01,0.3,'lgt'),
  P('highlight','Highlight Intensity',0,3,0.01,1.0,'lgt'),
  P('ambient','Ambient Light',0,1,0.01,0.35,'lgt'),
  P('renderScale','Render Scale',0.25,1.5,0.05,1.0,'rdr'),
  P('aa','Edge Smoothing',0,1,0.01,0.6,'rdr'),
  P('temporal','Temporal Speed',0,2,0.01,1.0,'rdr'),
  P('grain','Grain / Dither',0,1,0.01,0.15,'rdr'),
];
const DEFS_BY_ID = {}; PARAM_DEFS.forEach(d => DEFS_BY_ID[d.id] = d);
const DEFAULTS = {};  PARAM_DEFS.forEach(d => DEFAULTS[d.id] = d.def);

/* ---------------- quality tiers (compute quality only — never topology) ---------------- */
const TIERS = [
  { name:'Low',    oct:4, woct:2, spec:6,  rip:4,  central:0, extra:0 },
  { name:'Medium', oct:5, woct:3, spec:10, rip:6,  central:0, extra:0 },
  { name:'High',   oct:5, woct:3, spec:14, rip:8,  central:1, extra:0 },
  { name:'Ultra',  oct:6, woct:4, spec:18, rip:10, central:1, extra:1 },
];

/* ---------------- morphology families ---------------- */
const FAMILY_NAMES = ['Soap Sheet','Oil Marbling','Laminar Swirl','Filaments','Cellular Drainage','Hybrid'];
const FAMILY_PRESET = { 0:'soap', 1:'oil', 2:'violet', 3:'soap', 4:'cells', 5:'soap' };
/* Per-family parameter regimes: scale hierarchy, anisotropy, warp, dynamics. */
const FAMILY_REGIMES = {
  0:{ flowScale:[0.6,1.2], turbulence:[0.25,0.8], domainWarp:[0.5,1.3], vorticity:[0.2,1.0],
      fineDetail:[0.2,0.7], filmThickness:[0.6,1.4], thicknessVar:[0.6,1.3], drainageBias:[0.05,0.4],
      surfaceTension:[0.4,1.1], spectralSpread:[0.8,1.25] },
  1:{ flowScale:[0.6,1.1], turbulence:[0.6,1.4], domainWarp:[1.1,2.0], vorticity:[0.2,0.8],
      fineDetail:[0.15,0.5], filmThickness:[1.0,1.9], thicknessVar:[0.8,1.5], drainageBias:[0.2,0.7],
      surfaceTension:[0.3,0.9], spectralSpread:[1.1,1.6] },
  2:{ flowScale:[0.8,1.4], turbulence:[0.4,1.0], domainWarp:[0.7,1.5], vorticity:[1.0,2.2],
      fineDetail:[0.2,0.7], filmThickness:[0.7,1.3], thicknessVar:[0.7,1.4], drainageBias:[0.1,0.4],
      surfaceTension:[0.5,1.2], spectralSpread:[0.9,1.35] },
  3:{ flowScale:[0.9,1.6], turbulence:[0.7,1.6], domainWarp:[1.2,2.2], vorticity:[0.5,1.5],
      fineDetail:[0.6,1.5], filmThickness:[0.7,1.5], thicknessVar:[0.9,1.7], drainageBias:[0.1,0.5],

function sanitizeParams(obj, out){
  for (const d of PARAM_DEFS){
    if (obj && typeof obj === 'object'){
      const v = obj[d.id];
      if (typeof v === 'number' && isFinite(v)) out[d.id] = clamp(v, d.min, d.max);
    }
  }
}
function sanitizeSettings(obj){
  const s = {};
  if (!obj || typeof obj !== 'object') return s;
  if (typeof obj.preset === 'string' && (obj.preset === 'custom' || PRESETS[obj.preset])) s.preset = obj.preset;
  if (Number.isInteger(obj.quality)) s.quality = clamp(obj.quality, 0, TIERS.length - 1);
  if (typeof obj.adaptive === 'boolean') s.adaptive = obj.adaptive;
  if ([30,60,90,120].includes(obj.targetFps)) s.targetFps = obj.targetFps;
  if (typeof obj.collapsed === 'boolean') s.collapsed = obj.collapsed;
  if (Number.isInteger(obj.morph)) s.morph = clamp(obj.morph, 0, 5);
  return s;
}
function loadSaved(){
  try{

    if (!raw) return false;

    if (!data || data.v !== 1) return false;
    const p = {};

/* ================================================================
 * SHADERS — physically motivated thin-film interference.
 *
 * u.time.x = global clock (light motion, ripple aging) — scaled by Temporal Speed.
 * u.time.y = advection clock (fluid evolution) — scaled by Temporal × Flow Speed.
 * u.act.w  = morphology family (0..5): selects materially different
 *            thickness-field constructions (uniform branch, no divergence cost).
 *
 * Families: 0 Soap Sheet (broad basins) · 1 Oil Marbling (layered warp + bands)
 * 2 Laminar Swirl (curl advection + elongated sweeps) · 3 Filaments (anisotropic
 * ridged veins) · 4 Cellular Drainage (Voronoi-dominated, the ONLY cellular mode)
 * 5 Hybrid (spatially blended sheet + marble, faint cells).
 * ================================================================ */

function wgslFor(T){ return `
struct U {
  time: vec4f, ptr: vec4f, act: vec4f, sim: vec4f, sim2: vec4f,
  sim3: vec4f, opt: vec4f, opt2: vec4f, lgt: vec4f,
  ripples: array<vec4f, 10>
}
@group(0) @binding(0) var<uniform> u: U;

const OCT: i32 = ${T.oct};
const WOCT: i32 = ${T.woct};
const SPEC_N: i32 = ${T.spec};
const RIP_N: i32 = ${T.rip};
const CENTRAL: i32 = ${T.central};
const EXTRA: i32 = ${T.extra};

struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) uv: vec2f
}

@vertex
fn vs(@builtin(vertex_index) idx: u32) -> VOut {
  var o: VOut;
  o.uv = vec2f(f32((idx << 1) & 2u), f32(idx & 2u));
  o.pos = vec4f(o.uv.x * 2.0 - 1.0, 1.0 - o.uv.y * 2.0, 0.0, 1.0);
  return o;
}

fn hash21(p: vec2f) -> f32 {
  let s = sin(dot(p, vec2f(127.1, 311.7)));
  return fract(s * 43758.5453123);
}

fn vnoise(p: vec2f) -> f32 {
  let ip = floor(p);
  let fp = p - ip;
  let wq = fp * fp * (3.0 - 2.0 * fp);
  let a = hash21(ip);
  let b = hash21(ip + vec2f(1.0, 0.0));
  let c = hash21(ip + vec2f(0.0, 1.0));
  let d = hash21(ip + vec2f(1.0, 1.0));
  return mix(mix(a, b, wq.x), mix(c, d, wq.x), wq.y);
}

fn fbm(p: vec2f) -> f32 {
  var s = 0.0; var amp = 0.5; var f = 1.0;
  for (var i: i32 = 0; i < OCT; i = i + 1) {
    s = s + amp * vnoise(p * f);
    f = f * 2.031; amp = amp * 0.5;
  }
  return s;
}

fn fbmW(p: vec2f) -> f32 {
  var s = 0.0; var amp = 0.5; var f = 1.0;
  for (var i: i32 = 0; i < WOCT; i = i + 1) {
    s = s + amp * vnoise(p * f + vec2f(5.2, 1.3) * f32(i));
    f = f * 2.117; amp = amp * 0.55;
  }
  return s;
}

fn rnoise(p: vec2f) -> f32 {
  var s = 0.0; var amp = 0.5; var f = 1.0; var nrm = 0.0;
  for (var i: i32 = 0; i < OCT; i = i + 1) {
    let n = vnoise(p * f);
    let r = 1.0 - abs(n * 2.0 - 1.0);
    s = s + amp * r * r;
    nrm = nrm + amp;
    f = f * 2.13; amp = amp * 0.53;
  }
  return s / nrm;
}

fn voronoi(p: vec2f, tt: f32) -> vec3f {
  var f1 = 1000.0; var f2 = 1000.0; var id = 0.0;
  let ip = floor(p);
  for (var y: i32 = -2; y <= 2; y = y + 1) {
    for (var x: i32 = -2; x <= 2; x = x + 1) {
      let cell = ip + vec2f(f32(x), f32(y));
      let h1 = hash21(cell);
      let h2 = hash21(cell + vec2f(7.31, 3.17));
      var pt = cell + vec2f(h1, h2) - 0.5;
      pt = pt + vec2f(sin(tt + h1 * 17.0), cos(tt * 1.13 + h1 * 29.0)) * 0.06;
      let d = length(p - pt);
      if (d < f1) { f2 = f1; f1 = d; id = h1; }
      else if (d < f2) { f2 = d; }
    }
  }
  return vec3f(f1, f2, id);
}

fn rot2(a: f32) -> mat2x2f {
  let c = cos(a); let s = sin(a);
  return mat2x2f(c, -s, s, c);
}

/* Approximate human cone response over wavelength (nm). */
fn cone(w: f32) -> vec3f {
  let dr = (w - 606.0) / 52.0;
  let dr2 = (w - 537.0) / 85.0;
  let dg = (w - 532.0) / 40.0;
  let dg2 = (w - 601.0) / 62.0;
  let db = (w - 458.0) / 36.0;
  let db2 = (w - 507.0) / 58.0;
  return vec3f(exp(-dr*dr) + 0.34*exp(-dr2*dr2),
               exp(-dg*dg) + 0.30*exp(-dg2*dg2),
               exp(-db*db) + 0.22*exp(-db2*db2));
}

fn filmAt(p: vec2f) -> f32 {
  let res = u.time.zw;
  let aspect = res.x / res.y;
  let t = u.time.y;
  var q = p * u.sim.x;

  /* pointer push: gaussian falloff around the cursor, driven by velocity */
  let pp = vec2f(u.ptr.x * aspect, u.ptr.y) * u.sim.x;
  let pv = u.ptr.zw * vec2f(aspect, 1.0) * u.sim.x;
  let dP = q - pp;
  let infl = exp(-dot(dP, dP) * 30.0) * u.act.x;
  q = q + pv * infl * 0.35;

  /* shared low-frequency basin + domain warp (anchor for every family) */
  let n1 = fbm(q * 1.15 + vec2f(t * 0.028, -t * 0.021));
  let wq0 = q * 2.3 + vec2f(t * 0.041, -t * 0.035) + n1 * 0.8;
  var wv = vec2f(fbmW(wq0), fbmW(wq0 + vec2f(17.3, 4.7))) - 0.5;
  wv = wv * (u.sim.z * (0.35 + 0.65 * u.sim.y)) * 2.0;
  let p2 = q + wv;

  let tension = u.sim3.x;
  let fineW = mix(1.0, 0.22, clamp(tension * 0.42, 0.0, 0.85));
  let m = u.act.w;
  var d: f32;

  if (m < 0.5) {
    /* SOAP SHEET — broad smooth continuous basins */
    let a = (n1 - 0.5) * 3.14159 * u.sim.w * 0.7;
    let ca = cos(a); let sa = sin(a);
    let rel = p2 - q;
    let rs = q + vec2f(rel.x*ca - rel.y*sa, rel.x*sa + rel.y*ca);
    let n2 = fbm(rs * 2.3 + vec2f(-t*0.05, t*0.035));
    let n3 = fbm(rs * 4.6 + vec2f(t*0.031, -t*0.026));
    let fine = rnoise(rs * 8.5 + vec2f(t*0.09, -t*0.07));
    d = n1*0.56 + n2*0.27 + n3*0.09 + fine * u.sim2.x * 0.12 * fineW;
    d = d + (fbm(q*2.9 + vec2f(-t*0.017, t*0.013)) - 0.5) * 0.10;
  }
  else if (m < 1.5) {
    /* OIL MARBLING — layered warp + meandering stretched bands */
    let wq1 = q * 2.1 + vec2f(t*0.03, -t*0.02) + n1;
    var w1 = vec2f(fbmW(wq1), fbmW(wq1 + vec2f(9.2, 27.7))) - 0.5;
    w1 = w1 * (u.sim.z * (0.35 + 0.65*u.sim.y)) * 1.7;
    let m1 = q + w1;
    let wq2 = m1 * 2.6 + vec2f(-t*0.024, t*0.031) + n1*0.7;
    var w2 = vec2f(fbmW(wq2), fbmW(wq2 + vec2f(41.7, 11.9))) - 0.5;
    w2 = w2 * (u.sim.z * (0.35 + 0.65*u.sim.y)) * 1.1;
    let m2 = m1 + w2;
    let ang1 = t * 0.015 + n1 * 0.9;
    let b1 = fbm(rot2(ang1) * (m2 * vec2f(1.0, 2.6)) + vec2f(t*0.02, 0.0));
    let ang2 = 2.1 - t * 0.011 + n1 * 0.5;
    let b2 = fbm(rot2(ang2) * (m2 * vec2f(2.4, 0.9)) + vec2f(0.0, t*0.017));
    let fine = rnoise(m2 * 7.5 + vec2f(-t*0.06, t*0.045));
    d = n1*0.26 + b1*0.40 + b2*0.22 + fine * u.sim2.x * 0.10 * fineW;
  }
  else if (m < 2.5) {
    /* LAMINAR SWIRL — curl-advection + elongated sweeping flow */
    let ps = 1.9;
    let dtr = vec2f(t*0.05, t*0.037);
    let psi0 = fbm(q * ps + dtr);
    let pxi = fbm(q * ps + vec2f(ps, 0.0) + dtr);
    let pyj = fbm(q * ps + vec2f(0.0, ps) + dtr);
    let curl = vec2f(pyj - psi0, psi0 - pxi) * (1.2 + u.sim.w * 1.6);
    let l1 = q + curl;
    let a = n1 * 6.28318 * (0.4 + u.sim.w * 0.5);
    let ca = cos(a); let sa = sin(a);
    let rel = l1 - q;
    let l2 = q + vec2f(rel.x*ca - rel.y*sa, rel.x*sa + rel.y*ca);
    let s1 = fbm(rot2(0.5 + 0.35*sin(t*0.017)) * (l2 * vec2f(4.6, 1.15)) + vec2f(-t*0.05, t*0.02));
    let s2 = fbm(rot2(2.6) * (l2 * vec2f(1.3, 4.0)) + vec2f(t*0.033, -t*0.021));
    let fine = rnoise(l2 * 9.0 + vec2f(t*0.08, -t*0.06));
    d = s1*0.46 + s2*0.18 + n1*0.28 + fine * u.sim2.x * 0.16 * fineW;
  }
  else if (m < 3.5) {
    /* FILAMENTS — anisotropic ridged veins on a soft base */
    let v1 = rnoise(rot2(t*0.012) * (p2 * vec2f(7.0, 1.6)) + vec2f(t*0.05, -t*0.03));
    let v2 = rnoise(rot2(2.4 + t*0.009) * (p2 * vec2f(1.7, 7.4)) + vec2f(-t*0.04, t*0.025));
    let veins = pow(v1, 2.2) * 0.8 + pow(v2, 2.4) * 0.5;
    let base = fbm(p2 * 2.2 + vec2f(-t*0.04, t*0.03));
    let fine = rnoise(p2 * 10.0 + vec2f(t*0.1, -t*0.075));
    d = n1*0.20 + base*0.14 + veins*0.58 + fine * u.sim2.x * 0.14 * fineW;
  }
  else if (m < 4.5) {
    /* CELLULAR DRAINAGE — Voronoi-dominated (the only cellular mode) */
    let v = voronoi(p2 * 1.8 + 13.7, t * 0.11);
    let c1 = v.x; let c2v = v.y; let cid = v.z;
    let edge = c2v - c1;
    let rim = pow(clamp(edge * 3.2, 0.0, 1.0), 1.5 + tension * 1.2);
    let cellTime = 0.55 + 0.45 * sin(t * 0.05 + cid * 21.0 + c1 * 3.0);
    let fine = rnoise(p2 * 8.0 + vec2f(t*0.09, -t*0.06));
    d = (cid - 0.5) * 0.75 + rim * 0.26 + n1 * 0.30
        - u.sim2.w * 0.6 * (1.0 - clamp(c1 * 2.4, 0.0, 1.0)) * cellTime
        + fine * u.sim2.x * 0.10 * fineW;
  }
  else {
    /* HYBRID — spatially blended sheet + marble, faint cell modulation */
    let mask = smoothstep(0.38, 0.72, fbm(q * 0.75 + vec2f(t*0.012, -t*0.009)));
    let a = (n1 - 0.5) * 3.14159 * u.sim.w * 0.6;
    let ca = cos(a); let sa = sin(a);
    let rel = p2 - q;
    let rs = q + vec2f(rel.x*ca - rel.y*sa, rel.x*sa + rel.y*ca);
    let ds = n1*0.58 + fbm(rs * 2.4 + vec2f(-t*0.05, t*0.036))*0.30;
    let b1 = fbm(rot2(0.8 + t*0.014) * (p2 * vec2f(1.0, 2.5)) + vec2f(t*0.02, 0.0));
    let b2 = fbm(rot2(2.3 - t*0.01) * (p2 * vec2f(2.5, 0.8)) + vec2f(0.0, t*0.016));
    let dm = n1*0.28 + b1*0.42 + b2*0.20;
    let v = voronoi(p2 * 1.6, t * 0.1);
    d = mix(ds, dm, mask) + (v.z - 0.5) * 0.12;
    d = d + rnoise(p2 * 8.0) * u.sim2.x * 0.10 * fineW;
  }

  if (EXTRA > 0) {
    d = d + (fbm(p2 * 5.5 + vec2f(t*0.07, -t*0.05)) - 0.5) * 0.07;
  }

  d = (d - 0.55) * (0.35 + u.sim2.z) + 0.5;
  d = clamp(d, 0.0, 1.75) * u.sim2.y;
  d = d - u.act.y * infl * 0.5;

  var rp = 0.0;
  for (var i: i32 = 0; i < RIP_N; i = i + 1) {
    let r = u.ripples[i];
    let age = u.time.x - r.z;
    if (r.w > 0.002 && age > 0.0 && age < 6.0) {
      let rpp = vec2f(r.x * aspect, r.y) * u.sim.x;
      let dd = length(q - rpp);
      let ring = exp(-abs(dd - age * 0.42) * 22.0) * cos(dd * 46.0 - age * 24.0);
      rp = rp + ring * r.w * exp(-age * 0.85);
    }
  }
  return d + rp * 0.09;
}

/* per-pixel thickness deltas + value (used to build the normal) */
fn fieldGrad(p: vec2f) -> vec3f {
  let e = (1.0 + u.act.z * 2.5) / u.time.w;
  let c = filmAt(p);
  let px = filmAt(p + vec2f(e, 0.0));
  let py = filmAt(p + vec2f(0.0, e));
  if (CENTRAL > 0) {
    let mx = filmAt(p - vec2f(e, 0.0));
    let my = filmAt(p - vec2f(0.0, e));
    return vec3f((mx - px) * 0.5, (my - py) * 0.5, c);
  }
  return vec3f(c - px, c - py, c);
}

@fragment
fn fs(v: VOut) -> @location(0) vec4f {
  let uv = v.uv;
  let res = u.time.zw;
  let aspect = res.x / res.y;
  let g = fieldGrad(vec2f(uv.x * aspect, uv.y));
  let K = 70.0;
  var N = normalize(vec3f(-g.x * K, -g.y * K, 1.0));
  if (N.z < 0.0) { N = -N; }
  let V = vec3f(0.0, 0.0, 1.0);

  /* --- thin-film interference --- */
  let D = g.z * 950.0;                       /* optical thickness, nm */
  let cosT = clamp(N.z, 0.12, 1.0);
  let spread = u.sim3.z;
  let lo = 550.0 - 155.0 * spread;
  let hi = 550.0 + 155.0 * spread;
  var col = vec3f(0.0);
  for (var i: i32 = 0; i < SPEC_N; i = i + 1) {
    let f = (f32(i) + 0.5) / f32(SPEC_N);
    let lam = lo + f * (hi - lo);
    let n = 1.34 + (550.0 - lam) * 0.00016 * spread;   /* dispersion */
    let delta = 12.56637 * n * D * cosT / lam;
    let I = 0.5 * (1.0 - cos(delta));                 /* phase-flipped: black at D=0 */
    let im = mix(0.5, I, clamp(u.sim3.y, 0.0, 1.0));
    col = col + cone(lam) * im;
  }
  col = col / f32(SPEC_N) * (0.25 + 0.9 * u.sim3.y);

  /* --- lighting (main light drifts on its own clock) --- */
  let az = u.opt2.y * 0.0174533 + u.time.x * u.opt2.w * 0.15;
  let el = u.opt2.z * 0.0174533 + sin(u.time.x * 0.06) * 0.06;
  let L = normalize(vec3f(sin(az) * cos(el), cos(az) * cos(el), sin(el)));
  let diff = max(dot(N, L), 0.0);
  let H = normalize(L + V);
  let spec = pow(max(dot(N, H), 0.0), u.opt2.x) * u.opt.w;
  /* independent reflection field orbiting on its own clock */
  let a2 = u.time.x * (0.04 + u.opt2.w * 0.13) + 2.1;
  let L2 = normalize(vec3f(cos(a2) * 0.7, sin(a2) * 0.7, 0.72));
  let H2 = normalize(L2 + V);

const GLSL_VERT = `#version 300 es

function glslFor(T){ return `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outc;

uniform vec4 uTime;
uniform vec4 uPtr;
uniform vec4 uAct;
uniform vec4 uSim;
uniform vec4 uSim2;
uniform vec4 uSim3;
uniform vec4 uOpt;
uniform vec4 uOpt2;
uniform vec4 uLgt;

const int WOCT = ${T.woct};

const int RIP_N = ${T.rip};

float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float vnoise(vec2 p){

  float b = hash21(ip + vec2(1.0, 0.0));
  float c = hash21(ip + vec2(0.0, 1.0));
  float d = hash21(ip + vec2(1.0, 1.0));

}
float fbm(vec2 p){

float filmAt(vec2 p){

    float cellTime = 0.55 + 0.45 * sin(t * 0.05 + cid * 21.0 + c1 * 3.0);
    float fine = rnoise(p2 * 8.0 + vec2(t*0.09, -t*0.06));
    d = (cid - 0.5) * 0.75 + rim * 0.26 + n1 * 0.30

    float a = (n1 - 0.5) * 3.14159 * uSim.w * 0.6;
    float ca = cos(a); float sa = sin(a);
    vec2 rel = p2 - q;
    vec2 rs = q + vec2(rel.x*ca - rel.y*sa, rel.x*sa + rel.y*ca);
    float ds = n1*0.58 + fbm(rs * 2.4 + vec2(-t*0.05, t*0.036))*0.30;
    float b1 = fbm(rot2(0.8 + t*0.014) * (p2 * vec2(1.0, 2.5)) + vec2(t*0.02, 0.0));
    float b2 = fbm(rot2(2.3 - t*0.01) * (p2 * vec2(2.5, 0.8)) + vec2(0.0, t*0.016));

  uni[12]=p.flowScale; uni[13]=p.turbulence; uni[14]=p.domainWarp; uni[15]=p.vorticity;
  uni[16]=p.fineDetail; uni[17]=p.filmThickness; uni[18]=p.thicknessVar; uni[19]=p.drainageBias;
  uni[20]=p.surfaceTension; uni[21]=p.interference; uni[22]=p.spectralSpread; uni[23]=p.saturation;

    const mapped = new Uint8Array(staging.getMappedRange());
    staging.unmap();
    const data = new Uint8Array(w * h * 4);
    const rowLen = w * 4;
    for (let y = 0; y < h; y++){
      data.set(mapped.subarray(y * bytesPerRow, y * bytesPerRow + rowLen), y * rowLen);
    }
    staging.destroy();
    if (this.format === 'bgra8unorm'){
      for (let i = 0; i < data.length; i += 4){ const s = data[i]; data[i] = data[i+2]; data[i+2] = s; }
    }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const c2d = c.getContext('2d');
    const img = c2d.createImageData(w, h);
    img.data.set(data);
    c2d.putImageData(img, 0, 0);
    if (typeof c.toBlob === 'function'){
      return await new Promise((res, rej) =>
        c.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
    }
    if (typeof c.convertToBlob === 'function') return await c.convertToBlob({ type: 'image/png' });
    throw new Error('canvas PNG encoding unavailable');
  }
  destroy(){ try{ this.device && this.device.destroy(); }catch(e){} }
}

/* ================================================================
 * WebGL2 fallback renderer (same visual model, GLSL)
 * ================================================================ */
const GL_UNIFORMS = ['uTime','uPtr','uAct','uSim','uSim2','uSim3','uOpt','uOpt2','uLgt','uRip'];
class WebGLRenderer {
  constructor(canvas){ this.canvas = canvas; }
  get name(){ return 'WebGL2'; }
  init(){
    const gl = this.canvas.getContext('webgl2', {
      antialias:false, depth:false, stencil:false, alpha:false,
      preserveDrawingBuffer:true, powerPreference:'high-performance'
    });
    if (!gl) throw new Error('could not create WebGL2 context');
    this.gl = gl;
    this.progs = new Map();
    for (const tier of TIERS) this.progs.set(tier, this.buildProgram(tier));
    this.setQuality(state.settings.quality);
  }
  compile(type, src, label){
    const gl = this.gl;
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
      throw new Error(label + ' shader: ' + (gl.getShaderInfoLog(sh) || 'compile failed'));
    return sh;
  }
  buildProgram(tier){
    const gl = this.gl;
    const vs = this.compile(gl.VERTEX_SHADER, GLSL_VERT, tier.name);
    const fs = this.compile(gl.FRAGMENT_SHADER, glslFor(tier), tier.name);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error(tier.name + ' link: ' + (gl.getProgramInfoLog(prog) || 'link failed'));
    gl.deleteShader(vs); gl.deleteShader(fs);
    return prog;
  }
  setQuality(q){
    this.prog = this.progs.get(TIERS[clamp(q, 0, TIERS.length-1)]);
    this.gl.useProgram(this.prog);
    this.locs = {};
    for (const n of GL_UNIFORMS) this.locs[n] = this.gl.getUniformLocation(this.prog, n);
  }
  resize(w, h){
    const gl = this.gl;
    if (this.canvas.width !== w || this.canvas.height !== h){
      this.canvas.width = w; this.canvas.height = h;
    }
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
  }
  render(fr){
    packUniforms(fr);
    const gl = this.gl, L = this.locs;
    gl.useProgram(this.prog);
    gl.uniform4fv(L.uTime,  uni, 0, 4);
    gl.uniform4fv(L.uPtr,   uni, 4, 4);
    gl.uniform4fv(L.uAct,   uni, 8, 4);
    gl.uniform4fv(L.uSim,   uni, 12, 4);
    gl.uniform4fv(L.uSim2,  uni, 16, 4);
    gl.uniform4fv(L.uSim3,  uni, 20, 4);
    gl.uniform4fv(L.uOpt,   uni, 24, 4);
    gl.uniform4fv(L.uOpt2,  uni, 28, 4);
    gl.uniform4fv(L.uLgt,   uni, 32, 4);
    gl.uniform4fv(L.uRip,   uni, 36, 10);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  capture(){
    return new Promise((res, rej) =>
      this.canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
  }
  destroy(){
    try{
      const ext = this.gl.getExtension('WEBGL_lose_context');
      if (ext) ext.loseContext();
    }catch(e){}
  }
}

/* ================================================================
 * Canvas2D last-resort renderer — coarse JS evaluation of the same
 * morphology model (all six families), scaled up smoothly.
 * ================================================================ */
function vnoiseJS(x, y){
  let ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  const h = (a,b) => { const s = Math.sin(a*127.1 + b*311.7) * 43758.5453; return s - Math.floor(s); };
  const a = h(ix,iy), b = h(ix+1,iy), c = h(ix,iy+1), d = h(ix+1,iy+1);
  /* correct bilinear: horizontal with x on both rows, then vertical with y */
  return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
}
function fbmJS(x, y, oct){
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += amp * vnoiseJS(x*f, y*f); f *= 2.031; amp *= 0.5; }
  return s;
}
function ridJS(x, y, oct){
  let s = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++){
    const v = 1 - Math.abs(vnoiseJS(x*f, y*f)*2 - 1);
    s += amp*v*v; n += amp; f *= 2.13; amp *= 0.53;
  }
  return s / n;
}
function coneJS(w){
  const g = (c, s) => Math.exp(-((w-c)*(w-c)) / (2*s*s));
  return [g(606,37) + 0.34*g(537,60), g(532,28) + 0.3*g(601,44), g(458,26) + 0.22*g(507,41)];
}
function voronoiJS(x, y, t){
  const ix = Math.floor(x), iy = Math.floor(y);
  let f1 = 1000, f2 = 1000, id = 0;
  const h = (a,b) => { const s = Math.sin(a*127.1 + b*311.7) * 43758.5453; return s - Math.floor(s); };
  for (let yy = -1; yy <= 2; yy++){
    for (let xx = -1; xx <= 2; xx++){
      const cx = ix + xx, cy = iy + yy;
      const h1 = h(cx, cy), h2 = h(cx + 7.31, cy + 3.17);
      const px = cx + h1 - 0.5 + Math.sin(t + h1*17) * 0.06;
      const py = cy + h2 - 0.5 + Math.cos(t*1.13 + h1*29) * 0.06;
      const dd = Math.hypot(x - px, y - py);
      if (dd < f1){ f2 = f1; f1 = dd; id = h1; }
      else if (dd < f2){ f2 = dd; }
    }
  }
  return [f1, f2, id];
}
const rot2JS = (vx, vy, a) => [vx*Math.cos(a) - vy*Math.sin(a), vx*Math.sin(a) + vy*Math.cos(a)];
const smooth01JS = v => { v = clamp(v, 0, 1); return v*v*(3 - 2*v); };

function filmJS(x, y, F){

  const ddx = q1 - pp1, ddy = q2 - pp2;
  const infl = Math.exp(-(ddx*ddx + ddy*ddy) * 30) * F.activity;
  q1 += F.vx * p.flowScale * infl * 0.35;
  q2 += F.vy * infl * 0.35;

  const n1 = fbmJS(q1*1.15 + t*0.028, q2*1.15 - t*0.021, 4);
  const w1c = fbmJS(q1*2.3 + t*0.041 + n1*0.8, q2*2.3 - t*0.035 + n1*0.8, 3) - 0.5;
  const w2c = fbmJS(q1*2.3 + 17.3 + t*0.041, q2*2.3 + 4.7 - t*0.035, 3) - 0.5;
  const wAmt = p.domainWarp * (0.35 + 0.65 * p.turbulence);
  const p1 = q1 + w1c*wAmt*2.0, p2 = q2 + w2c*wAmt*2.0;
  const fineW = 1 - Math.min(0.85, p.surfaceTension*0.42) * 0.78;

  let d;
  if (m === 1){
    const wa = fbmJS(q1*2.1 + t*0.03 + n1, q2*2.1 - t*0.02 + n1, 3) - 0.5;
    const wb = fbmJS(q1*2.1 + 9.2 + t*0.03, q2*2.1 + 27.7 - t*0.02, 3) - 0.5;
    const mx = q1 + wa*wAmt*1.7, my = q2 + wb*wAmt*1.7;
    const xa = fbmJS(mx*2.6 - t*0.024 + n1*0.7, my*2.6 + t*0.031 + n1*0.7, 3) - 0.5;
    const xb = fbmJS(mx*2.6 + 41.7 - t*0.024 + n1*0.7, my*2.6 + 11.9 + t*0.031 + n1*0.7, 3) - 0.5;
    const nx2 = mx + xa*wAmt*1.1, ny2 = my + xb*wAmt*1.1;

    const b1 = fbmJS(r1[0] + t*0.02, r1[1], 4);

    const b2 = fbmJS(r2[0], r2[1] + t*0.017, 4);

  else if (m === 2){

    const pxi = fbmJS((q1+ps)*ps + t*0.05, q2*ps + t*0.037, 4);
    const pyj = fbmJS(q1*ps + t*0.05, (q2+ps)*ps + t*0.037, 4);

    lx = q1 + rr[0]; ly = q2 + rr[1];
    const r1 = rot2JS(lx*4.6, ly*1.15, 0.5 + 0.35*Math.sin(t*0.017));
    const s1 = fbmJS(r1[0] - t*0.05, r1[1] + t*0.02, 4);
    const r2 = rot2JS(lx*1.3, ly*4.0, 2.6);
    const s2 = fbmJS(r2[0] + t*0.033, r2[1] - t*0.021, 4);
    const fine = ridJS(lx*9 + t*0.08, ly*9 - t*0.06, 3);
    d = s1*0.46 + s2*0.18 + n1*0.28 + fine*p.fineDetail*0.16*fineW;
  }
  else if (m === 3){
    const r1 = rot2JS(p1*7.0, p2*1.6, t*0.012);
    const v1 = ridJS(r1[0] + t*0.05, r1[1] - t*0.03, 4);
    const r2 = rot2JS(p1*1.7, p2*7.4, 2.4 + t*0.009);
    const v2 = ridJS(r2[0] - t*0.04, r2[1] + t*0.025, 4);
    const veins = Math.pow(v1, 2.2)*0.8 + Math.pow(v2, 2.4)*0.5;
    const base = fbmJS(p1*2.2 - t*0.04, p2*2.2 + t*0.03, 4);
    const fine = ridJS(p1*10 + t*0.1, p2*10 - t*0.075, 3);
    d = n1*0.20 + base*0.14 + veins*0.58 + fine*p.fineDetail*0.14*fineW;
  }
  else if (m === 4){
    const v = voronoiJS(p1*1.8 + 13.7, p2*1.8, t*0.11);
    const c1 = v[0], c2v = v[1], cid = v[2];
    const rim = Math.pow(clamp((c2v - c1)*3.2, 0, 1), 1.5 + p.surfaceTension*1.2);
    const cellTime = 0.55 + 0.45*Math.sin(t*0.05 + cid*21 + c1*3);
    const fine = ridJS(p1*8 + t*0.09, p2*8 - t*0.06, 3);
    d = (cid - 0.5)*0.75 + rim*0.26 + n1*0.30
        - p.drainageBias*0.6*(1 - clamp(c1*2.4, 0, 1))*cellTime
        + fine*p.fineDetail*0.10*fineW;
  }
  else if (m === 5){
    const mask = smooth01JS((fbmJS(q1*0.75 + t*0.012, q2*0.75 - t*0.009, 3) - 0.38) / 0.34);
    const a = (n1 - 0.5)*3.14159*p.vorticity*0.6;
    const rr = rot2JS(p1 - q1, p2 - q2, a);
    const sx = q1 + rr[0], sy = q2 + rr[1];
    const ds = n1*0.58 + fbmJS(sx*2.4 - t*0.05, sy*2.4 + t*0.036, 4)*0.30;
    const r1 = rot2JS(p1*1.0, p2*2.5, 0.8 + t*0.014);
    const b1 = fbmJS(r1[0] + t*0.02, r1[1], 4);
    const r2 = rot2JS(p1*2.5, p2*0.8, 2.3 - t*0.01);
    const b2 = fbmJS(r2[0], r2[1] + t*0.016, 4);
    const dm = n1*0.28 + b1*0.42 + b2*0.20;
    const v = voronoiJS(p1*1.6, p2*1.6, t*0.1);
    d = ds + (dm - ds)*mask + (v[2] - 0.5)*0.12;
    d += ridJS(p1*8, p2*8, 3)*p.fineDetail*0.10*fineW;
  }
  else {
    const a = (n1 - 0.5)*3.14159*p.vorticity*0.7;
    const rr = rot2JS(p1 - q1, p2 - q2, a);
    const sx = q1 + rr[0], sy = q2 + rr[1];
    const n2 = fbmJS(sx*2.3 - t*0.05, sy*2.3 + t*0.035, 4);
    const n3 = fbmJS(sx*4.6 + t*0.031, sy*4.6 - t*0.026, 4);
    const fine = ridJS(sx*8.5 + t*0.09, sy*8.5 - t*0.07, 3);

  d = (d - 0.55) * (0.35 + p.thicknessVar) + 0.5;
  d = clamp(d, 0, 1.75) * p.filmThickness;
  d -= F.press * infl * 0.5;

  const R = F.ripples;
  for (let i = 0; i < 10; i++){
    const age = F.tl - R[i*4+2];
    if (R[i*4+3] > 0.002 && age > 0 && age < 6){
      const rpx = R[i*4] * F.aspect * p.flowScale, rpy = R[i*4+1] * p.flowScale;

           * R[i*4+3] * Math.exp(-age*0.85) * 0.09;
    }
  }
  return d;
}
class Canvas2DRenderer {
  constructor(canvas){ this.canvas = canvas; }
  get name(){ return 'Canvas2D'; }
  init(){
    const ctx = this.canvas.getContext('2d');
    if (!ctx) throw new Error('2d context unavailable');
    this.ctx = ctx;
    this.off = document.createElement('canvas');
    this.octx = this.off.getContext('2d');
    this.W = 104;
  }
  resize(w, h){
    this.canvas.width = w; this.canvas.height = h;
    const H = Math.max(2, Math.round(this.W * h / w));
    this.off.width = this.W; this.off.height = H;
    this.img = this.octx.createImageData(this.W, H);
    this.grid = new Float32Array(this.W * H);
    this.ctx.imageSmoothingEnabled = true;
    this.ctx.imageSmoothingQuality = 'high';
  }
  render(fr){
    const W = this.W, H = this.off.height, g = this.grid;
    const F = { p:fr.p, t:fr.tFlow, tl:fr.t, morph:fr.morph, aspect:fr.w/fr.h,
      px:fr.ptr.x, py:fr.ptr.y, vx:fr.ptr.vx, vy:fr.ptr.vy,
      activity:fr.ptr.activity, press:fr.ptr.press, ripples:fr.ptr.ripples };
    for (let y = 0; y < H; y++){
      const py = (y + 0.5) / H, row = y * W;
      for (let x = 0; x < W; x++) g[row + x] = filmJS((x + 0.5) / W * F.aspect, py, F);
    }
    const p = fr.p;
    const az = p.lightAz * 0.0174533 + fr.t * p.lightMotion * 0.15;
    const elv = p.lightEl * 0.0174533;
    const Lx = Math.sin(az)*Math.cos(elv), Ly = Math.cos(az)*Math.cos(elv), Lz = Math.sin(elv);
    let Hx = Lx, Hy = Ly, Hz = Lz + 1;
    const Hil = 1 / Math.hypot(Hx, Hy, Hz);
    const a2 = fr.t * (0.04 + p.lightMotion*0.13) + 2.1;
    const H2x = Math.cos(a2)*0.7, H2y = Math.sin(a2)*0.7, H2z = 1.72;
    const H2il = 1 / Math.hypot(H2x, H2y, H2z);
    const lo = 550 - 155*p.spectralSpread, hi = 550 + 155*p.spectralSpread;
    const data = this.img.data;
    let o = 0;
    for (let y = 0; y < H; y++){
      for (let x = 0; x < W; x++){
        const i = y * W + x, d = g[i];
        const dx = g[i + (x + 1 < W ? 1 : 0)] - d;
        const dy = g[i + (y + 1 < H ? W : 0)] - d;
        let nx = -dx*3, ny = -dy*3, nz = 1;
        const il = 1 / Math.hypot(nx, ny, nz);
        nx *= il; ny *= il; nz *= il;
        const D = d * 950, cosT = Math.max(nz, 0.12);
        let r = 0, gg = 0, b = 0;
        for (let s = 0; s < 6; s++){
          const f = (s + 0.5) / 6;
          const lam = lo + f * (hi - lo);
          const n = 1.34 + (550 - lam) * 0.00016 * p.spectralSpread;
          const delta = 12.56637 * n * D * cosT / lam;
          const im = 0.5 + (0.5*(1 - Math.cos(delta)) - 0.5) * Math.min(p.interference, 1);
          const c3 = coneJS(lam);
          r += c3[0]*im; gg += c3[1]*im; b += c3[2]*im;
        }
        const en = 0.25 + 0.9 * p.interference;
        r *= en/6; gg *= en/6; b *= en/6;
        const diff = Math.max(nx*Lx + ny*Ly + nz*Lz, 0);
        const spec = Math.pow(Math.max(nx*Hx*Hil + ny*Hy*Hil + nz*Hz*Hil, 0), p.specSharp) * p.specular;
        const spec2 = Math.pow(Math.max(nx*H2x*H2il + ny*H2y*H2il + nz*H2z*H2il, 0),
          Math.max(p.specSharp*0.6, 4)) * p.specular * 0.55;
        const fres = p.fresnel * Math.pow(1 - Math.max(nz, 0), 5);
        let c1 = r*(p.ambient + 0.9*diff) + (spec+spec2)*p.highlight*0.8 + fres*(r*1.8+0.22)*0.9;
        let c2 = gg*(p.ambient + 0.9*diff) + (spec+spec2)*p.highlight*0.8 + fres*(gg*1.8+0.24)*0.9;
        let c3 = b*(p.ambient + 0.9*diff) + (spec+spec2)*p.highlight*0.8 + fres*(b*1.8+0.26)*0.9;
        const tm = v => {
          v = Math.max((v*p.exposure - 0.5)*p.contrast + 0.5, 0);
          return (v*(2.51*v + 0.03)) / (v*(2.43*v + 0.59) + 0.14);
        };
        c1 = tm(c1); c2 = tm(c2); c3 = tm(c3);
        const lum = 0.2126*c1 + 0.7152*c2 + 0.0722*c3, sat = clamp(p.saturation, 0, 1.75);
        c1 = lum + (c1-lum)*sat; c2 = lum + (c2-lum)*sat; c3 = lum + (c3-lum)*sat;
        data[o++] = clamp(Math.pow(c1, 0.4545) * 255, 0, 255);
        data[o++] = clamp(Math.pow(c2, 0.4545) * 255, 0, 255);
        data[o++] = clamp(Math.pow(c3, 0.4545) * 255, 0, 255);
        data[o++] = 255;
      }
    }
    this.octx.putImageData(this.img, 0, 0);
    this.ctx.drawImage(this.off, 0, 0, this.canvas.width, this.canvas.height);
  }
  capture(){
    return new Promise((res, rej) =>
      this.canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png'));
  }
  destroy(){}
}

 * Application
 * ================================================================ */
const stage = $('#stage');
let renderer = null;
let size = { w:2, h:2, dpr:1, eff:1 };
let pendingSize = null;
let appTime = 0, tFlow = 0;
const perf = { ema: 16.7 };
const paramUI = {};
const tweens = new Map();

const pointer = {
  x: 0.5, y: 0.5, vx: 0, vy: 0,
  activity: 0, press: 0, clock: 0,
  ripples: new Float32Array(40), ripIdx: 0,
};
function spawnRipple(x, y, s){
  const i = pointer.ripIdx * 4;
  pointer.ripples[i] = x; pointer.ripples[i+1] = y;
  pointer.ripples[i+2] = pointer.clock; pointer.ripples[i+3] = s;
  pointer.ripIdx = (pointer.ripIdx + 1) % 10;
}
function pointerTick(dt){
  pointer.activity *= Math.exp(-dt * 1.6);
  pointer.press *= Math.exp(-dt * 4);
  pointer.vx *= Math.exp(-dt * 4);
  pointer.vy *= Math.exp(-dt * 4);
  pointer.clock = appTime;
}

/* --- canvas management (fresh element per backend: OffscreenCanvas transfer is one-way) --- */
function newCanvas(){
  const c = document.createElement('canvas');
  c.className = 'view';
  stage.appendChild(c);
  return c;
}
function removeCanvases(){
  stage.querySelectorAll('canvas').forEach(c => c.remove());
}

/* --- size / resolution management --- */
function computeSize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const eff = Math.min(dpr * state.params.renderScale, 3.0);
  return {
    w: Math.max(8, Math.floor(window.innerWidth * eff)),
    h: Math.max(8, Math.floor(window.innerHeight * eff)),
    dpr, eff,
  };
}
function scheduleResize(){ pendingSize = computeSize(); }

/* --- status / banner / toasts --- */
const bEl = $('#banner');
let bannerTimer = null;
function banner(msg, kind = 'warn', ms = 6000){
  bEl.textContent = msg;
  bEl.className = 'show ' + kind;
  clearTimeout(bannerTimer);
  if (ms) bannerTimer = setTimeout(() => { bEl.className = ''; }, ms);
}
function statusMsg(msg, level = 'ok'){
  $('#dStatus').textContent = msg;
  const d = $('#dDot');
  d.className = 'dot ' + (level === 'ok' ? 'ok' : level === 'warn' ? 'warn' : 'err');
}
function toast(msg, kind = 'info'){
  const t = el('div', 'toast ' + kind, msg);
  $('#toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 350); }, 2600);
}

/* --- parameter mutation + tweening --- */
function markCustom(){
  if (state.settings.preset !== 'custom'){
    state.settings.preset = 'custom';
    $('#preset').value = 'custom';
  }
}
function startTween(id, to, dur){
  tweens.set(id, { from: state.params[id], to, t0: performance.now(), dur: Math.max(dur, 1) });
}
function tweenStep(now){
  for (const [id, tw] of tweens){
    const t = clamp((now - tw.t0) / tw.dur, 0, 1);
    state.params[id] = lerp(tw.from, tw.to, easeIO(t));
    syncParamUI(id);
    if (t >= 1) tweens.delete(id);
  }
}
function setMorph(m, silent){
  state.settings.morph = clamp(Math.round(m), 0, 5);
  $('#morph').value = String(state.settings.morph);
  if (!silent) { markCustom(); saveDebounced(); }
}
function applyPreset(key, dur = 900){
  const pr = PRESETS[key];
  if (!pr) return;
  state.settings.preset = key;
  $('#preset').value = key;
  if (pr.morph != null){
    state.settings.morph = pr.morph;
    $('#morph').value = String(pr.morph);
  }
  for (const id in pr){
    if (id === 'morph') continue;
    startTween(id, pr[id], dur);
  }
  save();
}
function mutate(){
  let moved = false;
  if (Math.random() < 0.06){
    const before = state.settings.morph;
    setMorph(before + (Math.random() < 0.5 ? -1 : 1), true);
    moved = state.settings.morph !== before;
  }
  for (const d of PARAM_DEFS){
    if (d.id === 'renderScale') continue;
    const range = d.max - d.min;
    const next = clamp(state.params[d.id] + gauss() * range * 0.07, d.min, d.max);
    startTween(d.id, next, 420);
  }
  markCustom();
  save();
  toast('Mutated' + (moved ? ' → ' + FAMILY_NAMES[state.settings.morph] : ''));
}
function randomize(){
  /* structural diversity first: pick a family (cellular is not the default
     grammar), then a coherent regime for that family, then optics within
     visually safe bounds. */
  const families = [0, 0, 1, 1, 2, 2, 3, 4, 5];
  const m = families[Math.floor(Math.random() * families.length)];
  setMorph(m, true);
  const base = PRESETS[FAMILY_PRESET[m]];
  const regime = FAMILY_REGIMES[m];
  for (const id in base){
    if (id === 'morph') continue;
    const d = DEFS_BY_ID[id];
    let v = base[id];
    if (regime && regime[id]) v = regime[id][0] + Math.random() * (regime[id][1] - regime[id][0]);
    const target = clamp(v + gauss() * (d.max - d.min) * 0.12, d.min, d.max);
    startTween(id, target, 800);
  }
  startTween('lightAz', Math.random() * 360, 800);
  startTween('lightEl', 20 + Math.random() * 45, 800);
  startTween('highlight', 0.7 + Math.random() * 0.7, 800);
  startTween('interference', 0.8 + Math.random() * 0.6, 800);
  startTween('saturation', 0.75 + Math.random() * 0.45, 800);
  startTween('contrast', 0.95 + Math.random() * 0.5, 800);
  startTween('exposure', 0.75 + Math.random() * 0.55, 800);
  startTween('specular', 0.6 + Math.random() * 1.3, 800);
  startTween('specSharp', 10 + Math.random() * 35, 800);
  startTween('ambient', 0.15 + Math.random() * 0.35, 800);
  startTween('temporal', 0.5 + Math.random() * 0.9, 800);
  startTween('grain', 0.05 + Math.random() * 0.15, 800);
  markCustom();
  save();
  toast('Randomized — ' + FAMILY_NAMES[m]);
}
function resetDefaults(){
  /* true factory reset: every parameter + every setting */
  for (const d of PARAM_DEFS) startTween(d.id, d.def, 700);
  state.settings.preset = 'soap';
  state.settings.quality = 2;
  state.settings.adaptive = false;
  state.settings.targetFps = 60;
  state.settings.collapsed = false;
  state.settings.morph = 0;
  syncAllUI();
  if (renderer) renderer.setQuality(2);
  save();
  toast('Factory defaults restored');
}

/* --- adaptive quality (hysteresis + cooldown, no per-frame oscillation) --- */
const adaptiveState = { lastCheck: 0, lastChange: 0, bad: 0, good: 0 };
function adaptiveTick(now){
  if (!state.settings.adaptive || !renderer) return;
  if (now - adaptiveState.lastCheck < 1400) return;
  adaptiveState.lastCheck = now;
  if (now - adaptiveState.lastChange < 2600){ adaptiveState.bad = 0; adaptiveState.good = 0; return; }
  const fps = 1000 / perf.ema;
  const target = state.settings.targetFps;
  if (fps < target * 0.85) { adaptiveState.bad++; adaptiveState.good = 0; }
  else if (fps > target * 1.25) { adaptiveState.good++; adaptiveState.bad = 0; }
  else { adaptiveState.bad = 0; adaptiveState.good = 0; }

  if (adaptiveState.bad >= 2){
    adaptiveState.bad = 0; adaptiveState.lastChange = now;
    if (state.params.renderScale > 0.45){
      state.params.renderScale = Math.max(0.4, state.params.renderScale * 0.8);
      syncParamUI('renderScale');
      statusMsg('Adaptive: lower resolution', 'warn');
    } else if (state.settings.quality > 0){
      setQuality(state.settings.quality - 1);
      statusMsg('Adaptive: quality ' + TIERS[state.settings.quality].name, 'warn');
    }
  } else if (adaptiveState.good >= 4){
    adaptiveState.good = 0; adaptiveState.lastChange = now;
    if (state.settings.quality < TIERS.length - 1){
      setQuality(state.settings.quality + 1);
      statusMsg('Adaptive: quality ' + TIERS[state.settings.quality].name, 'ok');
    } else if (state.params.renderScale < 1){
      state.params.renderScale = Math.min(1, state.params.renderScale * 1.2);
      syncParamUI('renderScale');
      statusMsg('Adaptive: higher resolution', 'ok');
    }
  }
}
function setQuality(q){
  state.settings.quality = clamp(q, 0, TIERS.length - 1);
  const sel = $('#quality');
  if (sel) sel.value = String(state.settings.quality);
  if (renderer) renderer.setQuality(state.settings.quality);
  saveDebounced();
}

/* --- diagnostics --- */
let diagLast = 0;
function diagTick(now){
  if (now - diagLast < 300) return;
  diagLast = now;
  $('#dBackend').textContent = renderer ? renderer.name : '—';
  $('#dFps').textContent = (1000 / perf.ema).toFixed(1);
  $('#dMs').textContent = perf.ema.toFixed(1) + ' ms';
  $('#dRes').textContent = size.w + ' × ' + size.h;
  $('#dScale').textContent = size.eff.toFixed(2) + '×';
  $('#dDpr').textContent = size.dpr.toFixed(2);
  $('#dQual').textContent = TIERS[state.settings.quality].name + (state.settings.adaptive ? ' · auto' : '');
}

/* --- UI construction --- */
function fmtVal(d, v){ return d.fmt === 0 ? String(Math.round(v)) : v.toFixed(d.fmt); }
function syncParamUI(id){
  const d = DEFS_BY_ID[id], ui = paramUI[id];
  if (!ui) return;
  const v = state.params[id];
  ui.input.value = v;
  ui.out.textContent = fmtVal(d, v);
  ui.input.style.setProperty('--p', ((v - d.min) / (d.max - d.min) * 100).toFixed(1));
  if (id === 'renderScale') scheduleResize();
}
function syncAllUI(){
  for (const d of PARAM_DEFS) syncParamUI(d.id);
  $('#preset').value = (state.settings.preset === 'custom' || PRESETS[state.settings.preset])
    ? state.settings.preset : 'custom';
  $('#quality').value = String(state.settings.quality);
  $('#adapt').checked = state.settings.adaptive;
  $('#fpsTarget').disabled = !state.settings.adaptive;
  $('#fpsTarget').value = String(state.settings.targetFps);
  $('#morph').value = String(state.settings.morph);
  syncPauseBtn();
  syncCollapse();
}
function makeRow(d){
  const row = el('div', 'row');
  const head = el('div', 'rowhead');
  const label = document.createElement('label');
  label.htmlFor = 'p-' + d.id;
  label.textContent = d.label;
  label.title = 'Double-click to reset to ' + fmtVal(d, d.def);
  const out = document.createElement('output');
  out.id = 'o-' + d.id;
  head.append(label, out);
  const input = document.createElement('input');
  input.type = 'range';
  input.id = 'p-' + d.id;
  input.min = d.min; input.max = d.max; input.step = d.step;
  input.value = state.params[d.id];
  input.setAttribute('aria-label', d.label);
  input.addEventListener('input', () => {
    tweens.delete(d.id);
    state.params[d.id] = clamp(parseFloat(input.value), d.min, d.max);
    syncParamUI(d.id);
    markCustom();
    saveDebounced();
  });
  label.addEventListener('dblclick', () => {
    startTween(d.id, d.def, 300);
    markCustom();
    saveDebounced();
  });
  row.append(head, input);
  paramUI[d.id] = { input, out };
  return row;
}

  $('#btnMutate').addEventListener('click', () => mutate());

function syncPauseBtn(){

function togglePause(){

function toggleFS(){

/* --- pointer interaction --- */
function buildPointer(){
  let lastX = 0.5, lastY = 0.5, lastT = 0, lastRip = 0;
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    const now = performance.now() / 1000;
    const dt = Math.max(now - lastT, 0.001);
    const dx = x - lastX, dy = y - lastY;
    const sp = Math.hypot(dx, dy) / dt;
    pointer.vx = lerp(pointer.vx, clamp(dx / dt, -6, 6), 0.4);
    pointer.vy = lerp(pointer.vy, clamp(dy / dt, -6, 6), 0.4);
    pointer.x = x; pointer.y = y;
    pointer.activity = Math.min(1, pointer.activity + sp * dt * 1.3);
    if (sp > 1.2 && now - lastRip > 0.12){
      spawnRipple(x, y, Math.min(0.9, sp * 0.25));
      lastRip = now;
    }
    lastX = x; lastY = y; lastT = now;
  });
  stage.addEventListener('pointerdown', e => {
    const r = stage.getBoundingClientRect();
    if (!r.width) return;
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    pointer.press = 1;
    pointer.x = x; pointer.y = y;
    spawnRipple(x, y, 1.0);
    spawnRipple(x + 0.013, y + 0.007, 0.55);
    spawnRipple(x - 0.01, y - 0.012, 0.45);
  });
  const up = () => { pointer.press = 0; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
}

/* --- keyboard shortcuts --- */
function buildKeys(){
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const t = e.target;
    if (e.key === 'Escape'){
      if (!$('#modal').hidden) closeModal();
      return;
    }
    const tag = t ? t.tagName : '';
    if (tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && t.type === 'text')) return;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    switch (e.key){
      case ' ': e.preventDefault(); togglePause(); break;
      case 'r': case 'R': resetDefaults(); break;
      case 'm': case 'M': mutate(); break;
      case 'f': case 'F': toggleFS(); break;
      case 'h': case 'H':
        document.body.classList.toggle('ui-hidden');
        if (!document.body.classList.contains('ui-hidden')) toast('Interface restored');
        break;
    }
  });
}

/* --- modal: export / import --- */
function buildModal(){
  $('#modalClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
  $('#modalCopy').addEventListener('click', async () => {
    const txt = $('#modalText').value;
    try {
      await navigator.clipboard.writeText(txt);
      toast('Copied to clipboard');
    } catch(e){
      $('#modalText').select();
      try { document.execCommand('copy'); toast('Copied to clipboard'); }
      catch(e2){ toast('Select and copy manually', 'warn'); }
    }
  });
  $('#modalApply').addEventListener('click', () => {
    const text = $('#modalText').value;
    const msg = $('#modalMsg');
    try {
      const data = JSON.parse(text);
      const p = {};
      sanitizeParams(data && data.p, p);
      if (Object.keys(p).length === 0) throw new Error('no valid parameters found in JSON');
      Object.assign(state.params, p);
      Object.assign(state.settings, sanitizeSettings(data && data.s));
      syncAllUI();
      if (renderer) renderer.setQuality(state.settings.quality);
      scheduleResize();
      save();
      toast('Imported ' + Object.keys(p).length + ' parameters');
      closeModal();
    } catch(e){
      msg.hidden = false;
      msg.textContent = 'Invalid settings: ' + e.message;
    }
  });
}
function openModal(mode){
  $('#modalTitle').textContent = mode === 'export' ? 'Export Settings' : 'Import Settings';
  $('#modalCopy').style.display = mode === 'export' ? '' : 'none';
  $('#modalApply').style.display = mode === 'import' ? '' : 'none';
  $('#modalMsg').hidden = true;
  $('#modalText').value = mode === 'export' ? exportJSON() : '';
  $('#modal').hidden = false;
  const ta = $('#modalText');
  ta.focus();
  if (mode === 'export') ta.select();
}
function closeModal(){ $('#modal').hidden = true; }
function exportJSON(){
  const p = {};
  for (const id in state.params) p[id] = Math.round(state.params[id] * 10000) / 10000;
  return JSON.stringify({ v:1, p, s: state.settings });
}

/* --- capture --- */
async function doCapture(){
  if (!renderer){ toast('No renderer active', 'warn'); return; }
  const btn = $('#btnCapture');
  btn.disabled = true;
  try {
    const blob = await renderer.capture();
    if (!blob) throw new Error('capture not supported');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'thin-film-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Frame captured as PNG');
  } catch(e){
    toast('Capture failed: ' + e.message, 'warn');
  } finally {
    btn.disabled = false;
  }
}

/* ================================================================
 * Boot: UI → restore → WebGPU → WebGL2 → Canvas2D → animate
 * ================================================================ */
let renderErrLogged = false;
function onRenderError(e){
  if (renderErrLogged) return;
  renderErrLogged = true;
  banner('Render error: ' + e.message, 'err');
  statusMsg('Render error: ' + e.message, 'err');
}
async function onDeviceLost(msg){
  banner('WebGPU device lost (' + msg + ') — falling back to WebGL2', 'err', 8000);
  statusMsg('WebGPU device lost — falling back', 'err');
  try {
    const old = renderer;
    renderer = null;
    old && old.destroy();
    removeCanvases();
    const r = new WebGLRenderer(newCanvas());
    r.init();
    r.resize(size.w, size.h);
    renderer = r;
    setBadge(renderer.name);
    statusMsg('Running on WebGL2 (fallback)', 'warn');
  } catch(e){
    statusMsg('Fallback failed: ' + e.message, 'err');
  }
}
function setBadge(name){
  const b = $('#badge');
  b.textContent = name;
  b.className = 'badge ' + (name === 'WebGPU' ? 'gpu' : name === 'WebGL2' ? 'gl' : 'c2d');
  $('#dBackend').textContent = name;
}
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  perf.ema += (dt * 1000 - perf.ema) * 0.08;
  tweenStep(now);
  if (!state.paused){
    /* Temporal Speed scales the global clock (light, ripples);
       Flow Speed additionally scales fluid advection. */
    appTime += dt * state.params.temporal;
    tFlow += dt * state.params.temporal * state.params.flowSpeed;
  }
  pointerTick(dt);
  if (renderer){
    if (pendingSize && (pendingSize.w !== size.w || pendingSize.h !== size.h)){
      size = pendingSize;
      pendingSize = null;
      renderer.resize(size.w, size.h);
    }
    const fr = { t: appTime, tFlow, w: size.w, h: size.h, p: state.params,
      ptr: pointer, morph: state.settings.morph };
    try { renderer.render(fr); }
    catch(e){ onRenderError(e); }
  }
  adaptiveTick(now);
  diagTick(now);
}

(async function boot(){
  try {
    buildUI();
    const restored = loadSaved();
    syncAllUI();
    if (!restored && window.matchMedia &&
        matchMedia('(prefers-reduced-motion: reduce)').matches){
      state.params.temporal = 0.35;
      state.params.lightMotion = 0.1;
      syncAllUI();
    }

    size = computeSize();
    statusMsg('Initializing…');

    /* 1. WebGPU */
    if (navigator.gpu){
      try {
        const r = new WebGPURenderer(newCanvas());
        await r.init();
        r.resize(size.w, size.h);
        renderer = r;
      } catch(e){
        removeCanvases();
        banner('WebGPU unavailable (' + e.message + ') — falling back', 'warn');
        statusMsg('WebGPU failed: ' + e.message, 'warn');
      }
    } else {
      banner('WebGPU not supported — falling back', 'warn');
    }
    /* 2. WebGL2 */
    if (!renderer){
      try {
        const r = new WebGLRenderer(newCanvas());
        r.init();
        r.resize(size.w, size.h);
        renderer = r;
      } catch(e){
        removeCanvases();
        banner('WebGL2 failed (' + e.message + ') — using Canvas2D', 'warn');
        statusMsg('WebGL2 failed: ' + e.message, 'warn');
      }
    }
    /* 3. Canvas2D */
    if (!renderer){
      try {
        const r = new Canvas2DRenderer(newCanvas());
        r.init();
        r.resize(size.w, size.h);
        renderer = r;
      } catch(e){
        banner('All renderers failed: ' + e.message, 'err', 0);
        statusMsg('All renderers failed: ' + e.message, 'err');
      }
    }

    setBadge(renderer ? renderer.name : 'none');
    if (renderer){
      renderer.setQuality(state.settings.quality);
      statusMsg('Running on ' + renderer.name, renderer.name === 'WebGPU' ? 'ok' : 'warn');
    }

    /* resize handling: window, DPR changes, render scale, fullscreen */
    new ResizeObserver(scheduleResize).observe(document.documentElement);
    window.addEventListener('resize', scheduleResize);
    document.addEventListener('fullscreenchange', scheduleResize);
    let lastDpr = window.devicePixelRatio || 1;
    setInterval(() => {
      const dpr = window.devicePixelRatio || 1;
      if (Math.abs(dpr - lastDpr) > 0.01){ lastDpr = dpr; scheduleResize(); }
    }, 1200);

    window.addEventListener('error', e => {
      if (e && e.message) statusMsg('Error: ' + e.message.slice(0, 90), 'err');
    });

    save();
    requestAnimationFrame(loop);
  } catch(e){
    banner('Startup failure: ' + (e && e.message ? e.message : e), 'err', 0);
    statusMsg('Startup failure: ' + (e && e.message ? e.message : e), 'err');
    requestAnimationFrame(loop); /* keep the diagnostics clock alive */
  }
})();
</script>
