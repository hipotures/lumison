<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Thin-Film Iridescent Fluid</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #020307;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  #fallback {
    display: none;
  }

  #error {
    position: fixed;
    z-index: 10;
    left: 16px;
    top: 16px;
    display: none;
    box-sizing: border-box;
    max-width: min(760px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 9px;
    background: rgba(7, 9, 15, 0.88);
    color: #f2f5fb;
    font: 12px/1.48 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
<canvas id="glCanvas" aria-label="Animated thin-film iridescent fluid surface"></canvas>
<canvas id="fallback" aria-label="Canvas fallback for the thin-film iridescent fluid surface"></canvas>
<div id="error" role="status" aria-live="polite"></div>

<script>
"use strict";

(() => {
  const glCanvas = document.getElementById("glCanvas");
  const fallbackCanvas = document.getElementById("fallback");
  const errorBox = document.getElementById("error");

  const DPR_CAP = 1.25;

  const vertexSource = `#version 300 es
precision highp float;

const vec2 TRIANGLE[3] = vec2[3](
  vec2(-1.0, -1.0),
  vec2( 3.0, -1.0),
  vec2(-1.0,  3.0)
);

void main() {
  gl_Position = vec4(TRIANGLE[gl_VertexID], 0.0, 1.0);
}
`;

  const fragmentSource = `#version 300 es
precision highp float;
precision highp int;

uniform vec2 u_resolution;
uniform float u_time;
uniform float u_pixelRatio;

out vec4 outColor;

const float PI = 3.1415926535897932384626433832795;

mat2 rotate2D(float a) {
  float c = cos(a);
  float s = sin(a);
  return mat2(c, -s, s, c);
}

vec2 hash22(vec2 p) {
  vec2 q = vec2(
    dot(p, vec2(127.1, 311.7)),
    dot(p, vec2(269.5, 183.3))
  );
  return -1.0 + 2.0 * fract(sin(q) * 43758.5453123);
}

float gradientNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);

  float a = dot(hash22(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
  float b = dot(hash22(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash22(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash22(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));

  return 0.5 + 0.5 * mix(
    mix(a, b, u.x),
    mix(c, d, u.x),
    u.y
  );
}

float fbm5(vec2 p) {
  float value = 0.0;
  float amplitude = 0.52;
  mat2 r = rotate2D(0.54);

  for (int i = 0; i < 5; ++i) {
    value += amplitude * gradientNoise(p);
    p = r * p * 2.03 + vec2(8.37, -5.91);
    amplitude *= 0.49;
  }
  return value;
}

float fbm4(vec2 p) {
  float value = 0.0;
  float amplitude = 0.54;
  mat2 r = rotate2D(-0.47);

  for (int i = 0; i < 4; ++i) {
    value += amplitude * gradientNoise(p);
    p = r * p * 2.07 + vec2(-4.21, 7.83);
    amplitude *= 0.48;
  }
  return value;
}

/*
  Slowly evolving, non-looping domain-warped flow field.
  Several unrelated drift rates prevent obvious short repetition.
*/
vec4 fluidWarp(vec2 p, float t) {
  vec2 q;

  q.x = fbm5(
    p * 0.64 +
    vec2( 0.0207, -0.0151) * t +
    vec2(1.71, -2.37)
  );

  q.y = fbm5(
    rotate2D(0.81) * p * 0.67 +
    vec2(-0.0139, 0.0193) * t +
    vec2(-4.08, 3.26)
  );

  q = q * 2.0 - 1.0;

  vec2 r;

  r.x = fbm5(
    p * 1.18 +
    q * 1.72 +
    vec2(0.0097, 0.0143) * t +
    vec2(7.61, 3.05)
  );

  r.y = fbm5(
    rotate2D(-0.63) * p * 1.15 -
    q.yx * 1.63 +
    vec2(-0.0121, 0.0089) * t +
    vec2(-5.88, 9.17)
  );

  r = r * 2.0 - 1.0;

  return vec4(q, r);
}

float thicknessField(vec2 p, float t) {
  vec4 wr = fluidWarp(p, t);
  vec2 q = wr.xy;
  vec2 r = wr.zw;

  vec2 w = p + q * 0.72 + r * 0.31;

  float broad = fbm5(
    w * 0.73 +
    vec2(0.0061, -0.0047) * t
  );

  float folded = fbm5(
    rotate2D(0.34) * w * 1.46 +
    q * 0.78 +
    vec2(-0.0083, 0.0069) * t
  );

  float cellular = fbm4(
    rotate2D(-0.25) * w * 2.62 +
    r * 1.22 +
    vec2(0.0127, 0.0101) * t
  );

  float fine = fbm4(
    w * 5.05 +
    q * 1.95 +
    vec2(-0.0211, 0.0167) * t
  );

  /*
    Surface-tension-like ripple component bends with the flow field
    instead of sitting as a screen-space sine wave.
  */
  float ripplePhase =
      13.5 * w.x
    +  6.2 * w.y
    +  7.0 * folded
    +  2.6 * sin(w.y * 2.2 + r.x * 3.1 - t * 0.031)
    +  t * 0.047;

  float ripples = 0.5 + 0.5 * sin(ripplePhase);

  /*
    Broad drainage pockets create thin dark regions while adjacent
    thicker regions become bright and spectrally shifted.
  */
  float drainage = fbm5(
    rotate2D(0.17) * p * 0.38 +
    q * 0.30 +
    vec2(0.0033, 0.0047) * t +
    19.3
  );

  float thinPocket = smoothstep(0.61, 0.84, drainage);
  thinPocket *= thinPocket;

  float normalized =
      broad    * 0.39
    + folded   * 0.31
    + cellular * 0.16
    + fine     * 0.08
    + ripples  * 0.06;

  normalized = smoothstep(0.22, 0.83, normalized);

  float thicknessNm = 175.0 + 780.0 * normalized;
  thicknessNm -= thinPocket * 185.0;

  /*
    Slow global breathing is intentionally tiny; it changes the
    interference phase but never degenerates into a hue-cycle.
  */
  thicknessNm += 18.0 * sin(t * 0.0079 + broad * 4.0);

  return clamp(thicknessNm, 105.0, 1020.0);
}

/*
  Thin-film interference approximation.
  Wavelengths are in nanometres and thickness is optical-film thickness.
*/
float interferenceAtWavelength(
  float thicknessNm,
  float wavelengthNm,
  float cosTheta
) {
  const float refractiveIndex = 1.333;

  float phase =
      4.0 * PI
    * refractiveIndex
    * thicknessNm
    * cosTheta
    / wavelengthNm;

  /*
    Pi phase shift approximates one phase inversion at an interface.
    A weaker second bounce adds richer wet-film spectral structure.
  */
  float firstBounce = 0.5 + 0.5 * cos(phase + PI);
  float secondBounce = 0.5 + 0.5 * cos(phase * 1.96 + 0.41);

  return clamp(
    firstBounce * 0.84 + secondBounce * 0.16,
    0.0,
    1.0
  );
}

vec3 thinFilmSpectrum(float d, float cosTheta) {
  float violet = interferenceAtWavelength(d, 420.0, cosTheta);
  float blue   = interferenceAtWavelength(d, 458.0, cosTheta);
  float cyan   = interferenceAtWavelength(d, 490.0, cosTheta);
  float green  = interferenceAtWavelength(d, 535.0, cosTheta);
  float amber  = interferenceAtWavelength(d, 585.0, cosTheta);
  float red    = interferenceAtWavelength(d, 645.0, cosTheta);

  vec3 color = vec3(0.0);

  color += violet * vec3(0.43, 0.025, 0.95);
  color += blue   * vec3(0.02, 0.20, 1.00);
  color += cyan   * vec3(0.00, 0.92, 1.00);
  color += green  * vec3(0.10, 1.00, 0.16);
  color += amber  * vec3(1.00, 0.52, 0.015);
  color += red    * vec3(1.00, 0.025, 0.07);

  color /= vec3(1.52, 1.68, 2.14);

  /*
    Removing a little common-mode energy preserves saturated bands
    instead of turning every overlap into pastel white.
  */
  float commonEnergy = min(color.r, min(color.g, color.b));
  color -= commonEnergy * 0.20;

  return max(color, vec3(0.0));
}

vec3 filmNormal(vec2 p, float t, vec2 resolution) {
  /*
    Sample spacing is tied to physical pixels but bounded so large
    monitors do not create numerically unstable derivative noise.
  */
  float px = clamp(
    2.25 / max(resolution.y, 1.0),
    0.00065,
    0.0032
  );

  float tx0 = thicknessField(p - vec2(px, 0.0), t);
  float tx1 = thicknessField(p + vec2(px, 0.0), t);
  float ty0 = thicknessField(p - vec2(0.0, px), t);
  float ty1 = thicknessField(p + vec2(0.0, px), t);

  float dx = (tx1 - tx0) * 0.0043;
  float dy = (ty1 - ty0) * 0.0043;

  return normalize(vec3(-dx, -dy, 1.0));
}

vec3 tonemap(vec3 x) {
  /*
    Smooth filmic compression keeps the traveling specular highlight
    bright without clipping most interference colours.
  */
  x = max(x, vec3(0.0));
  return x * (2.51 * x + 0.03)
       / (x * (2.43 * x + 0.59) + 0.14);
}

void main() {
  vec2 fragCoord = gl_FragCoord.xy;
  vec2 uv = fragCoord / u_resolution;

  vec2 p = uv * 2.0 - 1.0;
  p.x *= u_resolution.x / max(u_resolution.y, 1.0);

  /*
    The animation speed is deliberately slow. u_time itself remains
    real elapsed seconds; only the physical evolution is time-scaled.
  */
  float t = u_time * 0.42;

  float thicknessNm = thicknessField(p, t);
  vec3 N = filmNormal(p, t, u_resolution);
  vec3 V = vec3(0.0, 0.0, 1.0);

  /*
    A gentle aperiodic-looking moving light path, built from several
    very slow incommensurate frequencies.
  */
  vec2 lightXY = vec2(
      0.70 * cos(t * 0.037)
    + 0.17 * cos(t * 0.0131 + 1.7),

      0.54 * sin(t * 0.031)
    + 0.15 * sin(t * 0.0113 - 0.8)
  );

  vec3 L = normalize(vec3(lightXY - p, 1.24));
  vec3 H = normalize(L + V);

  float ndv = clamp(dot(N, V), 0.05, 1.0);
  float ndl = clamp(dot(N, L), 0.0, 1.0);
  float ndh = clamp(dot(N, H), 0.0, 1.0);

  /*
    Approximate refraction-angle influence on optical path.
    Using sqrt softens grazing-angle spectral compression.
  */
  float opticalCos = sqrt(max(ndv, 0.16));

  vec3 spectral = thinFilmSpectrum(thicknessNm, opticalCos);

  /*
    Thickness controls brightness as well as colour:
      - very thin drainage zones darken,
      - healthy membrane thickness is luminous,
      - thicker cells gain gentle internal glow.
  */
  float ultraThin =
    1.0 - smoothstep(120.0, 285.0, thicknessNm);

  float wetBody =
      0.64
    + 0.28 * smoothstep(165.0, 740.0, thicknessNm)
    + 0.13 * ndl;

  wetBody *= 1.0 - 0.63 * ultraThin;

  vec3 color = vec3(0.006, 0.008, 0.014);
  color += spectral * wetBody * 1.50;

  /*
    Internal luminosity is colour-dependent, so it feels like light
    living inside a thin membrane rather than a flat RGB overlay.
  */
  vec3 internalGlow =
    thinFilmSpectrum(
      thicknessNm * 0.93 + 31.0,
      clamp(opticalCos * 0.94 + 0.03, 0.15, 1.0)
    );

  float glowMask =
      0.12
    + 0.22 * smoothstep(260.0, 760.0, thicknessNm);

  color += internalGlow * glowMask;

  /*
    Fresnel reflection and moving specular highlight.
  */
  float fresnel = pow(1.0 - ndv, 4.4);

  float tightSpec =
    pow(ndh, 118.0) *
    (0.40 + 0.60 * ndl);

  float broadSpec =
    pow(ndh, 20.0) *
    (0.35 + 0.65 * ndl);

  color += vec3(0.35, 0.48, 0.68) * fresnel * 0.34;
  color += vec3(1.00, 0.965, 0.91) * tightSpec * 2.10;

  vec3 spectralSpec =
    thinFilmSpectrum(
      thicknessNm + 47.0,
      max(opticalCos, 0.43)
    );

  color += spectralSpec * broadSpec * 0.22;

  /*
    Subtle micro-sheen from curvature.
  */
  float slope = clamp(length(N.xy), 0.0, 1.0);
  color += spectral.bgr * pow(slope, 1.65) * 0.095;

  /*
    A tiny coarse membrane brightness modulation creates soft cells,
    independent of the direct interference phase.
  */
  vec4 wr = fluidWarp(p * 0.61 + 6.7, t * 0.83);
  float cellLight =
    0.5 + 0.5 *
    sin(
      2.7 * wr.x +
      2.1 * wr.w +
      thicknessNm * 0.006
    );

  color *= 0.93 + 0.10 * cellLight;

  /*
    Very gentle corner attenuation. The film still fills the viewport:
    there is no object edge or bubble silhouette.
  */
  vec2 centered = uv - 0.5;
  float vignette =
    1.0 - 0.10 * dot(centered, centered);

  color *= vignette;

  color = tonemap(color * 1.22);
  color = pow(max(color, vec3(0.0)), vec3(0.91));

  /*
    Fine deterministic grain avoids unnaturally perfect digital bands.
    The pixel-ratio uniform participates in the grain seed explicitly.
  */
  float grain = fract(
    sin(
      dot(
        fragCoord / max(u_pixelRatio, 0.5),
        vec2(12.9898, 78.233)
      ) +
      u_time * 0.017
    ) * 43758.5453123
  ) - 0.5;

  color += grain * 0.0045;

  outColor = vec4(clamp(color, 0.0, 1.0), 1.0);
}
`;

  function cappedDpr() {
    return Math.min(Math.max(window.devicePixelRatio || 1, 1), DPR_CAP);
  }

  function resizeCanvas(canvas) {
    const dpr = cappedDpr();
    const cssWidth = Math.max(1, window.innerWidth);
    const cssHeight = Math.max(1, window.innerHeight);

    const width = Math.max(1, Math.round(cssWidth * dpr));
    const height = Math.max(1, Math.round(cssHeight * dpr));

    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }

    return dpr;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function compileShader(gl, type, source, label) {
    const shader = gl.createShader(type);

    if (!shader) {
      throw new Error("Could not create the " + label + " shader.");
    }

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(shader) || "No compiler log was provided.";
      gl.deleteShader(shader);

      throw new Error(
        label + " shader compilation failed:\n\n" + info
      );
    }

    return shader;
  }

  function buildProgram(gl) {
    let vertexShader = null;
    let fragmentShader = null;
    let program = null;

    try {
      vertexShader = compileShader(
        gl,
        gl.VERTEX_SHADER,
        vertexSource,
        "Vertex"
      );

      fragmentShader = compileShader(
        gl,
        gl.FRAGMENT_SHADER,
        fragmentSource,
        "Fragment"
      );

      program = gl.createProgram();

      if (!program) {
        throw new Error("Could not create the WebGL program.");
      }

      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const info =
          gl.getProgramInfoLog(program) ||
          "No linker log was provided.";

        throw new Error(
          "WebGL program linking failed:\n\n" + info
        );
      }

      return program;
    } finally {
      if (vertexShader) {
        if (program) {
          gl.detachShader(program, vertexShader);
        }
        gl.deleteShader(vertexShader);
      }

      if (fragmentShader) {
        if (program) {
          gl.detachShader(program, fragmentShader);
        }
        gl.deleteShader(fragmentShader);
      }

      if (
        program &&
        !gl.getProgramParameter(program, gl.LINK_STATUS)
      ) {
        gl.deleteProgram(program);
      }
    }
  }

  function startCanvasFallback(reason) {
    glCanvas.style.display = "none";
    fallbackCanvas.style.display = "block";

    showError(
      reason +
      "\n\nWebGL2 rendering failed. Canvas2D fallback is active."
    );

    const ctx = fallbackCanvas.getContext("2d");

    if (!ctx) {
      showError(
        reason +
        "\n\nWebGL2 rendering failed, and Canvas2D fallback could not be created."
      );
      return;
    }

    const startTime = performance.now();

    function paint(now) {
      const dpr = resizeCanvas(fallbackCanvas);
      const width = fallbackCanvas.width;
      const height = fallbackCanvas.height;
      const t = (now - startTime) * 0.001;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, width, height);

      const cx =
        width *
        (
          0.50 +
          0.11 * Math.sin(t * 0.037) +
          0.035 * Math.sin(t * 0.011)
        );

      const cy =
        height *
        (
          0.50 +
          0.10 * Math.cos(t * 0.031) +
          0.028 * Math.cos(t * 0.013)
        );

      let base;

      if (typeof ctx.createConicGradient === "function") {
        base = ctx.createConicGradient(
          t * 0.023,
          cx,
          cy
        );

        base.addColorStop(0.00, "#05bfe5");
        base.addColorStop(0.13, "#3d53ef");
        base.addColorStop(0.27, "#9824e5");
        base.addColorStop(0.40, "#ef348b");
        base.addColorStop(0.53, "#ff9a19");
        base.addColorStop(0.67, "#b9eb19");
        base.addColorStop(0.80, "#18db77");
        base.addColorStop(0.91, "#04c5e8");
        base.addColorStop(1.00, "#05bfe5");
      } else {
        base = ctx.createLinearGradient(0, 0, width, height);
        base.addColorStop(0.00, "#04c5e8");
        base.addColorStop(0.33, "#b32cdf");
        base.addColorStop(0.66, "#f2a01e");
        base.addColorStop(1.00, "#23d975");
      }

      ctx.fillStyle = base;
      ctx.fillRect(0, 0, width, height);

      /*
        Moving radial layers distort the simple spectrum enough to
        suggest thick and thin fluid-film regions in fallback mode.
      */
      ctx.globalCompositeOperation = "screen";

      for (let i = 0; i < 9; i++) {
        const fi = i + 1;

        const x =
          width *
          (
            0.50 +
            0.44 *
            Math.sin(
              t * (0.0105 + fi * 0.0017) +
              fi * 1.731
            )
          );

        const y =
          height *
          (
            0.50 +
            0.43 *
            Math.cos(
              t * (0.0087 + fi * 0.0019) -
              fi * 1.173
            )
          );

        const radius =
          Math.max(width, height) *
          (
            0.13 +
            0.023 * (i % 4)
          );

        const gradient =
          ctx.createRadialGradient(
            x,
            y,
            radius * 0.03,
            x,
            y,
            radius
          );

        gradient.addColorStop(
          0,
          "rgba(255,255,255,0.30)"
        );

        gradient.addColorStop(
          0.20,
          "rgba(120,210,255,0.16)"
        );

        gradient.addColorStop(
          0.53,
          "rgba(255,65,190,0.10)"
        );

        gradient.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }

      /*
        Dark drainage cells.
      */
      ctx.globalCompositeOperation = "multiply";

      for (let i = 0; i < 7; i++) {
        const fi = i + 1;

        const x =
          width *
          (
            0.5 +
            0.47 *
            Math.cos(
              t * (0.008 + fi * 0.0013) +
              fi * 2.11
            )
          );

        const y =
          height *
          (
            0.5 +
            0.44 *
            Math.sin(
              t * (0.0091 + fi * 0.0011) -
              fi * 1.49
            )
          );

        const radius =
          Math.max(width, height) *
          (
            0.09 +
            0.026 * (i % 4)
          );

        const gradient =
          ctx.createRadialGradient(
            x,
            y,
            radius * 0.04,
            x,
            y,
            radius
          );

        gradient.addColorStop(
          0,
          "rgba(6,8,16,0.48)"
        );

        gradient.addColorStop(
          0.48,
          "rgba(12,14,24,0.24)"
        );

        gradient.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }

      /*
        Moving broad specular highlight.
      */
      ctx.globalCompositeOperation = "screen";

      const lightX =
        width *
        (
          0.52 +
          0.34 * Math.cos(t * 0.041) +
          0.06 * Math.cos(t * 0.013)
        );

      const lightY =
        height *
        (
          0.47 +
          0.30 * Math.sin(t * 0.035) +
          0.05 * Math.sin(t * 0.011)
        );

      const lightRadius =
        Math.min(width, height) * 0.25;

      const light =
        ctx.createRadialGradient(
          lightX,
          lightY,
          0,
          lightX,
          lightY,
          lightRadius
        );

      light.addColorStop(
        0.00,
        "rgba(255,255,255,0.84)"
      );

      light.addColorStop(
        0.07,
        "rgba(255,246,231,0.48)"
      );

      light.addColorStop(
        0.30,
        "rgba(145,215,255,0.13)"
      );

      light.addColorStop(
        1.00,
        "rgba(0,0,0,0)"
      );

      ctx.fillStyle = light;
      ctx.fillRect(0, 0, width, height);

      /*
        Thin moving bands provide a weak surface-tension cue.
      */
      ctx.globalCompositeOperation = "soft-light";
      ctx.lineWidth = Math.max(1, dpr * 0.65);

      for (let band = 0; band < 8; band++) {
        ctx.beginPath();

        for (let x = -32; x <= width + 32; x += 18 * dpr) {
          const nx = x / Math.max(width, 1);

          const y =
            height *
            (
              (band + 0.5) / 8 +
              0.027 *
              Math.sin(
                nx * 13.0 +
                band * 1.91 +
                t * 0.061
              ) +
              0.012 *
              Math.sin(
                nx * 31.0 -
                band * 0.77 -
                t * 0.043
              )
            );

          if (x <= -32) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.strokeStyle =
          "rgba(255,255,255,0.105)";

        ctx.stroke();
      }

      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;

      requestAnimationFrame(paint);
    }

    requestAnimationFrame(paint);
  }

  let gl;

  try {
    gl = glCanvas.getContext(
      "webgl2",
      {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance"
      }
    );
  } catch (error) {
    startCanvasFallback(
      "WebGL2 context creation threw an exception:\n" +
      String(
        error && error.message
          ? error.message
          : error
      )
    );
    return;
  }

  if (!gl) {
    startCanvasFallback(
      "WebGL2 is unavailable in this browser or GPU configuration."
    );
    return;
  }

  let program;

  try {
    program = buildProgram(gl);
  } catch (error) {
    startCanvasFallback(
      String(
        error && error.message
          ? error.message
          : error
      )
    );
    return;
  }

  /*
    A dedicated VAO keeps the full-screen gl_VertexID triangle valid
    on implementations that expect explicit WebGL2 vertex-array state.
  */
  const vao = gl.createVertexArray();

  if (!vao) {
    startCanvasFallback(
      "WebGL2 setup failed: could not create a vertex array object."
    );
    return;
  }

  gl.bindVertexArray(vao);
  gl.useProgram(program);

  const resolutionLocation =
    gl.getUniformLocation(
      program,
      "u_resolution"
    );

  const timeLocation =
    gl.getUniformLocation(
      program,
      "u_time"
    );

  const pixelRatioLocation =
    gl.getUniformLocation(
      program,
      "u_pixelRatio"
    );

  if (
    resolutionLocation === null ||
    timeLocation === null ||
    pixelRatioLocation === null
  ) {
    startCanvasFallback(
      "WebGL2 setup failed: one or more required uniforms were not found."
    );
    return;
  }

  const startTime = performance.now();

  function render(now) {
    const dpr = resizeCanvas(glCanvas);

    gl.viewport(
      0,
      0,
      glCanvas.width,
      glCanvas.height
    );

    gl.useProgram(program);
    gl.bindVertexArray(vao);

    gl.uniform2f(
      resolutionLocation,
      glCanvas.width,
      glCanvas.height
    );

    gl.uniform1f(
      timeLocation,
      (now - startTime) * 0.001
    );

    gl.uniform1f(
      pixelRatioLocation,
      dpr
    );

    gl.drawArrays(
      gl.TRIANGLES,
      0,
      3
    );

    requestAnimationFrame(render);
  }

  resizeCanvas(glCanvas);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
