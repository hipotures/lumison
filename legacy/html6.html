  },
};
function fmtVal(d, v) {
  if (d.t !== 'n') return String(v);
  const s = v.toFixed(d.f);
  return d.u ? s + d.u : s;
}

/* ------------------------------------------------------------------ HUD */
const HUD = {
  fields: ['backend', 'fps', 'frame', 'canvas', 'render', 'sim', 'dpr', 'quality', 'target', 'scale'],
  build() {
    const el = document.getElementById('hud');
    el.innerHTML = '<div class="title">Diagnostics</div>';
    this.ref = {};
    const names = { backend: 'backend', fps: 'fps', frame: 'frame', canvas: 'canvas', render: 'render scale',
      sim: 'sim grid', dpr: 'device px ratio', quality: 'quality', target: 'target', scale: 'gpu load' };
    for (const f of this.fields) {
      const row = document.createElement('div'); row.className = 'hrow';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = names[f];
      const v = document.createElement('span'); v.className = 'v'; v.textContent = '—';
      row.append(k, v); el.appendChild(row); this.ref[f] = v;
    }
    const bar = document.createElement('div'); bar.className = 'bar'; const i = document.createElement('i');
    bar.appendChild(i); el.appendChild(bar); this.bar = i;
  },
  update(o) {
    for (const f of this.fields) if (this.ref[f] && o[f] !== undefined) this.ref[f].textContent = o[f];
    if (this.ref.fps) this.ref.fps.classList.toggle('acc', parseFloat(o.fps) >= (o.targetNum || 55) * 0.9);
    if (this.bar) this.bar.style.width = Math.min(100, (o.loadPct || 0)) + '%';
  },
};

/* ------------------------------------------------------------------ pointer plumbing */
function attachPointer(canvas, app) {
  let lastX = 0, lastY = 0, lastT = 0, haveLast = false;
  const toWorld = (ev) => {
    const r = canvas.getBoundingClientRect();
    const aspect = Math.max(app.cssW, 1) / Math.max(app.cssH, 1);
    return { x: ((ev.clientX - r.left) / r.width * 2 - 1) * aspect, y: 1 - (ev.clientY - r.top) / r.height * 2 };
  };
  canvas.addEventListener('pointermove', ev => {
    const w = toWorld(ev);
    const now = performance.now();
    const dt = haveLast ? Math.max((now - lastT) / 1000, 0.001) : 0.016;
    const vx = (w.x - lastX) / dt, vy = (w.y - lastY) / dt;
    Pointer.vx = Pointer.vx * 0.55 + vx * 0.45;
    Pointer.vy = Pointer.vy * 0.55 + vy * 0.45;
    const speed = Math.min(Math.hypot(Pointer.vx, Pointer.vy), 6);
    Pointer.x = w.x; Pointer.y = w.y;
    Pointer.active = 1;
    Pointer.glow = Math.min(1, Pointer.glow + 0.25);
    Pointer.strength = Math.min(1.4, 0.35 + speed * 0.16) * (Pointer.down ? 1.6 : 0.7);
    Pointer.mode = (ev.shiftKey || ev.ctrlKey) ? -1 : 1;
    if (Pointer.down && speed > 1.2 && now - lastT > 34) {
      Pointer.add(w.x, w.y, Pointer.vx, Pointer.vy, 0.55, 0.22, 0);
    }
    lastX = w.x; lastY = w.y; lastT = now; haveLast = true;
  }, { passive: true });
  canvas.addEventListener('pointerdown', ev => {
    canvas.setPointerCapture(ev.pointerId);
    const w = toWorld(ev);
    Pointer.down = true; Pointer.x = w.x; Pointer.y = w.y; lastX = w.x; lastY = w.y;
    lastT = performance.now(); haveLast = true;
    Pointer.glow = 1; Pointer.pulse = 1; Pointer.active = 1;
    Pointer.strength = 1.2;
    Pointer.mode = (ev.shiftKey || ev.ctrlKey) ? -1 : 1;
    Pointer.add(w.x, w.y, 0, 0, 1.0, 0.16, 2);
    if (ev.button === 2) Pointer.add(w.x, w.y, 0, 0, 0.8, 0.3, 1);
  });
  const up = ev => {
    Pointer.down = false;
    try { canvas.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { Pointer.down = false; Pointer.active = 0; });
  canvas.addEventListener('contextmenu', ev => ev.preventDefault());
}

/* ------------------------------------------------------------------ application */
const App = {
  cssW: 0, cssH: 0, dpr: 1, rw: 0, rh: 0, simW: 0, simH: 0,
  renderer: null, rendererName: '—',
  perf: new PerfMonitor(60),
  lastFrame: 0, lastDt: 0.016,
  simU: new Float32Array(UFLOATS),
  drawU: new Float32Array(UFLOATS),
  ctxState: { values: State.values },
  ctx: null,
  fallbackTried: {},
  adaptiveLock: 0,
  hudTimer: 0,
  uiTimer: 0,
  saveTimer: 0,
  running: false,

  async boot() {
    const canvas = document.getElementById('stage');
    this.canvas = canvas;
    const stored = Persistence.load();
    if (stored) {
      Object.assign(State.values, factoryValues(), stored.values);
      State.preset = stored.preset || 'custom';
      State.collapsed = !!stored.collapsed;
    } else if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      State.values.temporalSpeed = 0.35;
      State.values.lightMotion = 0.12;
      Status.info('Reduced-motion preference detected — temporal speed lowered.');
    }
    State.manualScale = State.values.renderScale;
    State.effectiveScale = State.values.renderScale;
    Object.assign(State.from, State.values); Object.assign(State.to, State.values);
    this.cssW = canvas.clientWidth || window.innerWidth;
    this.cssH = canvas.clientHeight || window.innerHeight;

    HUD.build();
    UI.build(this);
    UI.syncInputs();
    UI.markPreset(PRESETS.some(p => p.name === State.preset) ? State.preset : null);
    this.applyCollapsed();

    this.rendererName = 'initialising';
    UI.setBadge('init…', true);
    const ok = await this.tryBackend('webgpu');
    if (!ok && !(await this.tryBackend('webgl2'))) await this.tryBackend('canvas2d');

    attachPointer(canvas, this);
    this.bindKeys();
    this.observeResize();
    this.resize(true);
    if (this.renderer && this.renderer.ready) { this.renderer.warm ? this.renderer.warm(34) : null; }
    this.running = true;
    this.lastFrame = performance.now();
    requestAnimationFrame(this.frame.bind(this));
  },

  async tryBackend(which) {
    try {
      if (which === 'webgpu') {
        if (!('gpu' in navigator)) throw new Error('WebGPU is not exposed by this browser (chrome://gpu, or enable "Experimental Web Platform features").');
        const r = new WebGPURenderer(this.canvas);
        await r.init();
        await this.install(r);
        return true;
      }
      if (which === 'webgl2') {
        if (!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')))
          throw new Error('WebGL2 is unavailable in this browser.');
        const r = new WebGL2Renderer(this.canvas);
        await r.init();
        await this.install(r);
        return true;
      }
      if (which === 'canvas2d') {
        const r = new Canvas2DRenderer(this.canvas);
        await r.init();
        await this.install(r);
        Status.warn('GPU paths unavailable — running the CPU thin-film approximation.');
        return true;
      }
    } catch (err) {
      const label = which === 'canvas2d' ? 'Canvas2D' : (which === 'webgl2' ? 'WebGL2' : 'WebGPU');
      Status.error(label + ' initialisation failed.', err && (err.stack ? String(err.message) + '\n' + String(err.stack).split('\n').slice(0, 4).join('\n') : err));
      return false;
    }
    return false;
  },

  async install(r) {
    this.renderer = r;
    this.rendererName = r.name;
    UI.setBadge(r.name, r.name.indexOf('fallback') >= 0);
    Status.info('Renderer online: ' + r.name + '.');
    this.resize(true);
    if (this.renderer && this.renderer.ready) {
      for (let i = 0; i < 34; i++) { // warm the film so the first visible frame already has structure
        this.stepTime(1 / 60, true);
        fillUniforms(this.simU, this.uniformContext(1 / 60), 'sim');
        try { this.renderer.render(this.simU, this.drawU, 1); } catch (e) { throw e; }
      }
    }
  },

  fallback(reason) {
    if (!this.renderer) return;
    this.renderer.destroy();
    this.renderer = null; this.running = false;
    const order = reason === 'webgpu-lost' ? ['webgl2', 'canvas2d'] : ['canvas2d'];
    (async () => {
      for (const b of order) if (await this.tryBackend(b)) { this.running = true; this.lastFrame = performance.now(); requestAnimationFrame(this.frame.bind(this)); return; }
      Status.error('No renderer could be started.');
    })();
  },

  /* ---------------- sizing ---------------- */
  observeResize() {
    const request = () => { this.resizePending = true; };
    if ('ResizeObserver' in window) {
      this.ro = new ResizeObserver(request);
      this.ro.observe(document.documentElement);
    }
    window.addEventListener('resize', request, { passive: true });
    window.addEventListener('orientationchange', request, { passive: true });
    document.addEventListener('fullscreenchange', () => { request(); this.updateFsButton(); });
  },
  resize(force) {
    const w = Math.max(1, this.canvas.clientWidth || window.innerWidth);
    const h = Math.max(1, this.canvas.clientHeight || window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const scale = Math.max(0.25, Math.min(2, State.effectiveScale));
    const rw = Math.max(2, Math.round(w * dpr * scale));
    const rh = Math.max(2, Math.round(h * dpr * scale));
    const changed = force || rw !== this.rw || rh !== this.rh || dpr !== this.dpr;
    this.cssW = w; this.cssH = h;
    if (!changed) return;
    this.dpr = dpr; this.rw = rw; this.rh = rh;
    if (this.canvas.width !== rw) this.canvas.width = rw;
    if (this.canvas.height !== rh) this.canvas.height = rh;
    const q = QUALITY[State.values.quality] || QUALITY.high;
    const simBase = Math.min(rw, rh);
    let sw = Math.round(simBase * q.sim * (rw >= rh ? rw / rh : 1) / 2) * 2;
    let sh = Math.round(simBase * q.sim / 2) * 2;
    if (rw < rh) { const sw2 = sh; sh = Math.round(simBase * q.sim * (rh / rw) / 2) * 2; sw = sw2; }
    const cap = q.maxSim;
    const m = Math.max(sw, sh);
    if (m > cap) { const k = cap / m; sw = Math.max(64, Math.round(sw * k / 2) * 2); sh = Math.max(64, Math.round(sh * k / 2) * 2); }
    this.simW = Math.max(64, sw); this.simH = Math.max(64, sh);
    if (this.renderer && this.renderer.ready !== false) {
      try { this.renderer.resize(rw, rh, this.simW, this.simH); }
      catch (e) { Status.error('Resize failed on ' + this.rendererName + '.', e && e.message); }
    }
  },

  /* ---------------- uniform context ---------------- */
  uniformContext(dt) {
    const q = QUALITY[State.values.quality] || QUALITY.high;
    const aspect = Math.max(this.rw, 1) / Math.max(this.rh, 1);
    const minWorld = 2 / Math.min(this.rh, this.simH);
    return {
      time: State.time, dt, values: State.values, q,
      aspect, ySign: this.renderer ? this.renderer.ySign : -1,
      rw: this.rw, rh: this.rh, simW: this.simW, simH: this.simH,
      waveSpeed: 0.30,
      detailScale: (1.4 + State.values.flowScale * 1.05) * (1 + q.idx * 0.06),
      aaSamples: Math.max(1, Math.min(4, Math.round(State.values.antiAlias))),
      normScale: Math.max(minWorld, 0.0006) * 260,
      ptr: Pointer,
      impulses: Pointer.impulses,
    };
  },
  uniformFor(kind) {
    const ctx = this.uniformContext(kind === 'warm' ? 1 / 60 : this.simDt);
    const out = new Float32Array(UFLOATS);
    fillUniforms(out, ctx, kind === 'present' ? 'present' : 'sim');
    return out;
  },

  stepTime(dt, warm) {
    State.time += dt * (warm ? 1 : State.values.temporalSpeed);
  },

  /* ---------------- main loop ---------------- */
  frame(now) {
    requestAnimationFrame(this.frame.bind(this));
    const rawDt = Math.min(Math.max((now - this.lastFrame) / 1000, 0.0001), 0.1);
    this.lastFrame = now;
    this.lastDt = rawDt;
    if (this.resizePending) { this.resizePending = false; this.resize(false); }
    const dprNow = Math.min(window.devicePixelRatio || 1, 2.5);
    if (Math.abs(dprNow - this.dpr) > 0.001) this.resize(true);

    const t0 = performance.now();
    this.updateTween(rawDt);
    Pointer.step(rawDt);

    if (this.renderer && this.renderer.ready && !document.hidden) {
      const ts = State.values.temporalSpeed;
      const simDt = State.paused ? 0 : Math.min(Math.max(rawDt * ts, 0), 1 / 30) * 0.5;
      this.simDt = simDt;
      const substeps = State.paused ? 0 : ((QUALITY[State.values.quality].idx >= 1 && ts > 0.02) ? 2 : 1);
      if (substeps > 0) this.stepTime(simDt, false);
      fillUniforms(this.simU, this.uniformContext(simDt), 'sim');
      fillUniforms(this.drawU, this.uniformContext(simDt), 'present');
      try { this.renderer.render(this.simU, this.drawU, substeps); }
      catch (err) { Status.error('Render fault on ' + this.rendererName + ' — attempting recovery.', err && err.message); this.running = false; this.fallback('render'); return; }
    }
    const frameMs = performance.now() - t0;
    this.perf.sample(rawDt * 1000);
    this.tickAdaptive(now, rawDt);

    if (now - this.uiTimer > 90) { this.uiTimer = now; UI.syncInputs(); }
    if (now - this.hudTimer > 260) {
      this.hudTimer = now;
      const target = State.values.targetFps;
      HUD.update({
        backend: this.rendererName,
        fps: this.perf.fps.toFixed(1),
        frame: this.perf.median.toFixed(2) + ' ms med / ' + frameMs.toFixed(2) + ' gpu-side',
        canvas: this.canvas.width + '×' + this.canvas.height,
        render: State.effectiveScale.toFixed(2) + ' (' + (State.values.adaptive ? 'auto' : 'manual') + ')',
        sim: this.simW + '×' + this.simH,
        dpr: this.dpr.toFixed(2),
        quality: String(State.values.quality).toUpperCase() + ' · ' + (QUALITY[State.values.quality].nsamp) + 'λ',
        target: target + ' fps',
        targetNum: target,
        loadPct: Math.min(100, (this.perf.frameMs / (1000 / target)) * 100),
      });
    }
    if (now - this.saveTimer > 1400) { this.saveTimer = now; this.save(); }
  },

  /* ---------------- adaptive quality ---------------- */
  tickAdaptive(now) {
    if (!State.values.adaptive || State.paused) return;
    if (now < this.adaptiveLock) return;
    const adv = this.perf.advise(now);
    if (!adv) return;
    const order = QUALITY_ORDER;
    let qi = order.indexOf(State.values.quality);
    if (adv < 0) {
      const floor = 0.4;
      if (State.effectiveScale > floor + 0.005) {
        State.effectiveScale = Math.max(floor, +(State.effectiveScale - 0.08).toFixed(3));
        this.resize(false);
      } else if (qi > 0) {
        State.values.quality = order[qi - 1];
        State.effectiveScale = Math.max(0.45, State.effectiveScale);
        this.perf.reset(); this.resize(false);
        Status.info('Adaptive quality → ' + State.values.quality + ' (render ' + State.effectiveScale.toFixed(2) + ')');
      }
    } else {
      if (State.effectiveScale < Math.min(1.5, State.manualScale) - 0.005) {
        State.effectiveScale = Math.min(State.manualScale, +(State.effectiveScale + 0.05).toFixed(3));
        this.resize(false);
      } else if (qi < order.length - 1) {
        State.values.quality = order[qi + 1];
        this.perf.reset(); this.resize(false);
        Status.info('Adaptive quality → ' + State.values.quality + ' (headroom detected)');
      }
    }
    this.adaptiveLock = now + 2200;
    UI.syncInputs();
  },

  /* ---------------- parameters / tween ---------------- */
  setParam(k, v, opts) {
    const d = P.get(k); if (!d) return;
    const num = d.t === 'n' ? Math.min(d.max, Math.max(d.min, Number(v) || 0)) : v;
    State.values[k] = num;
    if (opts && opts.fromUI) {
      this.cancelTween();
      State.preset = 'custom'; UI.markPreset(null);
      if (k === 'renderScale') { State.manualScale = num; if (!State.values.adaptive) { State.effectiveScale = num; this.resize(false); } }
    }
    this.adaptiveLock = performance.now() + 1200;
    this.save();
  },
  resetParam(k) {
    const d = P.get(k); if (!d) return;
    const target = {}; target[k] = d.d;
    this.startTween(target, 0.35);
    this.save();
  },
  cancelTween() { State.tweenT = 1; Object.assign(State.from, State.values); },
  startTween(target, dur) {
    Object.assign(State.from, State.values);
    State.to = Object.assign({}, State.values, target);
    State.tweenT = 0;
    State.tweenDur = Math.max(0.05, dur || 0.9);
    this.adaptiveLock = performance.now() + 1400;
  },
  updateTween(dt) {
    if (State.tweenT >= 1) return;
    State.tweenT = Math.min(1, State.tweenT + dt / State.tweenDur);
    const e = State.tweenT < 0.5 ? 2 * State.tweenT * State.tweenT : 1 - Math.pow(-2 * State.tweenT + 2, 2) / 2;
    for (const d of PDEFS) {
      if (d.t !== 'n') continue;
      const a = State.from[d.k], b = State.to[d.k];
      if (typeof a === 'number' && typeof b === 'number') State.values[d.k] = a + (b - a) * e;
    }
    if (State.tweenT >= 1) Object.assign(State.values, State.to);
  },
  applyPreset(name) {
    const pr = PRESETS.find(p => p.name === name); if (!pr) return;
    State.preset = name;
    this.startTween(pr.values, 0.95);
    UI.markPreset(name);
    this.save();
  },
  resetAll() {
    const base = (PRESETS.find(p => p.name === State.preset) || PRESETS[0]).values;
    const target = Object.assign({}, factoryValues(), base);
    this.startTween(target, 0.7);
    UI.markPreset(State.preset);
    Status.info('Parameters reset to “' + (PRESETS.find(p => p.name === State.preset) || PRESETS[0]).name + '”.');
  },
  factoryReset() {
    Persistence.clear();
    State.preset = 'custom';
    State.values = factoryValues();
    State.manualScale = State.values.renderScale;
    State.effectiveScale = State.values.renderScale;
    Object.assign(State.from, State.values); Object.assign(State.to, State.values);
    State.tweenT = 1;
    UI.syncInputs(); UI.markPreset(null);
    this.perf.target = State.values.targetFps;
    this.resize(false);
    Status.info('Factory defaults restored.');
  },
  mutate() {
    const target = {};
    for (const d of PDEFS) {
      if (d.t !== 'n' || d.fixed) continue;
      if (Math.random() > 0.72) continue;
      const cur = State.values[d.k];
      const span = (d.max - d.min);
      const sigma = span * 0.10;
      const g = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; // ~gaussian
      let v = cur + g * sigma;
      const lo = d.r ? d.r[0] : d.min, hi = d.r ? d.r[1] : d.max;
      v = Math.min(hi, Math.max(lo, Math.min(d.max, Math.max(d.min, v))));
      target[d.k] = Math.abs(v - cur) < (d.step || 0.01) ? cur : v;
    }
    target.seed = Math.random();
    State.preset = 'custom'; UI.markPreset(null);
    this.startTween(target, 0.85);
    Pointer.add(Pointer.x || 0, Pointer.y || 0, 0, 0, 0.5, 0.4, 2);
    this.save();
  },
  randomize() {
    const target = {};
    for (const d of PDEFS) {
      if (d.t !== 'n' || d.fixed) continue;
      const lo = d.r ? d.r[0] : d.min, hi = d.r ? d.r[1] : d.max;
      const steps = Math.max(1, Math.round((hi - lo) / (d.step || 0.01)));
      target[d.k] = Math.min(d.max, Math.max(d.min, lo + Math.round(Math.random() * steps) * (d.step || 0.01)));
    }
    target.seed = Math.random();
    State.preset = 'custom'; UI.markPreset(null);
    this.startTween(target, 0.9);
    this.save();
  },

  /* ---------------- session actions ---------------- */
  togglePause() {
    State.paused = !State.paused;
    UI.els.pause.textContent = State.paused ? 'Resume' : 'Pause';
    UI.els.pause.classList.toggle('on', State.paused);
  },
  toggleCollapsed() { this.setCollapsed(!State.collapsed); },
  setCollapsed(v) {
    State.collapsed = v;
    UI.els.panel.classList.toggle('collapsed', v);
    UI.els.collapse.textContent = v ? '+' : '—';
    UI.els.collapse.setAttribute('aria-expanded', String(!v));
    this.save();
  },
  applyCollapsed() { this.setCollapsed(!!State.collapsed); },
  setHidden(v) {
    State.hidden = v;
    UI.els.panel.classList.toggle('hidden', v);
    UI.els.reveal.classList.toggle('show', v);
  },
  toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(e => Status.warn('Fullscreen request refused', e && e.message));
    } else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  },
  updateFsButton() {
    if (UI.els.fs) UI.els.fs.classList.toggle('on', !!document.fullscreenElement);
  },
  async capture() {
    if (!this.renderer || !this.renderer.capture) { Status.warn('Capture is not available on this backend.'); return; }
    Status.info('Rendering capture…');
    try {
      const blob = await this.renderer.capture();
      if (!blob) { Status.warn('Capture produced no image.'); return; }
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = 'thinfilm-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      Status.info('Frame saved (' + Math.round(blob.size / 1024) + ' kB).');
    } catch (e) { Status.error('Capture failed.', e && e.message); }
  },
  serialise() {
    const o = { v: 1, preset: State.preset, quality: State.values.quality, adaptive: State.values.adaptive,
      targetFps: State.values.targetFps, collapsed: State.collapsed, values: {} };
    for (const d of PDEFS) o.values[d.k] = State.values[d.k];
    return JSON.stringify(o);
  },
  openExport() {
    const json = this.serialise();
    this.showModal('Export settings', json, false);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => { this.modalMsg('Copied to clipboard.'); }, () => { this.modalMsg('Copy manually — clipboard blocked.'); });
    } else this.modalMsg('Clipboard API unavailable — select and copy.');
  },
  openImport() { this.showModal('Import settings', this.serialise(), true); },
  showModal(title, text, editable) {
    const m = document.getElementById('modal');
    const ta = document.getElementById('modalText');
    document.getElementById('modalTitle').textContent = title;
    ta.value = text; ta.readOnly = !editable;
    document.getElementById('modalApply').style.display = editable ? '' : 'none';
    document.getElementById('modalMsg').textContent = '';
    m.classList.add('show');
    setTimeout(() => { ta.focus(); ta.setSelectionRange(0, Math.min(text.length, 200)); }, 30);
  },
  modalMsg(t) { document.getElementById('modalMsg').textContent = t; },
  hideModal() { document.getElementById('modal').classList.remove('show'); },
  importText() {
    const raw = document.getElementById('modalText').value;
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { this.modalMsg('Invalid JSON: ' + e.message); return; }
    const clean = Persistence.sanitize(parsed);
    if (!clean || Object.keys(clean.values).length < 4) { this.modalMsg('Rejected: no recognised parameters.'); return; }
    const enums = {};
    if (parsed && ['low', 'medium', 'high', 'ultra'].includes(parsed.quality)) enums.quality = parsed.quality;
    if (parsed && [30, 60, 90, 120].includes(Number(parsed.targetFps))) enums.targetFps = Number(parsed.targetFps);
    if (parsed) enums.adaptive = !!parsed.adaptive;
    Object.assign(State.values, enums);
    this.startTween(clean.values, 0.8);
    State.preset = typeof parsed.preset === 'string' ? parsed.preset : 'custom';
    State.manualScale = State.values.renderScale;
    if (!State.values.adaptive) State.effectiveScale = State.values.renderScale;
    this.perf.target = State.values.targetFps;
    UI.syncInputs(); UI.markPreset(PRESETS.some(p => p.name === State.preset) ? State.preset : null);
    UI.els.adaptive.checked = !!State.values.adaptive;
    this.resize(false);
    this.hideModal();
    Status.info('Imported ' + Object.keys(clean.values).length + ' parameters.');
  },
  save() {
    Persistence.save({ v: 1, preset: State.preset, quality: State.values.quality, adaptive: State.values.adaptive,
      targetFps: State.values.targetFps, collapsed: State.collapsed, values: State.values });
  },
  onQualityChange(manual) {
    if (manual) { this.perf.reset(); this.adaptiveLock = performance.now() + 2500; }
    this.resize(true);
    this.save();
  },
  onAdaptiveChange() {
    this.perf.reset();
    this.adaptiveLock = performance.now() + 2500;
    if (!State.values.adaptive) { State.effectiveScale = State.manualScale; this.resize(false); }
    this.save();
  },
  bindKeys() {
    window.addEventListener('keydown', e => {
      const tgt = e.target;
      const typing = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable);
      if (e.key === 'Escape') { this.hideModal(); return; }
      if (typing && e.key !== 'Escape') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (e.code === 'Space') { e.preventDefault(); this.togglePause(); return; }
      if (k === 'r') { e.preventDefault(); this.resetAll(); }
      else if (k === 'm') { e.preventDefault(); if (e.shiftKey) this.randomize(); else this.mutate(); }
      else if (k === 'f') { e.preventDefault(); this.toggleFullscreen(); }
      else if (k === 'h') { e.preventDefault(); this.setHidden(!State.hidden); }
      else if (k === 'c') { e.preventDefault(); this.capture(); }
      else if (k >= '1' && k <= '6') { const pr = PRESETS[parseInt(k, 10) - 1]; if (pr) this.applyPreset(pr.name); }
    });
  },
};

/* modal wiring */
document.getElementById('modalClose').addEventListener('click', () => App.hideModal());
document.getElementById('modalApply').addEventListener('click', () => App.importText());
document.getElementById('modalCopy').addEventListener('click', () => {
  const ta = document.getElementById('modalText');
  ta.select();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => App.modalMsg('Copied.'), () => App.modalMsg('Copy manually (Ctrl/Cmd+C).'));
  else { try { document.execCommand('copy'); App.modalMsg('Copied.'); } catch (e) { App.modalMsg('Copy manually (Ctrl/Cmd+C).'); } }
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') App.hideModal(); });

window.addEventListener('error', ev => Status.error('Runtime error: ' + (ev.message || 'unknown'), ev.filename ? ev.filename + ':' + ev.lineno : ''));
window.addEventListener('unhandledrejection', ev => Status.error('Unhandled promise rejection', (ev.reason && ev.reason.message) || String(ev.reason)));

App.boot().catch(err => Status.error('Application failed to start.', err && (err.stack || err.message || String(err))));
})();
</script>
</body>
</html>
