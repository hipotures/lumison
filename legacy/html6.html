<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thin-Film Fluid Laboratory</title>
<style>
  :root{
    --bg:#04060a;
    --ink:#e6edf5;
    --muted:#93a3b5;
    --dim:#6b7b8d;
    --line:rgba(160,190,220,.14);
    --line-strong:rgba(170,200,230,.26);
    --glass:rgba(9,13,19,.66);
    --glass-2:rgba(14,19,27,.82);
    --accent:#79dfe6;
    --accent-2:#c39bff;
    --warn:#ffb86b;
    --err:#ff8080;
    --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas","DejaVu Sans Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#04060a;touch-action:none}
  #stage:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* ---------- diagnostics overlay ---------- */
  #hud{position:fixed;left:14px;top:14px;z-index:20;pointer-events:none;
    font-family:var(--mono);font-size:10.5px;line-height:1.55;letter-spacing:.02em;
    background:linear-gradient(180deg,rgba(6,9,14,.72),rgba(6,9,14,.58));
    border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:214px;
    backdrop-filter:blur(9px) saturate(1.1);-webkit-backdrop-filter:blur(9px) saturate(1.1)}
  #hud .hrow{display:flex;justify-content:space-between;gap:14px;white-space:nowrap}
  #hud .k{color:var(--dim)}
  #hud .v{color:var(--ink)}
  #hud .v.acc{color:var(--accent)}
  #hud .title{color:var(--muted);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  #hud .bar{height:2px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden;border-radius:2px}
  #hud .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s}

  /* ---------- status / diagnostics messages ---------- */
  #status{position:fixed;left:14px;bottom:14px;z-index:30;display:flex;flex-direction:column;gap:6px;max-width:min(460px,60vw)}
  .msg{font-family:var(--mono);font-size:11px;line-height:1.45;padding:7px 9px;border-radius:3px;
    background:var(--glass-2);border:1px solid var(--line);border-left:2px solid var(--muted);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;gap:8px;align-items:flex-start}
  .msg.err{border-left-color:var(--err);color:#ffd9d9}
  .msg.warn{border-left-color:var(--warn);color:#ffe8c9}
  .msg.ok{border-left-color:#68d39a}
  .msg pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:10px;color:#ffbebe;max-height:140px;overflow:auto}
  .msg button{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;padding:0 2px}
  .msg button:hover{color:var(--ink)}

  /* ---------- control panel ---------- */
  #panel{position:fixed;right:14px;top:14px;z-index:25;width:342px;max-height:calc(100vh - 28px);
    display:flex;flex-direction:column;
    background:var(--glass);border:1px solid var(--line);border-radius:4px;
    backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
    box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045);
    transition:width .22s ease,opacity .18s ease;overflow:hidden}
  #panel.hidden{opacity:0;pointer-events:none;transform:translateX(8px)}
  #panel.collapsed{width:180px}
  #panel.collapsed .pbody,#panel.collapsed #presetbar{display:none}
  .phead{display:flex;align-items:center;gap:8px;padding:10px 11px;border-bottom:1px solid var(--line);flex:none}
  .phead .mark{width:14px;height:14px;flex:none;border-radius:50%;
    background:conic-gradient(from 210deg,#63e6ff,#7c8cff,#e07bd6,#ffd166,#5ce6a8,#63e6ff);
    box-shadow:0 0 10px rgba(120,220,255,.45)}
  .phead h1{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;margin:0;font-weight:600;color:var(--ink);white-space:nowrap}
  .phead .sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line-strong);border-radius:2px;padding:2px 5px;color:var(--accent);white-space:nowrap}
  .badge.warn{color:var(--warn)}
  .iconbtn{flex:none;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);
    width:22px;height:22px;border-radius:3px;cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
  .iconbtn:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(255,255,255,.08)}
  .pbody{overflow-y:auto;overflow-x:hidden;padding:4px 11px 12px;scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.18) transparent}
  .pbody::-webkit-scrollbar{width:9px}
  .pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px;border:3px solid transparent;background-clip:content-box}
  .pbody::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:content-box}

  #presetbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:9px 11px;border-bottom:1px solid var(--line);flex:none}

  details.sec{border-bottom:1px solid var(--line);margin:0}
  details.sec>summary{list-style:none;cursor:pointer;padding:9px 2px;display:flex;align-items:center;gap:8px;
    font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);user-select:none}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary:hover{color:var(--ink)}
  details.sec>summary .chev{width:0;height:0;border-left:4px solid currentColor;border-top:3px solid transparent;
    border-bottom:3px solid transparent;transform:rotate(90deg);transition:transform .16s;flex:none;opacity:.8}
  details.sec[open]>summary .chev{transform:rotate(180deg)}
  details.sec>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.05em}
  .secbody{padding:0 0 9px}

  .row{margin:0 0 9px}
  .row .top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .row label{font-size:11px;color:var(--muted);cursor:ew-resize;letter-spacing:.01em}
  .row label:hover{color:var(--ink)}
  .row .val{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:2px;padding:0 4px;min-width:46px;text-align:right}
  .row.touched .val{color:var(--accent);border-color:rgba(121,223,230,.28)}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;display:block;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,rgba(121,223,230,.55),rgba(195,155,255,.42)),rgba(255,255,255,.09);
    background-blend-mode:screen}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#e9f6fb;border:1px solid rgba(0,0,0,.55);margin-top:-4px;
    box-shadow:0 0 0 1px rgba(121,223,230,.35),0 1px 4px rgba(0,0,0,.6)}
  input[type=range]:hover::-webkit-slider-thumb{background:#fff;box-shadow:0 0 0 4px rgba(121,223,230,.16)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.13)}
  input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:rgba(121,223,230,.5)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:1px solid rgba(0,0,0,.55);border-radius:50%;background:#e9f6fb}
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(121,223,230,.55)}
  input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(121,223,230,.55)}

  .btnrow{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 9px}
  button.btn{font-family:var(--sans);font-size:10.5px;letter-spacing:.03em;color:var(--muted);
    background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:3px;
    padding:5px 8px;cursor:pointer;transition:background .13s,color .13s,border-color .13s}
  button.btn:hover{color:var(--ink);background:rgba(255,255,255,.1);border-color:var(--line-strong)}
  button.btn:active{transform:translateY(1px)}
  button.btn.on{color:#05262a;background:var(--accent);border-color:var(--accent);font-weight:600}
  button.btn.pres{padding:6px 4px;font-size:10px;text-align:center}
  button.btn.pres.on{color:#052024}
  button.btn.danger:hover{color:#ffd7d7;border-color:rgba(255,128,128,.5);background:rgba(255,90,90,.12)}
  button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;align-items:center;margin-bottom:9px}
  .field{display:flex;align-items:center;gap:7px}
  .field>span{font-size:10.5px;color:var(--muted);white-space:nowrap}
  select{font-family:var(--mono);font-size:10.5px;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:3px;padding:4px 5px;cursor:pointer;flex:1;min-width:0}
  select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:10.5px;color:var(--muted)}
  .switch input{position:absolute;opacity:0;width:1px;height:1px}
  .switch .track{width:26px;height:14px;border-radius:8px;background:rgba(255,255,255,.11);
    border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
  .switch .track::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;
    background:var(--dim);transition:transform .15s,background .15s}
  .switch input:checked+.track{background:rgba(121,223,230,.32);border-color:rgba(121,223,230,.5)}
  .switch input:checked+.track::after{transform:translateX(12px);background:var(--accent)}
  .switch input:focus-visible+.track{box-shadow:0 0 0 2px rgba(121,223,230,.6)}

  .note{font-size:10px;color:var(--dim);line-height:1.5;margin:2px 0 8px}
  .keys{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
  kbd{font-family:var(--mono);font-size:9.5px;color:var(--muted);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 4px}
  .keys span{font-size:9.5px;color:var(--dim);align-self:center;margin-right:6px}

  #reveal{position:fixed;right:14px;top:14px;z-index:26;display:none}
  #reveal.show{display:block}

  /* ---------- modal (import) ---------- */
  #modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(2,4,7,.62);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #modal.show{display:grid}
  .sheet{width:min(560px,92vw);background:var(--glass-2);border:1px solid var(--line-strong);border-radius:4px;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .sheet header{padding:11px 13px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .sheet textarea{width:100%;height:230px;resize:vertical;background:rgba(0,0,0,.42);color:var(--ink);
    border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11px;padding:9px;margin:13px 0 0;
    box-sizing:border-box;line-height:1.5;white-space:pre;overflow:auto}
  .sheet .foot{display:flex;gap:6px;padding:13px;align-items:center}
  .sheet .foot .sp{margin-left:auto}
  #modalMsg{font-family:var(--mono);font-size:10px;color:var(--warn)}
  @media (prefers-reduced-motion: reduce){ #panel{transition:none} }
  @media (max-width:900px){ #panel{width:296px} #hud{min-width:190px;font-size:10px} }
  @media (max-height:620px){ #hud{display:none} }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" role="img" aria-label="Real-time iridescent thin-film fluid simulation"></canvas>

<div id="hud" aria-hidden="true"></div>
<div id="status" role="status" aria-live="polite"></div>

<button id="reveal" class="btn btn" type="button" title="Show interface (H)">☰ controls</button>

<aside id="panel" aria-label="Simulation controls">
  <div class="phead">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <h1>Thin-Film Lab</h1>
      <div class="sub">interference · flow · optics</div>
    </div>
    <span id="backendBadge" class="badge">init…</span>
    <button id="collapseBtn" class="iconbtn" type="button" title="Collapse / expand panel" aria-expanded="true">—</button>
  </div>
  <div id="presetbar" role="group" aria-label="Presets"></div>
  <div class="pbody" id="pbody"></div>
</aside>

<div id="modal" role="dialog" aria-modal="true" aria-label="Settings exchange">
  <div class="sheet">
    <header id="modalTitle">Settings</header>
    <textarea id="modalText" spellcheck="false" aria-label="Settings JSON"></textarea>
    <div class="foot">
      <button class="btn" type="button" id="modalCopy">Copy</button>
      <button class="btn" type="button" id="modalApply">Apply</button>
      <span id="modalMsg"></span>
      <span class="sp"></span>
      <button class="btn on" type="button" id="modalClose">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function () {
/* =====================================================================================
   THIN-FILM FLUID LABORATORY
   One file, no assets. Two-pass GPU pipeline (advect film state -> shade interference).
   Backends: WebGPU  ->  WebGL2  ->  Canvas2D.  Shared GLSL/WGSL math core via a tiny
   disciplined transpiler (the shader source below is authored in WGSL syntax and
   mechanically lowered to GLSL ES 3.00 for the fallback path).
   ===================================================================================== */

/* ------------------------------------------------------------------ parameter model */
const PDEFS = [
  // simulation --------------------------------------------------------------
  { k:'flowSpeed',      g:'sim', t:'n', l:'Flow Speed',        min:0,   max:2.5, step:0.01,  d:0.65,   f:2, r:[0.1,1.7] },
  { k:'flowScale',      g:'sim', t:'n', l:'Flow Scale',        min:0.3, max:3.5, step:0.01,  d:1.05,   f:2, r:[0.4,2.4] },
  { k:'turbulence',     g:'sim', t:'n', l:'Turbulence',        min:0,   max:2,   step:0.01,  d:0.80,   f:2, r:[0.15,1.6] },
  { k:'warp',           g:'sim', t:'n', l:'Domain Warp',       min:0,   max:3,   step:0.01,  d:1.15,   f:2, r:[0.1,2.4] },
  { k:'vorticity',      g:'sim', t:'n', l:'Vorticity',         min:0,   max:2.5, step:0.01,  d:1.00,   f:2, r:[0.1,2.1] },
  { k:'fineDetail',     g:'sim', t:'n', l:'Fine Detail',       min:0,   max:2,   step:0.01,  d:0.85,   f:2, r:[0.1,1.7] },
  { k:'filmThickness',  g:'sim', t:'n', l:'Film Thickness',    min:60,  max:1400,step:1,     d:430,    f:0, u:'nm', r:[120,900] },
  { k:'thicknessVar',   g:'sim', t:'n', l:'Thickness Variation',min:0,  max:2,   step:0.01,  d:1.00,   f:2, r:[0.2,1.9] },
  { k:'drainage',       g:'sim', t:'n', l:'Drainage Bias',     min:0,   max:2,   step:0.01,  d:0.55,   f:2, r:[0.05,1.5] },
  { k:'tension',        g:'sim', t:'n', l:'Surface Tension',   min:0,   max:2,   step:0.01,  d:0.35,   f:2, r:[0.02,1.4] },
  { k:'feed',           g:'sim', t:'n', l:'Liquid Feed',       min:0,   max:2,   step:0.01,  d:0.50,   f:2, r:[0.1,1.4] },
  { k:'surfaceRelief',  g:'sim', t:'n', l:'Surface Relief',    min:0,   max:3,   step:0.01,  d:1.00,   f:2, r:[0.2,2.4] },
  // optics ------------------------------------------------------------------
  { k:'interference',   g:'opt', t:'n', l:'Interference',      min:0,   max:2,   step:0.01,  d:1.00,   f:2, r:[0.3,1.8] },
  { k:'spectralSpread', g:'opt', t:'n', l:'Spectral Spread',   min:0.3, max:2.5, step:0.01,  d:1.00,   f:2, r:[0.4,2.0] },
  { k:'dispersion',     g:'opt', t:'n', l:'Dispersion',        min:0,   max:1.5, step:0.01,  d:0.35,   f:2, r:[0,1.2] },
  { k:'saturation',     g:'opt', t:'n', l:'Saturation',        min:0,   max:2,   step:0.01,  d:1.08,   f:2, r:[0.5,1.7] },
  { k:'exposure',       g:'opt', t:'n', l:'Exposure',          min:0.2, max:3,   step:0.01,  d:1.00,   f:2, r:[0.6,2.0] },
  { k:'contrast',       g:'opt', t:'n', l:'Contrast',          min:0.3, max:2.5, step:0.01,  d:1.06,   f:2, r:[0.75,1.8] },
  { k:'fresnel',        g:'opt', t:'n', l:'Fresnel Strength',  min:0,   max:2.5, step:0.01,  d:1.00,   f:2, r:[0.2,2.2] },
  { k:'envReflection',  g:'opt', t:'n', l:'Reflection Field',  min:0,   max:2.5, step:0.01,  d:1.00,   f:2, r:[0.2,2.0] },
  { k:'specular',       g:'opt', t:'n', l:'Specular Strength', min:0,   max:3,   step:0.01,  d:1.15,   f:2, r:[0.2,2.4] },
  { k:'specSharp',      g:'opt', t:'n', l:'Specular Sharpness',min:4,   max:240, step:1,     d:55,     f:0, r:[10,180] },
  // lighting ----------------------------------------------------------------
  { k:'lightAz',        g:'lit', t:'n', l:'Light Azimuth',     min:0,   max:360, step:0.5,   d:40,     f:1, u:'°', r:[0,360] },
  { k:'lightEl',        g:'lit', t:'n', l:'Light Elevation',   min:0,   max:85,  step:0.5,   d:34,     f:1, u:'°', r:[6,80] },
  { k:'lightMotion',    g:'lit', t:'n', l:'Light Motion Speed',min:0,   max:2,   step:0.01,  d:0.35,   f:2, r:[0,1.4] },
  { k:'lightIntensity', g:'lit', t:'n', l:'Highlight Intensity',min:0,  max:3,   step:0.01,  d:1.10,   f:2, r:[0.3,2.4] },
  { k:'ambient',        g:'lit', t:'n', l:'Ambient Light',     min:0,   max:2,   step:0.01,  d:0.55,   f:2, r:[0.1,1.5] },
  // rendering ---------------------------------------------------------------
  { k:'renderScale',    g:'rnd', t:'n', l:'Render Scale',      min:0.35,max:1.5, step:0.05,  d:1.00,   f:2, fixed:true },
  { k:'antiAlias',      g:'rnd', t:'n', l:'Anti-Aliasing',     min:1,   max:4,   step:1,     d:1,      f:0, fixed:true },
  { k:'temporalSpeed',  g:'rnd', t:'n', l:'Temporal Speed',    min:0,   max:2,   step:0.01,  d:1.00,   f:2, fixed:true },
  { k:'grain',          g:'rnd', t:'n', l:'Grain / Dither',    min:0,   max:1,   step:0.01,  d:0.22,   f:2, fixed:true },
  { k:'quality',        g:'rnd', t:'e', l:'Quality',           opts:['low','medium','high','ultra'], d:'high', fixed:true },
  { k:'adaptive',       g:'rnd', t:'b', l:'Adaptive Quality',  d:true,  fixed:true },
  { k:'targetFps',      g:'rnd', t:'e', l:'Target FPS',        opts:[30,60,90,120], d:60, fixed:true },
];
const P = new Map(PDEFS.map(d => [d.k, d]));
function factoryValues() { const o = {}; for (const d of PDEFS) o[d.k] = d.d; return o; }

const QUALITY = {
  low:    { idx:0, sim:0.30, maxSim:512,  curlOct:1, detailOct:2, warpOct:1, nsamp:6,  normR:3.4 },
  medium: { idx:1, sim:0.42, maxSim:704,  curlOct:2, detailOct:3, warpOct:1, nsamp:10, normR:2.6 },
  high:   { idx:2, sim:0.58, maxSim:960,  curlOct:2, detailOct:4, warpOct:2, nsamp:14, normR:2.0 },
  ultra:  { idx:3, sim:0.80, maxSim:1536, curlOct:3, detailOct:5, warpOct:2, nsamp:20, normR:1.5 },
};
const QUALITY_ORDER = ['low','medium','high','ultra'];

/* ------------------------------------------------------------------ presets */
const PRESETS = [
  { name:'Soap Film', values:{ flowSpeed:0.62, flowScale:0.95, turbulence:0.72, warp:1.05, vorticity:0.95,
      fineDetail:0.75, filmThickness:340, thicknessVar:1.05, drainage:0.62, tension:0.30, feed:0.55, surfaceRelief:0.95,
      interference:1.05, spectralSpread:0.95, dispersion:0.28, saturation:1.00, exposure:1.02, contrast:1.06,
      fresnel:1.10, envReflection:1.05, specular:1.20, specSharp:48, lightAz:38, lightEl:32, lightMotion:0.32,
      lightIntensity:1.05, ambient:0.62, grain:0.20 } },
  { name:'Oil Slick', values:{ flowSpeed:0.42, flowScale:1.55, turbulence:0.55, warp:1.85, vorticity:0.55,

const Status = (() => {
  const host = document.getElementById('status');
  const items = [];
  function push(level, text, detail) {
    const el = document.createElement('div');
    el.className = 'msg ' + level;
    const span = document.createElement('span');
    span.textContent = text;
    el.appendChild(span);
    if (detail) { const pre = document.createElement('pre'); pre.textContent = String(detail).slice(0, 4000); el.appendChild(pre); }
    const close = document.createElement('button');
    close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'dismiss');
    close.onclick = () => remove(el);
    el.appendChild(close);
    host.appendChild(el); items.push({ el, level, at: performance.now() });
    while (items.length > 5) remove(items[0].el);
    if (level !== 'err') setTimeout(() => remove(el), 11000);
  }
  function remove(el) { const i = items.findIndex(m => m.el === el); if (i >= 0) items.splice(i, 1); if (el.parentNode) el.parentNode.removeChild(el); }
  return { push, info: (t) => push('ok', t), warn: (t, d) => push('warn', t, d), error: (t, d) => push('err', t, d) };
})();

/* ------------------------------------------------------------------ shader core
   Authored in a disciplined WGSL subset (explicit types on every declaration, no
   pointers / arrays / structs beyond the uniform block) then mechanically lowered. */
const SHADER_MATH = `
const TAU: f32 = 6.28318531;
const FILM_N: f32 = 1.333;

fn hash21(p: vec2f) -> f32 {
  var q: vec2f = fract(p * vec2f(0.1031, 0.1030));
  q = q + dot(q, q.yx + 34.23);
  return fract((q.x + q.y) * q.x);
}
fn hash31(p: vec3f) -> f32 {
  var q: vec3f = fract(p * vec3f(0.1031, 0.1030, 0.0973));
  q = q + dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
fn gradDir(i: vec2f) -> vec2f {
  var a: f32 = hash21(i);
  var b: f32 = hash21(i + vec2f(37.4, 91.7));
  var g: vec2f = vec2f(a, b) * 2.0 - vec2f(1.0);
  return g / max(length(g), 0.0001);
}
fn noise2(p: vec2f) -> f32 {
  var ip: vec2f = floor(p);
  var f: vec2f = fract(p);
  var u: vec2f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  var n00: f32 = dot(gradDir(ip), f);
  var n10: f32 = dot(gradDir(ip + vec2f(1.0, 0.0)), f - vec2f(1.0, 0.0));
  var n01: f32 = dot(gradDir(ip + vec2f(0.0, 1.0)), f - vec2f(0.0, 1.0));
  var n11: f32 = dot(gradDir(ip + vec2f(1.0, 1.0)), f - vec2f(1.0, 1.0));
  return mix(mix(n00, n10, u.x), mix(n01, n11, u.x), u.y) * 2.15;
}
fn noise3(p: vec3f) -> f32 {
  var ip: vec3f = floor(p);
  var f: vec3f = fract(p);
  var u: vec3f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  var a: f32 = mix(hash31(ip), hash31(ip + vec3f(1.0, 0.0, 0.0)), u.x);
  var b: f32 = mix(hash31(ip + vec3f(0.0, 1.0, 0.0)), hash31(ip + vec3f(1.0, 1.0, 0.0)), u.x);
  var c: f32 = mix(hash31(ip + vec3f(0.0, 0.0, 1.0)), hash31(ip + vec3f(1.0, 0.0, 1.0)), u.x);
  var d: f32 = mix(hash31(ip + vec3f(0.0, 1.0, 1.0)), hash31(ip + vec3f(1.0, 1.1, 1.0)), u.x);
  return mix(mix(a, b, u.y), mix(c, d, u.y), u.z) * 2.0 - 1.0;
}
fn fbm2(p: vec2f, oct: i32) -> f32 {
  var s: f32 = 0.0; var a: f32 = 0.5; var q: vec2f = p;
  for (var i: i32 = 0; i < 6; i = i + 1) {
    if (i >= oct) { break; }
    s = s + a * noise2(q);
    q = q * 2.04 + vec2f(12.3, -7.7);
    a = a * 0.5;
  }
  return s;
}
fn fbm3(p: vec3f, oct: i32) -> f32 {
  var s: f32 = 0.0; var a: f32 = 0.5; var q: vec3f = p;
  for (var i: i32 = 0; i < 6; i = i + 1) {
    if (i >= oct) { break; }
    s = s + a * noise3(q);
    q = q * 2.07 + vec3f(3.1, -5.9, 8.3);
    a = a * 0.5;
  }
  return s;
}
fn ridged2(p: vec2f, oct: i32) -> f32 {
  var s: f32 = 0.0; var a: f32 = 0.5; var q: vec2f = p;
  for (var i: i32 = 0; i < 6; i = i + 1) {
    if (i >= oct) { break; }
    var n: f32 = noise2(q);
    var r: f32 = 1.0 - abs(n);
    s = s + a * r * r;
    q = q * 2.07 + vec2f(4.9, 2.1);
    a = a * 0.53;
  }
  return s / 0.92;
}
// curl of a scalar potential -> divergence free 2D flow
fn curlPot(p: vec3f, oct: i32) -> vec2f {
  var e: f32 = 0.55;
  var dy: f32 = fbm3(p + vec3f(0.0, e, 0.0), oct) - fbm3(p - vec3f(0.0, e, 0.0), oct);
  var dx: f32 = fbm3(p + vec3f(e, 0.0, 0.0), oct) - fbm3(p - vec3f(e, 0.0, 0.0), oct);
  return vec2f(dy, -dx) / (2.0 * e);
}
fn domainWarp2(p: vec2f, amt: f32, oct: i32, tt: f32) -> vec2f {
  var q: vec2f = vec2f(fbm2(p + vec2f(0.0, tt * 0.55), oct), fbm2(p + vec2f(5.2, 1.3 - tt * 0.41), oct));
  var r1: f32 = fbm2(p + 2.3 * q + vec2f(1.7, 9.2) + vec2f(tt * 0.29, -tt * 0.21), oct);
  var r2: f32 = fbm2(p + 2.3 * q + vec2f(8.3, 2.8) + vec2f(-tt * 0.26, tt * 0.33), oct);
  return p + amt * (q + 0.6 * vec2f(r1, r2));
}
fn vortexAt(w: vec2f, c: vec2f, s: f32) -> vec2f {
  var d: vec2f = w - c;
  var r2: f32 = dot(d, d);
  return vec2f(-d.y, d.x) * (s / (1.0 + r2 * 5.5));
}
fn dirFromAzEl(azDeg: f32, elDeg: f32) -> vec3f {
  var az: f32 = azDeg * 0.01745329;
  var el: f32 = elDeg * 0.01745329;
  var ce: f32 = cos(el);
  return normalize(vec3f(ce * sin(az), sin(el), ce * cos(az)));
}
fn specSens(lam: f32) -> vec3f {
  var r: f32 = (lam - 610.0) / 42.0;
  var g: f32 = (lam - 545.0) / 40.0;
  var b: f32 = (lam - 452.0) / 38.0;
  return vec3f(exp(-0.5 * r * r), exp(-0.5 * g * g), exp(-0.5 * b * b));
}
// Two-beam interference of a dielectric slab, sampled across the visible spectrum.
// deltaNm is the optical path difference; each output channel may carry a small
// dispersion offset so hues separate at grazing angles.
fn filmReflect(deltaNm: f32, amp: f32, order: f32, disp: f32, nsamp: i32) -> vec3f {
  var acc: vec3f = vec3f(0.0);
  for (var i: i32 = 0; i < 24; i = i + 1) {
    if (i >= nsamp) { break; }
    var lam: f32 = mix(395.0, 715.0, (f32(i) + 0.5) / f32(nsamp));
    var s: vec3f = specSens(lam);
    var dl: f32 = deltaNm / lam;
    var pR: f32 = TAU * dl * (1.0 + disp * 0.075);
    var pG: f32 = TAU * dl;
    var pB: f32 = TAU * dl * (1.0 - disp * 0.075);
    var vR: f32 = (0.5 - 0.5 * cos(pR)) + order * (0.5 - 0.5 * cos(2.0 * pR + 0.55));
    var vG: f32 = (0.5 - 0.5 * cos(pG)) + order * (0.5 - 0.5 * cos(2.0 * pG + 0.55));
    var vB: f32 = (0.5 - 0.5 * cos(pB)) + order * (0.5 - 0.5 * cos(2.0 * pB + 0.55));
    acc = acc + vec3f(s.x * vR, s.y * vG, s.z * vB);
  }
  var nrm: f32 = max(0.30 * f32(nsamp), 0.001);
  return vec3f(0.05) + acc * (amp / nrm);
}
fn tonemapACES(x: vec3f) -> vec3f {
  var v: vec3f = max(x, vec3f(0.0));
  v = (v * (v * 2.51 + vec3f(0.03))) / (v * (v * 2.43 + vec3f(0.59)) + vec3f(0.14));
  return clamp(v, vec3f(0.0), vec3f(1.0));
}
fn saturate3(c: vec3f, s: f32) -> vec3f {
  var l: f32 = dot(c, vec3f(0.2126, 0.7152, 0.0722));
  return mix(vec3f(l), c, s);
}
// Moving reflection environment, decoupled from the fluid time base.
fn envField(d: vec3f, tt: f32, amt: f32) -> vec3f {
  var up: f32 = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
  var base: vec3f = mix(vec3f(0.018, 0.030, 0.048), vec3f(0.30, 0.38, 0.50), smoothstep(0.12, 0.95, up));
  var a: f32 = atan2(d.y, d.x);
  var band1: f32 = pow(max(sin(a - tt * 0.21), 0.0), 9.0);
  var band2: f32 = pow(max(sin(a * 2.7 + tt * 0.13 + 1.1), 0.0), 17.0);
  var band3: f32 = pow(max(sin(a * 5.1 - tt * 0.33 + 2.3), 0.0), 26.0);
  var sweep: vec3f = vec3f(1.0, 0.95, 0.88) * band1 * 1.6
              + vec3f(0.72, 0.88, 1.0) * band2 * 1.15
              + vec3f(0.95, 0.80, 1.0) * band3 * 0.7;
  var s: f32 = max(d.z, 0.0) - 0.92;
  var glow: f32 = exp(-2.4 * s * s);
  return (base + sweep) * (0.30 + 0.70 * glow) * amt;
}
fn ditherVal(px: vec2f, tt: f32) -> f32 {
  var j: vec2f = vec2f(fract(tt * 0.61803399), fract(tt * 0.38196602));
  return hash21(floor(px) + j * 71.3) - 0.5;
}
fn safeF(v: f32, lo: f32, hi: f32, fb: f32) -> f32 {
  if (!(v > lo && v < hi)) { return fb; }
  return v;
}
`;

const SHADER_BODY = `
fn detailAt(w: vec2f) -> f32 {
  var t: f32 = u.u0.x;
  var sd: vec2f = vec2f(u.u14.x * 13.71, u.u14.x * 7.37);
  var p: vec2f = w * u.u9.w + sd;
  var ow: i32 = i32(clamp(u.u12.y, 1.0, 6.0));
  var od: i32 = i32(clamp(u.u12.x, 1.0, 6.0));
  var q: vec2f = domainWarp2(p, 0.25 + u.u1.z * 0.5, ow, t * 0.055);
  var fine: f32 = ridged2(q * 2.1 + vec2f(t * 0.041, -t * 0.029), od);
  var cap: f32 = noise2(q * 4.7 + vec2f(sin(t * 0.13) * 2.5, cos(t * 0.11) * 2.5));
  var mid: f32 = fbm2(q * 0.72 - vec2f(t * 0.019, t * 0.011), 3);
  return fine * 0.48 + cap * 0.19 + mid * 0.33;
}
fn thickAt(w: vec2f, tuv: vec2f) -> f32 {
  var st: vec4f = stateAt(tuv);
  var det: f32 = detailAt(w);
  return st.x + det * (0.085 * u.u9.z) + st.w * 0.045;
}
fn simMain(fc: vec2f, w: vec2f) -> vec4f {
  var tuv: vec2f = fc * u.u3.xy;
  var t: f32 = u.u0.x;
  var dt: f32 = clamp(u.u0.y, 0.0006, 0.018);
  var fs: f32 = u.u0.z;
  var tx: vec2f = vec2f(u.u3.x, 0.0);
  var upy: vec2f = vec2f(0.0, sign(u.u4.y) * u.u3.y);
  var c0: vec4f = stateAt(tuv);
  var cR: vec4f = stateAt(tuv + tx);
  var cL: vec4f = stateAt(tuv - tx);
  var cU: vec4f = stateAt(tuv + upy);
  var cD: vec4f = stateAt(tuv - upy);
  var h: f32 = c0.x;
  var vel: vec2f = c0.yz;
  var vh: f32 = c0.w;
  var aspect: f32 = u.u13.x;
  var sd: vec2f = vec2f(u.u14.x * 9.13, u.u14.x * 4.77);

  var dh0: f32 = 0.0;
  var dvh: f32 = 0.0;
  var oc: i32 = i32(clamp(u.u11.w, 1.0, 6.0));
  var ow: i32 = i32(clamp(u.u12.y, 1.0, 6.0));

  // --- multi scale forcing: domain warped curl + slow rotation + wandering vortices
  var wp: vec2f = domainWarp2(w * u.u1.x + sd, u.u1.z, ow, t * 0.1);
  var f: vec2f = curlPot(vec3f(wp, t * 0.16), oc) * (0.95 * u.u1.y);
  var sw: f32 = 0.15 + 0.13 * noise3(vec3f(w * 0.33, t * 0.047));
  f = f + sw * vec2f(-w.y, w.x);
  f = f + vortexAt(w, vec2f(sin(t * 0.113) * 0.60 * aspect, cos(t * 0.081) * 0.55), 0.55 * u.u1.w);
  f = f + vortexAt(w, vec2f(cos(t * 0.061 + 1.9) * 0.72 * aspect, sin(t * 0.097 + 0.6) * 0.60), -0.48 * u.u1.w);
  f = f + vortexAt(w, vec2f(sin(t * 0.037 + 4.1) * 0.42 * aspect, cos(t * 0.049 + 2.2) * 0.78), 0.30 * u.u1.w);

  // --- thickness gradient acts as pressure: thick regions spread, gravity drains
  var wsx: f32 = max(u.u3.z, 0.00002);
  var wsy: f32 = max(u.u3.w, 0.00002);
  var gh: vec2f = vec2f((cR.x - cL.x) / (2.0 * wsx), (cU.x - cD.x) / (2.0 * wsy));
  f = f - gh * (0.42 * u.u2.x);
  f.y = f.y - u.u2.x * (0.30 * h + 0.09);

  // --- cheap vorticity amplification (confinement surrogate)
  var om: f32 = (cR.y - cL.y) - (cU.x - cD.x);
  f = f + om * vel * (2.2 * u.u1.w);

  // --- continuous pointer force (push / drag / attract)
  if (u.u5.w > 0.002) {
    var dp: vec2f = w - u.u5.xy;
    var r2: f32 = dot(dp, dp);
    var fall: f32 = exp(-r2 * 5.5);
    var invd: f32 = 1.0 / max(sqrt(r2), 0.03);
    f = f + (dp * invd * 0.85 + u.u6.xy * 2.4) * fall * u.u5.z;
    dvh = dvh - fall * abs(u.u5.z) * 0.9 * dt;
  }
  // --- discrete impulses (clicks, fast drags, ripples)
  for (var i: i32 = 0; i < 16; i = i + 2) {
    var ia: vec4f = u.uImp[i];
    if (ia.z <= 0.0) { break; }
    var ib: vec4f = u.uImp[i + 1];
    var dd: vec2f = w - ia.xy;
    var rr: f32 = dot(dd, dd);
    var rad: f32 = max(ia.w, 0.02);
    var fl: f32 = exp(-rr / (rad * rad));
    var mode: f32 = ib.w;
    var pushS: f32 = mix(1.0, -1.0, step(0.5, mode) * (1.0 - step(1.5, mode)));
    var rip: f32 = step(1.5, mode);
    var invr: f32 = 1.0 / max(sqrt(rr), 0.03);
    f = f + (dd * invr * pushS * 1.15 + ib.xy * 2.0) * fl * ia.z;
    dvh = dvh + fl * ia.z * (0.8 + 6.5 * rip) * dt * 60.0 * dt;
    dh0 = dh0 + fl * ia.z * 0.05 * (1.0 - rip);
  }

  // --- semi-Lagrangian advection of the whole film state
  var vNew: vec2f = vel + f * dt * (0.35 + fs);
  var sp: f32 = length(vNew);
  if (sp > 1.8) { vNew = vNew * (1.8 / sp); }
  vNew = vNew * exp(-1.9 * dt);
  var back: vec2f = tuv - vec2f(vNew.x * u.u4.x, vNew.y * u.u4.y) * dt * (0.3 + fs);
  var s1: vec4f = stateAt(back);
  var hN: f32 = s1.x;
  var vhN: f32 = s1.w;

  // --- surface tension (diffusion) + capillary wave equation (CFL clamped)
  var lap: f32 = (cR.x + cL.x + cU.x + cD.x - 4.0 * c0.x);
  var wsA: f32 = 0.5 * (wsx + wsy);
  var cw: f32 = min(u.u2.w, wsA / (dt * 1.45));
  var dT: f32 = min(u.u2.y * 0.0009, 0.44 * wsA * wsA / dt);
  vhN = vhN + dt * ((cw * cw / (wsA * wsA)) * lap - 2.3 * vhN) + dvh;
  hN = hN + dt * vhN * 2.6 + dh0 + dt * dT * lap / (wsA * wsA);

  // --- liquid feed patches + uneven drainage
  var src: f32 = smoothstep(0.08, 0.82, noise3(vec3f(w * 0.72 + vec2f(3.1, -2.4) + sd, t * 0.085)));
  hN = hN + dt * u.u2.z * src * 2.1 * (1.25 - hN);
  var dr: f32 = 0.5 + 0.5 * noise3(vec3f(w * 1.25 + vec2f(-8.0, 5.0) - sd, t * 0.055));
  hN = hN - dt * u.u2.x * dr * smoothstep(0.05, 0.35, hN) * 1.05;

  // --- the frame reservoirs liquid at the border, like a real film on a hoop
  var ex: f32 = min(tuv.x, 1.0 - tuv.x);
  var ey: f32 = min(tuv.y, 1.0 - tuv.y);
  var edge: f32 = 1.0 - smoothstep(0.0, 0.05, min(ex, ey));
  hN = mix(hN, mix(0.62, 0.98, src), edge * 0.55);
  vNew = mix(vNew, vec2f(0.0), edge * 0.75);
  hN = mix(hN, 0.55, 0.0015);

  hN = safeF(hN, -1.0, 4.0, 0.5);
  vhN = safeF(vhN, -25.0, 25.0, 0.0);
  if (!(vNew.x > -60.0 && vNew.x < 60.0 && vNew.y > -60.0 && vNew.y < 60.0)) { vNew = vec2f(0.0); }
  return vec4f(clamp(hN, 0.015, 1.6), vNew.x, vNew.y, clamp(vhN, -6.0, 6.0));
}
fn presentSample(fc: vec2f, w: vec2f) -> vec4f {
  var t: f32 = u.u0.x;
  var tuv: vec2f = fc * u.u3.xy;
  var st: vec4f = stateAt(tuv);
  var rad: f32 = max(u.u12.w, 0.0002);
  var h0: f32 = thickAt(w, tuv);
  var hx: f32 = thickAt(w + vec2f(rad, 0.0), tuv + vec2f(rad * u.u4.x, 0.0));
  var hy: f32 = thickAt(w + vec2f(0.0, rad), tuv + vec2f(0.0, rad * u.u4.y));
  var dx: f32 = (hx - h0) / rad;
  var dy: f32 = (hy - h0) / rad;
  var gm: f32 = length(vec2f(dx, dy));
  var relief: f32 = u.u13.z * 0.030;
  var n: vec3f = normalize(vec3f(-dx * relief, -dy * relief, 1.0));
  var v: vec3f = normalize(vec3f(-w * 0.16, 1.0));
  var nv: f32 = max(dot(n, v), 0.02);
  // Snell inside the film -> longer optical path at grazing angles
  var sinT2: f32 = (1.0 - nv * nv) / (FILM_N * FILM_N);
  var cosF: f32 = max(sqrt(max(1.0 - sinT2, 0.04)), 0.18);
  var opd: f32 = (u.u7.x + (h0 - 0.5) * 780.0 * u.u7.y) / cosF;
  var amp: f32 = max(u.u7.z, 0.0);
  var order: f32 = 0.20 * clamp(u.u7.z, 0.0, 1.6);
  var ns: i32 = i32(clamp(u.u12.z, 3.0, 24.0));
  var film: vec3f = filmReflect(2.0 * FILM_N * opd * u.u7.w, amp, order, u.u13.w, ns);

  var l1: vec3f = dirFromAzEl(u.u10.x, u.u10.y);
  var lc1: vec3f = vec3f(1.0, 0.95, 0.88);
  var diff1: f32 = max(dot(n, l1), 0.0);
  var h1: vec3f = normalize(l1 + v);
  var sh1: f32 = max(3.0, u.u9.y * (0.35 + 1.3 * exp(-gm * 0.11)));
  var spec1: f32 = pow(max(dot(n, h1), 0.0), sh1);

  var la: f32 = t * max(u.u10.z, 0.0);
  var l2: vec3f = normalize(vec3f(sin(la) * 1.9 + 0.4 * sin(la * 0.41),
                                 0.5 + 0.5 * sin(la * 0.67 + 1.0),
                                 1.15 + 0.55 * cos(la * 1.13)));
  var lc2: vec3f = vec3f(0.70, 0.86, 1.0);
  var h2: vec3f = normalize(l2 + v);
  var sh2: f32 = max(3.0, u.u9.y * 0.55);
  var spec2: f32 = pow(max(dot(n, h2), 0.0), sh2);
  var diff2: f32 = max(dot(n, l2), 0.0);

  var refl: vec3f = reflect(-v, n);
  var fres: f32 = 0.03 + 0.97 * pow(1.0 - nv, 4.0);
  var fresS: f32 = fres * max(u.u8.w, 0.0);
  var env: vec3f = envField(refl, t, u.u14.y);
  var li: f32 = u.u10.w;

  var body: vec3f = film * (u.u11.x * 0.55 + 0.22)
              + film * diff1 * li * 0.55 * lc1
              + film * diff2 * li * 0.22 * lc2;
  var transm: vec3f = film * u.u11.x * (1.0 - 0.45 * clamp(h0, 0.0, 1.4));
  var spec: vec3f = (spec1 * lc1 + spec2 * lc2 * 0.75) * u.u9.x * (0.5 + 1.7 * fresS) * li;
  var col: vec3f = body + transm * 0.5 + env * fresS * 1.35 + spec;

  // rim light along steep contours (curvature sensitive)
  col = col + film * pow(clamp(gm * 0.16, 0.0, 1.0), 1.35) * 0.40 * (0.5 + 0.5 * li);

  // pointer following highlight
  if (u.u6.w > 0.002) {
    var pd: vec2f = w - u.u5.xy;
    var glow: f32 = exp(-dot(pd, pd) * 3.6) * u.u6.w;
    var lp: vec3f = normalize(vec3f(-pd, 0.8));
    var hp: vec3f = normalize(lp + v);
    var sp: f32 = pow(max(dot(n, hp), 0.0), max(8.0, u.u9.y * 0.8));
    col = col + vec3f(1.0, 0.96, 0.92) * (sp * 1.4 + 0.12) * glow * max(u.u9.x, 0.0);
  }

  col = col * max(u.u8.y, 0.0);
  col = tonemapACES(col);
  col = saturate3(col, u.u8.x);
  col = (col - vec3f(0.5)) * u.u8.z + vec3f(0.5);
  var vr: f32 = clamp(length(vec2f(w.x / max(u.u13.x, 0.2), w.y)) * 0.60, 0.0, 1.0);
  col = col * (1.0 - 0.5 * vr * vr);
  col = col + vec3f(ditherVal(fc, t) * u.u11.y * 0.035);
  return vec4f(clamp(col, vec3f(0.0), vec3f(1.0)), 1.0);
}
fn presentMain(fc: vec2f, w: vec2f) -> vec4f {
  var ns: i32 = i32(clamp(u.u11.z, 1.0, 4.0));
  var amt: f32 = step(1.5, f32(ns));
  var acc: vec4f = vec4f(0.0);
  for (var i: i32 = 0; i < 4; i = i + 1) {
    if (i >= ns) { break; }
    var ang: f32 = (f32(i) + 0.5) * 2.39996323;
    var rr: f32 = sqrt((f32(i) + 0.5) / 4.0) * 0.75 * amt;
    var pj: vec2f = vec2f(cos(ang), sin(ang)) * rr;
    acc = acc + presentSample(fc + pj, w + pj * vec2f(u.u3.z, u.u3.w));
  }
  return acc / f32(ns);
}
`;

/* ---- WGSL lowering (source of truth above) -------------------------------- */
const TMAP = { f32:'float', i32:'int', u32:'uint', bool:'bool', vec2f:'vec2', vec3f:'vec3', vec4f:'vec4' };
function toGlsl(src) {
  src = src.replace(/fn\s+(\w+)\s*\(([^)]*)\)\s*(?:->\s*([A-Za-z0-9_]+)\s*)?\{/g, (m, name, args, ret) => {
    const out = String(args || '').split(',').map(s => s.trim()).filter(Boolean).map(a => {
      const parts = a.split(':').map(s => s.trim());
      return (TMAP[parts[1]] || parts[1] || 'float') + ' ' + parts[0];
    }).join(', ');
    return (ret ? (TMAP[ret] || ret) : 'void') + ' ' + name + '(' + out + ') {';
  });
  src = src.replace(/\b(?:var|const)\s+(\w+)\s*:\s*([A-Za-z0-9_]+)/g, (m, n, t) => (TMAP[t] || t) + ' ' + n);
  src = src.replace(/\b(f32|i32|u32|vec2f|vec3f|vec4f)\s*\(/g, (m, t) => TMAP[t] + '(');
  src = src.replace(/\batan2\s*\(/g, 'atan(');
  return src;
}

const U_NAMES = ['u0','u1','u2','u3','u4','u5','u6','u7','u8','u9','u10','u11','u12','u13','u14','u15'];
const WGSL_HEADER = `
struct Uni { ${U_NAMES.map(n => n + ': vec4f').join(', ')}, uImp: array<vec4f, 16> };
@group(0) @binding(0) var<uniform> u: Uni;
@group(0) @binding(1) var filmTex: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
struct VSOut { @builtin(position) pos: vec4f, @location(0) world: vec2f };
@vertex fn vsMain(@builtin(vertex_index) vi: u32) -> VSOut {
  var tri: array<vec2f, 3> = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VSOut;
  var q: vec2f = tri[vi];
  o.pos = vec4f(q.x, -q.y, 0.0, 1.0);
  o.world = vec2f(q.x * u.u13.x, q.y);
  return o;
}
fn stateAt(tuv: vec2f) -> vec4f { return textureSampleLevel(filmTex, samp, tuv, 0.0); }
`;
const WGSL_FOOTER = `
@fragment fn fsSim(in: VSOut) -> @location(0) vec4f { return simMain(in.pos.xy, in.world); }
@fragment fn fsPresent(in: VSOut) -> @location(0) vec4f { return presentMain(in.pos.xy, in.world); }
`;
const GLSL_UNIFORMS = `layout(std140, binding = 0) uniform Uni { ${U_NAMES.map(n => 'vec4 ' + n + ';').join(' ')} vec4 uImp[16]; } u;`;
const GLSL_VS = `#version 300 es
precision highp float;
${GLSL_UNIFORMS}
out vec2 vWorld;
void main(){
  vec2 tri[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
  vec2 q = tri[gl_VertexID];
  gl_Position = vec4(q.x, q.y, 0.0, 1.0);
  vWorld = vec2(q.x * u.u13.x, q.y);
}`;
const GLSL_FS_HEAD = `#version 300 es
precision highp float;
precision highp int;
${GLSL_UNIFORMS}
uniform sampler2D filmTex;
in vec2 vWorld;
out vec4 fragColor;
vec4 stateAt(vec2 tuv){ return textureLod(filmTex, tuv, 0.0); }
`;

/* ------------------------------------------------------------------ uniform packing */
const UFLOATS = 16 * 4 + 16 * 4; // 128 floats: 16 named vec4 + 16 impulse vec4
function fillUniforms(F, ctx, pass) {
  const p = ctx.values, q = ctx.q;
  F[0] = ctx.time; F[1] = ctx.dt; F[2] = p.flowSpeed; F[3] = p.temporalSpeed;
  F[4] = p.flowScale; F[5] = p.turbulence; F[6] = p.warp; F[7] = p.vorticity;
  F[8] = p.drainage; F[9] = p.tension; F[10] = p.feed; F[11] = ctx.waveSpeed;
  const W = pass === 'sim' ? ctx.simW : ctx.rw;
  const H = pass === 'sim' ? ctx.simH : ctx.rh;
  F[12] = 1 / W; F[13] = 1 / H; F[14] = 2 * ctx.aspect / W; F[15] = 2 / H;
  F[16] = 1 / (2 * ctx.aspect); F[17] = ctx.ySign * 0.5; F[18] = 0; F[19] = 0;
  F[20] = ctx.ptr.x; F[21] = ctx.ptr.y; F[22] = ctx.ptr.strength * ctx.ptr.mode; F[23] = ctx.ptr.active;
  F[24] = ctx.ptr.vx; F[25] = ctx.ptr.vy; F[26] = ctx.ptr.pulse; F[27] = ctx.ptr.glow;
  F[28] = p.filmThickness; F[29] = p.thicknessVar; F[30] = p.interference * 0.9; F[31] = p.spectralSpread;
  F[32] = p.saturation; F[33] = p.exposure; F[34] = p.contrast; F[35] = p.fresnel;
  F[36] = p.specular; F[37] = p.specSharp; F[38] = p.fineDetail; F[39] = ctx.detailScale;
  F[40] = p.lightAz; F[41] = p.lightEl; F[42] = p.lightMotion; F[43] = p.lightIntensity;
  F[44] = p.ambient; F[45] = p.grain; F[46] = ctx.aaSamples; F[47] = q.curlOct;
  F[48] = q.detailOct; F[49] = q.warpOct; F[50] = q.nsamp; F[51] = q.normR * ctx.normScale;
  F[52] = ctx.aspect; F[53] = q.idx; F[54] = p.surfaceRelief; F[55] = p.dispersion;
  F[56] = p.seed; F[57] = p.envReflection; F[58] = 0; F[59] = 0;
  F.fill(0, 60, 64);
  for (let i = 0; i < 8; i++) {
    const im = ctx.impulses[i];
    const o = 64 + i * 8;
    if (im && im.strength > 0) {
      F[o] = im.x; F[o + 1] = im.y; F[o + 2] = im.strength; F[o + 3] = im.radius;
      F[o + 4] = im.vx; F[o + 5] = im.vy; F[o + 6] = im.age; F[o + 7] = im.mode;
    } else { F[o] = 0; F[o + 1] = 0; F[o + 2] = 0; F[o + 3] = 0; F[o + 4] = 0; F[o + 5] = 0; F[o + 6] = 0; F[o + 7] = 0; }
  }
}

/* ------------------------------------------------------------------ application state */
const State = {
  values: factoryValues(),
  from: factoryValues(),
  to: factoryValues(),
  tweenT: 1,
  tweenDur: 0.9,
  preset: 'custom',
  paused: false,
  collapsed: false,
  hidden: false,
  effectiveScale: 1,       // adaptive-quality owned
  manualScale: 1,
  time: 0,
  warm: false,
};

const Pointer = {
  x: 0, y: 0, vx: 0, vy: 0, sx: 0, sy: 0,
  strength: 0, active: 0, glow: 0, pulse: 0, mode: 1,
  down: false, lastMove: -10, impulses: [],
  add(x, y, vx, vy, strength, radius, mode) {
    this.impulses.unshift({ x, y, vx, vy, strength, radius, mode, age: 0, life: mode >= 1.5 ? 1.3 : 0.55 });
    if (this.impulses.length > 8) this.impulses.length = 8;
  },
  step(dt) {
    for (let i = this.impulses.length - 1; i >= 0; i--) {
      const im = this.impulses[i];
      im.age += dt;
      im.strength *= Math.exp(-2.2 * dt);
      if (im.age > im.life || im.strength < 0.002) this.impulses.splice(i, 1);
    }
    this.active *= Math.exp(-6.0 * dt);
    this.glow *= Math.exp(-1.4 * dt);
    this.pulse *= Math.exp(-5.0 * dt);
    this.vx *= Math.exp(-7.0 * dt); this.vy *= Math.exp(-7.0 * dt);
    if (!this.down) this.strength *= Math.exp(-3.0 * dt);
  },
};

/* ------------------------------------------------------------------ performance monitor */
class PerfMonitor {
  constructor(targetFps) { this.samples = []; this.fps = 60; this.frameMs = 16; this.median = 16;
    this.target = targetFps || 60; this.lastReport = 0; this.trend = []; this.phase = 0; }
  sample(ms) {
    this.samples.push(ms);
    if (this.samples.length > 120) this.samples.shift();
    this.fps += (1000 / Math.max(ms, 0.01) - this.fps) * 0.08;
    this.frameMs = ms;
    const s = this.samples.slice().sort((a, b) => a - b);
    this.median = s[Math.floor(s.length * 0.5)] || ms;
  }
  // returns +1 (raise quality), -1 (lower), 0 (hold) with hysteresis + cooldown
  advise(now) {
    const targetMs = 1000 / this.target;
    if (this.samples.length < 45) return 0;
    if (now - this.lastReport < 1600) return 0;
    this.lastReport = now;
    let sum = 0; const n = Math.min(60, this.samples.length);
    for (let i = this.samples.length - n; i < this.samples.length; i++) sum += this.samples[i];
    const avg = sum / n;
    this.trend.push(avg); if (this.trend.length > 4) this.trend.shift();
    if (avg > targetMs * 1.14) return -1;
    if (avg < targetMs * 0.70 && this.trend.length >= 3 && this.trend.every(v => v < targetMs * 0.78)) return 1;
    return 0;
  }
  reset() { this.samples.length = 0; this.trend.length = 0; }
}

/* ------------------------------------------------------------------ renderer contract
   init() / resize() / render(simU, drawU, substeps) / warm(n) / destroy() / capture() */
class WebGPURenderer {
  constructor(canvas) {
    this.canvas = canvas; this.name = 'WebGPU'; this.ySign = -1;
    this.idx = 0; this.ring = 0; this.bufs = []; this.tex = []; this.simBind = []; this.viewBind = [];
    this.captureTex = null; this.disposed = false;
  }
  static get supported() { return typeof navigator !== 'undefined' && !!navigator.gpu; }
  async init() {
    if (!navigator.gpu) throw new Error('navigator.gpu unavailable');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('No suitable GPU adapter was returned.');
    this.device = await adapter.requestDevice();
    this.device.lost.then(info => {
      Status.error('WebGPU device lost (' + (info && info.reason ? info.reason : 'unknown') + '). Falling back to WebGL2.');
      App.fallback('webgpu-lost');
    });
    this.context = this.canvas.getContext('webgpu');
    if (!this.context) throw new Error('Could not acquire a WebGPU canvas context.');
    this.format = navigator.gpu.getPreferredCanvasFormat();
    this.captureFormat = 'rgba8unorm';
    const code = WGSL_HEADER + SHADER_MATH + SHADER_BODY + WGSL_FOOTER;
    const gl = await this.compile(code);
    this.bgl = this.device.createBindGroupLayout({
      entries: [
        { binding: 0, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
        { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float', viewDimension: '2d', multisampled: false } },
        { binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
      ],
    });
    const mkPipe = (entry, fmt) => this.device.createRenderPipeline({
      layout: this.device.createPipelineLayout({ bindGroupLayouts: [this.bgl] }),
      vertex: { module: gl, entryPoint: 'vsMain' },
      fragment: { module: gl, entryPoint: entry, targets: [{ format: fmt }] },
      primitive: { topology: 'triangle-list' },
    });
    this.simPipeline = await this.guard('sim pipeline', () => mkPipe('fsSim', 'rgba16float'));
    this.presentPipeline = await this.guard('present pipeline', () => mkPipe('fsPresent', this.format));
    this.capturePipeline = await this.guard('capture pipeline', () => mkPipe('fsPresent', this.captureFormat));
    this.sampler = this.device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
    for (let i = 0; i < 5; i++) {
      this.bufs.push(this.device.createBuffer({ size: UFLOATS * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }));
    }
    this.ready = false;
  }
  async compile(code) {
    this.device.pushErrorScope('validation');
    const module = this.device.createShaderModule({ code, label: 'tffilm' });
    const info = await module.getCompilationInfo();
    const fatal = info.messages.filter(m => m.type === 'error');
    if (fatal.length) {
      await this.device.popErrorScope();
      throw new Error('WGSL compilation failed:\n' + fatal.map(m => 'line ' + m.lineNum + ': ' + m.message).join('\n'));
    }
    await this.device.popErrorScope();
    return module;
  }
  async guard(label, fn) {
    this.device.pushErrorScope('validation');
    let res;
    try { res = fn(); } catch (e) { await this.device.popErrorScope(); throw new Error(label + ': ' + e.message); }
    const err = await this.device.popErrorScope();
    if (err) throw new Error(label + ' failed validation: ' + (err.message || err));
    return res;
  }
  resize(rw, rh, simW, simH) {
    this.rw = rw; this.rh = rh; this.simW = simW; this.simH = simH;
    this.context.configure({ device: this.device, format: this.format, alphaMode: 'opaque',
      usage: GPUTextureUsage.RENDER_ATTACHMENT });
    for (const t of this.tex) if (t) t.destroy();
    this.tex = [];
    const mk = () => this.device.createTexture({ size: { width: simW, height: simH }, format: 'rgba16float',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    for (let i = 0; i < 2; i++) this.tex.push(mk());
    const mkBind = (tex) => this.device.createBindGroup({ layout: this.bgl, entries: [
      { binding: 0, resource: { buffer: this.bufs[0] } },
      { binding: 1, resource: tex.createView() },
      { binding: 2, resource: this.sampler },
    ] });
    this.simBind = [mkBind(this.tex[0]), mkBind(this.tex[1])];
    this.viewBind = [mkBind(this.tex[0]), mkBind(this.tex[1])];
    this.idx = 0;
    if (this.captureTex) { this.captureTex.destroy(); this.captureTex = null; }
    this.clearAll();
    this.ready = true;
  }
  clearAll() {
    const enc = this.device.createCommandEncoder();
    for (const t of this.tex) {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: t.createView(),
        clearValue: { r: 0.56, g: 0, b: 0, a: 0 }, loadOp: 'clear', storeOp: 'store' }] });
      p.end();
    }
    this.device.queue.submit([enc.finish()]);
  }
  nextBuf() { this.ring = (this.ring + 1) % this.bufs.length; return this.bufs[this.ring]; }
  render(simU, drawU, substeps) {
    if (!this.ready) return;
    const enc = this.device.createCommandEncoder();
    for (let s = 0; s < substeps; s++) {
      const b = this.nextBuf();
      this.device.queue.writeBuffer(b, 0, simU);
      this.device.queue.writeBuffer(this.bufs[0], 0, simU);
      const dst = this.tex[1 - this.idx];
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: dst.createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: 'clear', storeOp: 'store' }] });
      pass.setPipeline(this.simPipeline);
      pass.setBindGroup(0, this.simBind[this.idx]);
      pass.draw(3); pass.end();
      this.idx = 1 - this.idx;
    }
    this.device.queue.writeBuffer(this.bufs[0], 0, drawU);
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: this.context.getCurrentTexture().createView(),
      clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }] });
    pass.setPipeline(this.presentPipeline);
    pass.setBindGroup(0, this.viewBind[this.idx]);
    pass.draw(3); pass.end();
    this.device.queue.submit([enc.finish()]);
  }
  warmUniforms() { return App.uniformFor('warm'); }
  async capture() {
    const w = this.rw, h = this.rh;
    const bytesPerRow = Math.ceil((w * 4) / 256) * 256;
    const tex = this.device.createTexture({ size: { width: w, height: h }, format: this.captureFormat,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const buf = this.device.createBuffer({ size: bytesPerRow * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = this.device.createCommandEncoder();
    const drawU = App.uniformFor('present');
    this.device.queue.writeBuffer(this.bufs[0], 0, drawU);
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: tex.createView(),
      clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }] });
    pass.setPipeline(this.capturePipeline);
    pass.setBindGroup(0, this.viewBind[this.idx]);
    pass.draw(3); pass.end();
    enc.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow, rowsPerImage: h }, { width: w, height: h });
    this.device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const src = new Uint8Array(buf.getMappedRange());
    const out = new Uint8ClampedArray(w * h * 4);
    for (let y = 0; y < h; y++) {
      const srow = (h - 1 - y) * bytesPerRow, drow = y * w * 4;
      for (let x = 0; x < w; x++) {
        const si = srow + x * 4, di = drow + x * 4;
        out[di] = src[si + 2]; out[di + 1] = src[si + 1]; out[di + 2] = src[si]; out[di + 3] = 255;
      }
    }
    buf.unmap(); buf.destroy(); tex.destroy();
    return imageToBlob(new ImageData(out, w, h));
  }
  destroy() {
    this.disposed = true;
    try { for (const t of this.tex) if (t) t.destroy();
      if (this.captureTex) this.captureTex.destroy();
      for (const b of this.bufs) b.destroy();
      if (this.device && this.device.destroy) this.device.destroy(); } catch (e) { /* ignore */ }
  }
}

class WebGL2Renderer {
  constructor(canvas) {
    this.canvas = canvas; this.name = 'WebGL2'; this.ySign = 1;
    this.idx = 0; this.tex = []; this.fbos = [];
  }
  static get supported() { try { const c = document.createElement('canvas'); return !!(window.WebGL2RenderingContext && c.getContext('webgl2')); } catch (e) { return false; } }
  async init() {

function imageToBlob(imgData) {
  return new Promise(resolve => {
    try {
      const c = document.createElement('canvas');
      c.width = imgData.width; c.height = imgData.height;
      const x = c.getContext('2d');
      x.putImageData(imgData, 0, 0);
      c.toBlob(b => resolve(b), 'image/png');
    } catch (e) { Status.warn('Frame capture failed', e && e.message); resolve(null); }
  });
}

/* ------------------------------------------------------------------ persistence */
const Persistence = (() => {
  const KEY = 'thinfilm.lab.v1';
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    const out = { values: {}, preset: 'custom' };
    const src = (raw.values && typeof raw.values === 'object') ? raw.values : null;
    if (!src) return null;
    for (const d of PDEFS) {
      const v = src[d.k];
      if (v === undefined || v === null) continue;
      if (d.t === 'n') {
        const n = Number(v);
        if (!Number.isFinite(n)) continue;
        out.values[d.k] = Math.min(d.max, Math.max(d.min, n));
      } else if (d.t === 'e') {
        if (d.opts.some(o => String(o) === String(v))) out.values[d.k] = d.opts.find(o => String(o) === String(v));
      } else if (d.t === 'b') {
        out.values[d.k] = !!v;
      }
    }
    if (typeof raw.preset === 'string') out.preset = raw.preset;
    if (typeof raw.collapsed === 'boolean') out.collapsed = raw.collapsed;
    return out;
  }
  function load() {
    try {
      const s = localStorage.getItem(KEY);
      if (!s) return null;
      const parsed = JSON.parse(s);
      const ok = sanitize(parsed);
      if (!ok) Status.warn('Stored settings were invalid — using defaults.');
      return ok;
    } catch (e) {
      Status.warn('Could not read stored settings (' + (e && e.message ? e.message : 'error') + ')');
      return null;
    }
  }
  function save(obj) { try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) { /* quota / privacy mode */ } }
  function clear() { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } }
  return { load, save, clear, sanitize };
})();

    const s = document.createElement('span'); s.textContent = name;
    const sel = document.createElement('select');
    for (const o of opts) {
      const opt = document.createElement('option');
      opt.value = String(o); opt.textContent = String(o);
      if (String(o) === String(value)) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.setAttribute('aria-label', name);
    sel.addEventListener('change', () => {
      const raw = sel.value;
      const match = opts.find(o => String(o) === raw);
      onChange(match);
    });
    f.appendChild(s); f.appendChild(sel);
    return f;
  },
  makeActions(app) {
    const det = document.createElement('details'); det.className = 'sec'; det.open = true;
    det.innerHTML = '<summary><span class="chev"></span><span>Session</span></summary>';
    const wrap = document.createElement('div'); wrap.className = 'secbody';
    const row1 = document.createElement('div'); row1.className = 'btnrow';
    const mk = (label, fn, cls, title) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (cls ? ' ' + cls : '');
      b.textContent = label; if (title) b.title = title; b.addEventListener('click', fn); return b;
    };
    this.els.pause = mk('Pause', () => app.togglePause(), null, 'Space');
    this.els.mutate = mk('Mutate', () => app.mutate(), null, 'M — coherent variation of the current state');
    this.els.random = mk('Randomize', () => app.randomize(), null, 'Shift+M — fresh random state');
    const reset = mk('Reset', () => app.resetAll(), null, 'R — back to the current preset');
    const factory = mk('Factory', () => app.factoryReset(), 'danger', 'Remove saved settings and return every parameter to factory defaults');
    row1.append(this.els.pause, this.els.mutate, this.els.random, reset, factory);
    const row2 = document.createElement('div'); row2.className = 'btnrow';
    this.els.fs = mk('Fullscreen', () => app.toggleFullscreen(), null, 'F');
    const cap = mk('Capture PNG', () => app.capture(), null, 'Save the frame without UI');
    const exp = mk('Export', () => app.openExport());
    const imp = mk('Import', () => app.openImport());
    const hide = mk('Hide UI', () => app.setHidden(true), null, 'H');
    row2.append(this.els.fs, cap, exp, imp, hide);
    const keys = document.createElement('div'); keys.className = 'keys';
    const seq = [['Space', 'pause'], ['R', 'reset'], ['M', 'mutate'], ['⇧M', 'random'], ['F', 'fullscreen'], ['H', 'interface'], ['1–6', 'presets']];
    keys.innerHTML = '<span>keys</span>';
    for (const [k, v] of seq) {
      const kb = document.createElement('kbd'); kb.textContent = k; kb.title = v; keys.appendChild(kb);
    }
    wrap.append(row1, row2, keys);
    det.appendChild(wrap);
    return det;
  },
  makeAbout() {
    const d = document.createElement('div');
    d.className = 'note';
    d.style.padding = '9px 2px 2px';
    d.textContent = 'Drag on the film to push it · Shift-drag to gather · click for ripples. Thickness drives colour through sampled thin-film interference.';
    return d;
  },
  setBadge(text, warn) {
    this.els.badge.textContent = text;
    this.els.badge.classList.toggle('warn', !!warn);
  },
  syncInputs() {
    for (const [k, r] of this.rows) {
      const v = State.values[k];
      if (r.input.value !== String(v) && Math.abs(parseFloat(r.input.value) - v) > 1e-6) r.input.value = v;
      r.val.textContent = fmtVal(r.def, v);

    if (this.els.adaptive) this.els.adaptive.checked = !!State.values.adaptive;
  },
  markPreset(name) {
